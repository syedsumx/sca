name: cairn

on:
  push:
    paths: ["cairn/**", ".github/workflows/cairn-ci.yml"]
  pull_request:
    paths: ["cairn/**", ".github/workflows/cairn-ci.yml"]
  workflow_dispatch:

concurrency:
  group: cairn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: cairn

env:
  CAIRN_VERSION: 0.1.0
  PLAYWRIGHT_VERSION: 1.56.1

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:          # migration tests also run on Postgres (CAIRN_TEST_PG_URL)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cairn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cairn/pyproject.toml
      - run: pip install -e ".[server,ai,test,postgres]" ruff
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        env:
          CAIRN_TEST_PG_URL: postgresql+psycopg://postgres:test@localhost:5432/cairn
        run: pytest -q
      - name: Policy bundle and its decision tests
        run: |
          cairn policies validate config/policies
          cairn policies test config/policies config/policy-tests

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cairn/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn/plugins/java/cairn-authorizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --no-daemon test jar

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Lint and validate every values profile
        run: |
          helm lint helm/cairn helm/cairn-remote-agent
          for values in "" "-f helm/cairn/values-active-metadata.yaml" "-f helm/cairn/values-authoritative.yaml"; do
            # shellcheck disable=SC2086
            helm template cairn helm/cairn $values \
              | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0
          done
          helm template agent helm/cairn-remote-agent \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0

  # Builds every image, starts the full stack and runs the live suites against it. One job, because
  # the images (~10 GB) are not worth moving between jobs.
  stack:
    needs: [python, ui, java]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Web UI bundle (cached per engine release and white-label patch)
        id: webui
        uses: actions/cache@v4
        with:
          path: cairn/core/web/build/web-ui-assets.jar
          key: webui-${{ hashFiles('cairn/core/UPSTREAM_VERSION', 'cairn/core/web/**') }}
      - name: Build web UI bundle
        if: steps.webui.outputs.cache-hit != 'true'
        run: core/web/build.sh "$RUNNER_TEMP/webui"

      - name: Build images
        run: deploy/build-images.sh

      - name: Vulnerability database (fallback registries, retried)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          for attempt in 1 2 3; do
            docker run --rm -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" aquasec/trivy:0.57.1 image --download-db-only \
              --db-repository ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 \
              && exit 0
            sleep $((attempt * 20))
          done
          exit 1
      - name: Scan Cairn-owned images (fail on fixable critical CVEs)
        run: |
          for img in platform remote-agent; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.57.1 image --skip-db-update --quiet --scanners vuln --severity CRITICAL --ignore-unfixed \
              --exit-code 1 "cairn/${img}:${CAIRN_VERSION}"
          done
      - name: Scan remaining images (report only)
        run: |
          for img in consumer-ui core web setup executor; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.57.1 image --skip-db-update --quiet --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
              --format table "cairn/${img}:${CAIRN_VERSION}" \
              > "$RUNNER_TEMP/trivy-${img}.txt" || true
          done
      - name: SBOMs
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          for img in platform consumer-ui remote-agent authorizer core web setup executor; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.18.1 \
              "cairn/${img}:${CAIRN_VERSION}" -o spdx-json > "$RUNNER_TEMP/sbom/${img}.spdx.json"
          done

      - name: Start the stack
        run: |
          {
            echo "CAIRN_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            for k in CAIRN_SYSTEM_CLIENT_SECRET CAIRN_SESSION_SIGNING_KEY CAIRN_TOKEN_SALT CAIRN_WEB_SECRET \
                     CAIRN_DB_PASSWORD CAIRN_DB_ROOT_PASSWORD CAIRN_SERVICE_TOKEN CAIRN_ACTION_LINK_SECRET \
                     CAIRN_EMBED_SIGNING_SECRET CAIRN_SLACK_SIGNING_SECRET CAIRN_SCIM_TOKEN; do
              echo "${k}=$(openssl rand -hex 32)"
            done
          } > .env
          # Embed origins the e2e suite exercises (test_11, test_20: localhost:8099 is the partner page).
          echo "CAIRN_EMBED_ALLOWED_ORIGINS=https://*.tableau.example.com,http://localhost:9000,http://localhost:8099" >> .env
          # Slack and Teams go to the integration doubles in tests/e2e/sink.py (test_19).
          {
            echo "CAIRN_SLACK_BOT_TOKEN=xoxb-e2e-double"
            echo "CAIRN_SLACK_API_URL=http://cairn-e2e-sink:8099/slack/api"
            echo "CAIRN_SLACK_RESPONSE_HOSTS=http://cairn-e2e-sink:8099"
            echo "CAIRN_TEAMS_WEBHOOK_HOSTS=.webhook.office.com,.logic.azure.com,http://cairn-e2e-sink:8099"
          } >> .env
          grep -vE '^(CAIRN_SLACK_BOT_TOKEN|CAIRN_SLACK_API_URL|CAIRN_SLACK_RESPONSE_HOSTS|CAIRN_TEAMS_WEBHOOK_HOSTS|CAIRN_EMBED_ALLOWED_ORIGINS|CAIRN_ADMIN_PASSWORD|CAIRN_SYSTEM_CLIENT_SECRET|CAIRN_SESSION_SIGNING_KEY|CAIRN_TOKEN_SALT|CAIRN_WEB_SECRET|CAIRN_DB_PASSWORD|CAIRN_DB_ROOT_PASSWORD|CAIRN_SERVICE_TOKEN|CAIRN_ACTION_LINK_SECRET|CAIRN_EMBED_SIGNING_SECRET|CAIRN_SLACK_SIGNING_SECRET|CAIRN_SCIM_TOKEN)=' \
            .env.example >> .env
          docker compose -f docker-compose.cairn.yml up -d --no-build --wait --wait-timeout 900 \
            || docker compose -f docker-compose.cairn.yml up -d --no-build --wait --wait-timeout 600

      - name: Database schema matches the models
        run: docker compose -f docker-compose.cairn.yml exec -T cairn-api cairn db check

      - name: Live e2e
        run: |
          pip install -e ".[test]"
          npm install --prefix "$RUNNER_TEMP/pw" "playwright@${PLAYWRIGHT_VERSION}"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          KEEP_SINK=1 NODE_PATH="$RUNNER_TEMP/pw/node_modules" CAIRN_E2E_SCREENSHOT_DIR="$RUNNER_TEMP/shots" tests/e2e/run.sh -v

      - name: Kubernetes token path (real kube-apiserver, chart RBAC)
        run: tests/k8s/token_secret.sh

      - name: Brand-leak scan
        run: |
          CAIRN_ADMIN_PASSWORD="$(grep ^CAIRN_ADMIN_PASSWORD= .env | cut -d= -f2-)" CAIRN_SINK_URL=http://127.0.0.1:8099/ \
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node core/tools/leak_scan.mjs http://localhost:9000

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.cairn.yml logs --no-color > "$RUNNER_TEMP/stack.log" 2>&1 || true

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-reports
          path: |
            ${{ runner.temp }}/sbom
            ${{ runner.temp }}/trivy-*.txt
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/stack.log
          if-no-files-found: ignore

      - name: Publish and sign (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          for img in platform consumer-ui remote-agent authorizer core web setup executor; do
            ref="${REGISTRY,,}/${img}:${CAIRN_VERSION}"
            docker tag "cairn/${img}:${CAIRN_VERSION}" "$ref"
            docker push "$ref"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")"
            cosign sign --yes "$digest"
            cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom/${img}.spdx.json" "$digest"
          done
