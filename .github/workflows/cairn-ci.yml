name: cairn

on:
  push:
    paths: ["cairn/**", ".github/workflows/cairn-ci.yml"]
  pull_request:
    paths: ["cairn/**", ".github/workflows/cairn-ci.yml"]
  workflow_dispatch:

concurrency:
  group: cairn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: cairn

env:
  CAIRN_VERSION: 0.1.0
  PLAYWRIGHT_VERSION: 1.56.1

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:          # migration tests also run on Postgres (CAIRN_TEST_PG_URL)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cairn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cairn/pyproject.toml
      - run: pip install -e ".[server,ai,test,postgres]" ruff
      - uses: actions/setup-node@v4     # the JavaScript client's tests (tests/test_sdk_clients.py)
        with:
          node-version: "22"
      - uses: actions/setup-java@v4     # the Java client's tests
        with:
          distribution: temurin
          java-version: "17"
      - name: Lint
        run: ruff check .
      - name: Everything as code (the registry's coverage gate; the Terraform provider generated from it; agents' change requests)
        run: |
          python -m cairn.iac.terraform --check
          pytest -q -p no:cacheprovider -o addopts="" tests/test_iac_coverage.py tests/test_iac_roundtrip.py tests/test_iac_agent_e2e.py
      - name: Unit and integration tests
        env:
          CAIRN_TEST_PG_URL: postgresql+psycopg://postgres:test@localhost:5432/cairn
        run: pytest -q
      - name: Policy bundle and its decision tests
        run: |
          cairn policies validate config/policies
          cairn policies test config/policies config/policy-tests

  store:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn/store
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cairn/store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: cairn/store/hadoop-check/build.gradle
      - name: Hadoop S3A check (hadoop-aws 3.4)
        working-directory: cairn/store/hadoop-check
        run: ./gradlew --no-daemon -q installDist
      - name: Allow FUSE mounts for other users (the CSI driver's mounts use allow_other); install litmus
        run: |
          grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
          sudo apt-get update -q && sudo apt-get install -y -q litmus  # the WebDAV protocol test suite (test_dav.py)
      - name: Conformance (S3 clients, Iceberg via pyiceberg + pyarrow, Hadoop S3A, crash safety)
        env:
          CAIRN_STORE_BIN: ${{ github.workspace }}/cairn/store/target/release/cairn-store
        run: |
          pip install "boto3>=1.36" "botocore[crt]" requests "webdav4>=0.10" "paramiko>=3.4" "psycopg[binary]>=3.1" "pillow>=10" "grpcio-tools>=1.60" "kafka-python==2.2.15" pytest "cryptography>=42" "pyarrow>=17" "pyiceberg[sql-sqlite,pyarrow]>=0.9" "pykmip==0.11.0"
          docker pull -q hashicorp/vault:1.20   # customer-managed keys (test_kms_vault.py)
          docker pull -q nsmithuk/local-kms:3   # customer-managed keys in AWS KMS (test_kms_aws.py)
          docker pull -q nagyesta/lowkey-vault:3.4.0   # Azure Key Vault (test_kms_cloud.py)
          docker pull -q floci/floci-gcp:0.12.0        # Google Cloud KMS (test_kms_cloud.py); PyKMIP is the KMIP server
          cd conformance && pytest -q -p no:cacheprovider

  store-postgres:
    # The whole conformance suite again, with every store keeping its metadata in PostgreSQL.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pgpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: cairn/store
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cairn/store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: cargo build --release --locked
      - name: Allow FUSE mounts for other users (the CSI driver's mounts use allow_other); install litmus
        run: |
          grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
          sudo apt-get update -q && sudo apt-get install -y -q litmus  # the WebDAV protocol test suite (test_dav.py)
      - name: Conformance on PostgreSQL metadata
        env:
          CAIRN_STORE_BIN: ${{ github.workspace }}/cairn/store/target/release/cairn-store
          CAIRN_STORE_TEST_META: postgresql://postgres:pgpass@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          pip install "boto3>=1.36" "botocore[crt]" requests "webdav4>=0.10" "paramiko>=3.4" "psycopg[binary]>=3.1" "pillow>=10" "grpcio-tools>=1.60" "kafka-python==2.2.15" pytest "cryptography>=42" "pyarrow>=17" "pyiceberg[sql-sqlite,pyarrow]>=0.9"
          cd conformance && pytest -q -p no:cacheprovider

  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn/catalog
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pgpass
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CAIRN_CATALOG_TEST_PG: postgresql://postgres:pgpass@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cairn/catalog
            cairn/store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Build (catalog and the store it writes to)
        run: |
          cargo build --release --locked
          (cd ../store && cargo build --release --locked)
      - name: Conformance (pyiceberg RestCatalog on Cairn Store)
        env:
          CAIRN_CATALOG_BIN: ${{ github.workspace }}/cairn/catalog/target/release/cairn-catalog
          CAIRN_STORE_BIN: ${{ github.workspace }}/cairn/store/target/release/cairn-store
        run: |
          pip install requests httpx pytest "boto3>=1.36" "pyarrow>=17" "pyiceberg[pyarrow]>=0.10" "psycopg[binary]>=3.1"
          pip install -e ..        # Cairn itself: the v3 test writes through Cairn's pyiceberg v3 writers
          cd conformance && pytest -q -p no:cacheprovider
      - name: Conformance again, with the state in PostgreSQL (and several replicas)
        env:
          CAIRN_CATALOG_BIN: ${{ github.workspace }}/cairn/catalog/target/release/cairn-catalog
          CAIRN_STORE_BIN: ${{ github.workspace }}/cairn/store/target/release/cairn-store
          CAIRN_CATALOG_TEST_DATABASE_URL: postgresql://postgres:pgpass@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          # The chaos tests restart this database under the replicas (the service container).
          export CAIRN_CHAOS_PG_CONTAINER="$(docker ps --format '{{.Names}}' --filter ancestor=postgres:16-alpine | head -1)"
          cd conformance && pytest -q -p no:cacheprovider -rs

  # Cairn Ontology (cairn/ontology): the ontology compiler's format, lints, unit tests (the ported upstream tests'
  # intent: deterministic heuristics, SQL extraction, date formats, ordered commits, diffing) and release build.
  # Its end-to-end test (a real PostgreSQL, a real Cairn and lakehouse, the AI gateway) runs in the trino job.
  ontology:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn/ontology
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cairn/ontology
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Image
        working-directory: cairn
        run: docker build -q -f docker/ontology.Dockerfile -t cairn/ontology:ci .

  # Trino against a real Cairn API, Cairn Catalog and Cairn Store: sign-in with Cairn tokens over TLS,
  # access control, masks, row filters, lineage and the SQL editor (tests/test_trino_e2e.py), and the Helm
  # chart's Trino as rendered: its coordinator, worker and init containers (tests/test_trino_helm.py).
  trino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cairn/catalog
            cairn/store
            cairn/ontology
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cairn/pyproject.toml
      - name: Build the catalog, the store and the ontology compiler
        working-directory: cairn
        run: |
          (cd catalog && cargo build --release --locked)
          (cd store && cargo build --release --locked)
          (cd ontology && cargo build --release --locked)
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Pull Trino (and Vector, stripe-mock and Mailpit for the SIEM and signup tests, Python for flows' job steps)
        run: for i in trinodb/trino:484 timberio/vector:0.43.1-alpine stripe/stripe-mock:v0.194.0 axllent/mailpit:v1.21.8 python:3.12-slim; do docker pull $i; done
      - name: The image scheduled jobs run in
        working-directory: cairn
        run: docker build -q -f docker/jobs.Dockerfile -t cairn/jobs:ci .
      - name: The image code sandboxes run in
        working-directory: cairn
        run: docker build -q -f docker/sandbox.Dockerfile -t cairn/sandbox:ci .
      - name: Trino end to end
        working-directory: cairn
        env:
          CAIRN_CATALOG_BIN: ${{ github.workspace }}/cairn/catalog/target/release/cairn-catalog
          CAIRN_STORE_BIN: ${{ github.workspace }}/cairn/store/target/release/cairn-store
          CAIRN_ONTOLOGY_BIN: ${{ github.workspace }}/cairn/ontology/target/release/cairn-ontology
          CAIRN_JOBS_TEST_IMAGE: cairn/jobs:ci
          CAIRN_SANDBOX_TEST_IMAGE: cairn/sandbox:ci
          CAIRN_TRANSCRIBE_MODEL: tiny.en                       # speech to text in files pipes (local Whisper)
          CAIRN_TRANSCRIBE_MODEL_DIR: ${{ runner.temp }}/whisper
        run: |
          set -o pipefail   # pytest's failures must fail the step, not tee's success
          pip install -e ".[server,ai,test,trino,streams,documents,media,saml,dr]" "ipython>=8.20"   # ipython: the notebook test; ai: answers with sources
          cairn transcribe-model download                       # the model files pipes transcribe with
          # The runner's package index can be older than the mirror (404 on a superseded package): refresh it first.
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng >/dev/null   # OCR of scanned documents (pipes)
          sudo apt-get install -y -q poppler-utils >/dev/null   # pdftoppm: PDF pages rendered for chart parsing
          sudo apt-get install -y -q espeak-ng ffmpeg >/dev/null   # speech for the transcription test, and its MP3/MP4
          # The DR drill's DNS server (RFC 2136 updates); its AppArmor profile would keep it from the test's files.
          sudo apt-get install -y -q bind9 >/dev/null
          sudo systemctl stop named 2>/dev/null || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.named 2>/dev/null || true
          pip install -q "playwright>=1.50"              # the embedded-dashboard test frames a dashboard in Chromium
          python -m playwright install --with-deps chromium
          docker pull -q redpandadata/redpanda:v25.2.9   # Kafka + Schema Registry: Avro streams
          docker pull -q keycloak/keycloak:26.0.7        # SAML sign-in against a real identity provider
          docker pull -q postgres:16-alpine            # the DR drill (primary and streaming standby)
          docker pull -q mcr.microsoft.com/mssql/server:2022-latest   # SQL Server mirrors (change data capture)
          docker pull -q mongo:7.0                     # MongoDB mirrors (change streams)
          docker pull -q mysql:8.4                     # MySQL mirrors (binlog)
          pytest -q -p no:cacheprovider -o addopts="" -rs --log-file="$RUNNER_TEMP/cairn-trino.log" --log-file-level=WARNING tests/test_trino_e2e.py tests/test_trino_helm.py tests/test_trino_access.py tests/test_pipes_e2e.py tests/test_streams_e2e.py tests/test_mirror_e2e.py tests/test_mirror_mysql_e2e.py tests/test_mirror_mssql_e2e.py tests/test_mirror_mongo_e2e.py tests/test_iceberg_v3_writes.py tests/test_warehouses_e2e.py tests/test_warehouses_scaling_e2e.py tests/test_warehouses_adaptive_e2e.py tests/test_ingest_http_e2e.py tests/test_shares_e2e.py tests/test_residency_e2e.py tests/test_vectors_e2e.py tests/test_online_features_e2e.py tests/test_serving_tables_e2e.py tests/test_model_monitoring_e2e.py tests/test_siem_e2e.py tests/test_signup_e2e.py tests/test_cowork.py tests/test_metering_e2e.py tests/test_status_page_e2e.py tests/test_dr_drill.py tests/test_saml_e2e.py tests/test_jobs.py tests/test_volumes.py tests/test_saas_e2e.py tests/test_doc_sources_e2e.py tests/test_reverse_etl_e2e.py tests/test_tenant_services_ha.py tests/test_vectors_answer_e2e.py tests/test_stream_transform_e2e.py tests/test_scd2_medallion_e2e.py tests/test_external_catalogs_e2e.py tests/test_share_usage_e2e.py tests/test_sandboxes_e2e.py tests/test_share_packages_e2e.py tests/test_ai_search_e2e.py tests/test_document_parse_e2e.py tests/test_parquet_tables_e2e.py tests/test_ontology_e2e.py tests/test_flows_e2e.py \
            | tee "$RUNNER_TEMP/trino.log"
          # Skipped is not passed: every Trino test must have run.
          ! grep -q "skipped" "$RUNNER_TEMP/trino.log"
      - name: Cairn's warnings and errors, on failure (its access decisions, the catalog's callbacks)
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/cairn-trino.log" || true

  # dbt, Airflow 3 and Spark 4 on the lakehouse, as shipped (the cairn/dbt, cairn/airflow and cairn/spark
  # images), against a real Trino, Cairn Catalog, Cairn Store and Cairn API: pipeline identities, policies,
  # run recording, lineage, Airflow sign-in through Cairn and Spark governed table by table.
  # The Terraform provider (terraform-provider-cairn), built from source and run by real Terraform
  # against the Cairn API (tests/test_terraform_provider.py). Bundles (cairn bundle) run in the python job.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: cairn/terraform-provider-cairn/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cairn/pyproject.toml
      - name: Vet
        working-directory: cairn/terraform-provider-cairn
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Release build (goreleaser check and an unsigned snapshot of every platform)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          workdir: cairn/terraform-provider-cairn
          args: release --snapshot --clean --skip=sign,publish
      - name: Terraform against Cairn
        run: |
          set -o pipefail
          pip install -e ".[server,test,streams]"   # vector indexes (their tables) need pyiceberg
          docker pull -q hashicorp/terraform:1.13.4
          python -m cairn.iac.terraform --check     # the provider's resources are the registry's
          pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_terraform_provider.py tests/test_iac_roundtrip.py \
            | tee "$RUNNER_TEMP/tf.log"
          ! grep -q "skipped" "$RUNNER_TEMP/tf.log"

  terraform-modules:
    # Cairn's platform as Terraform (deploy/terraform): every module and example formatted, linted and validated;
    # modules/cairn applied on a kind cluster (examples/kind), then the API's /health asked.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn/deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.58.1
      - name: Format, lint and validate every module and example
        run: |
          terraform fmt -check -recursive
          tflint --recursive --config "$PWD/.tflint.hcl"
          for d in modules/* examples/*; do
            echo "== $d"
            # The registry and GitHub (provider signatures) answer 5xx now and then: try again.
            for i in 1 2 3; do (cd "$d" && terraform init -backend=false -input=false >/dev/null) && break
              [ "$i" = 3 ] && exit 1; sleep 15; done
            (cd "$d" && terraform validate)
          done
      - name: Kind cluster and the platform image
        working-directory: cairn
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$RUNNER_TEMP/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$RUNNER_TEMP/kind.sha256" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64.sha256sum
          (cd "$RUNNER_TEMP" && echo "$(cut -d' ' -f1 kind.sha256)  kind" | sha256sum -c -)
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind create cluster --name cairn --image kindest/node:v1.33.1 --wait 120s
          docker build -q -f docker/Dockerfile --build-arg OCR_LANGUAGES= -t cairn/platform:ci .
          kind load docker-image cairn/platform:ci --name cairn
      - name: Apply modules/cairn on kind, then ask the API's /health
        working-directory: cairn/deploy/terraform/examples/kind
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/service-token"       # a secret: in a file, never on a command line
          TF_VAR_service_token="$(cat "$RUNNER_TEMP/service-token")"
          export TF_VAR_service_token
          terraform init -input=false
          terraform apply -auto-approve -input=false
          kubectl -n cairn rollout status deploy/cairn-api --timeout=600s
          kubectl -n cairn port-forward svc/cairn-api 18080:8800 >"$RUNNER_TEMP/pf.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/health | grep -q '"status":"ok"'
          terraform plan -detailed-exitcode -input=false     # applied: nothing left to change
          terraform destroy -auto-approve -input=false
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n cairn describe pods | tail -80 || true
          kubectl -n cairn logs deploy/cairn-api --tail=200 || true

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cairn/pyproject.toml
      - name: MLflow through Cairn (tracking, governed registry, catalog lineage, serving)
        run: |
          set -o pipefail
          pip install -e ".[server,ai,test]"
          # MLflow in its own environment, as it is deployed (its own image).
          python -m venv "$RUNNER_TEMP/mlflow"
          "$RUNNER_TEMP/mlflow/bin/pip" install -q "mlflow==3.5.0" "sqlalchemy<2.1" "fastapi<0.120" "starlette<0.50"
          CAIRN_MLFLOW_PYTHON="$RUNNER_TEMP/mlflow/bin/python" \
            pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_ml_e2e.py tests/test_agent_apps_mlflow.py -k "not spark_image" | tee "$RUNNER_TEMP/ml.log"   # the Spark image test runs in the pipelines job
          ! grep -q "skipped" "$RUNNER_TEMP/ml.log"
      - name: Fine-tuning on governed data (real LoRA training on PyTorch CPU)
        run: |
          set -o pipefail
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -e ".[finetune]"
          export CAIRN_FINETUNE_MODEL_DIR="$RUNNER_TEMP/finetune-models"
          cairn finetune-model download distilbert/distilgpt2
          pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_finetune.py | tee "$RUNNER_TEMP/finetune.log"
          ! grep -q "skipped" "$RUNNER_TEMP/finetune.log"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JupyterHub with Cairn sign-in (real hub, proxy and Jupyter server)
        run: |
          set -o pipefail
          python -m venv "$RUNNER_TEMP/hub"
          "$RUNNER_TEMP/hub/bin/pip" install -q "jupyterhub>=5.2,<6" "oauthenticator>=17" "jupyter_server>=2.14" httpx
          (cd "$RUNNER_TEMP" && npm install --silent configurable-http-proxy@4)
          CAIRN_JUPYTERHUB_BIN="$RUNNER_TEMP/hub/bin/jupyterhub" \
          CAIRN_CHP_BIN="$RUNNER_TEMP/node_modules/.bin/configurable-http-proxy" \
            pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_jupyterhub_e2e.py | tee "$RUNNER_TEMP/hub.log"
          ! grep -q "skipped" "$RUNNER_TEMP/hub.log"
      - name: Data apps (a real Streamlit app in Chromium, through Cairn)
        run: |
          set -o pipefail
          python -m venv "$RUNNER_TEMP/streamlit"
          "$RUNNER_TEMP/streamlit/bin/pip" install -q "streamlit>=1.40"
          pip install -q "playwright>=1.50"
          python -m playwright install --with-deps chromium
          CAIRN_STREAMLIT_BIN="$RUNNER_TEMP/streamlit/bin/streamlit" \
            pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_data_apps_e2e.py | tee "$RUNNER_TEMP/apps.log"
          ! grep -q "skipped" "$RUNNER_TEMP/apps.log"
      - name: SQL workflows, git folders and query insight pages (the built UI in Chromium, against Cairn)
        run: |
          set -o pipefail
          (cd ui && npm ci --silent && npm run build:mfe)
          pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_sql_ops_ui_e2e.py | tee "$RUNNER_TEMP/sqlui.log"
          ! grep -q "skipped" "$RUNNER_TEMP/sqlui.log"
      - name: The Flows canvas (build, link, save, publish and run a flow in Chromium, against Cairn)
        run: |
          set -o pipefail
          pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_flows_ui_e2e.py | tee "$RUNNER_TEMP/flowsui.log"
          ! grep -q "skipped" "$RUNNER_TEMP/flowsui.log"
      - name: Accessibility (axe on the main pages of the built UI, against Cairn)
        run: |
          set -o pipefail
          pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_accessibility_e2e.py | tee "$RUNNER_TEMP/a11y.log"
      - name: The installable app and the Profile page (manifest, service worker, offline, phone width; built UI against Cairn)
        run: |
          set -o pipefail
          pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_pwa_e2e.py | tee "$RUNNER_TEMP/pwa.log"
          ! grep -q "skipped" "$RUNNER_TEMP/a11y.log"

  pipelines:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cairn/catalog
            cairn/store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cairn/pyproject.toml
      - name: Build the catalog and the store
        working-directory: cairn
        run: |
          (cd catalog && cargo build --release --locked)
          (cd store && cargo build --release --locked)
      - name: Build the cairn/dbt, cairn/airflow and cairn/spark images; pull Trino
        working-directory: cairn
        run: |
          docker build -q -f docker/dbt.Dockerfile -t cairn/dbt:ci .
          docker build -q -f docker/airflow.Dockerfile -t cairn/airflow:ci .
          docker build -q -f docker/spark.Dockerfile -t cairn/spark:ci .
          docker pull -q trinodb/trino:484
      - name: Kubernetes API server, etcd and kubectl (workload identity)
        run: |
          mkdir -p "$RUNNER_TEMP/k8s" && cd "$RUNNER_TEMP/k8s"
          for b in kube-apiserver kube-controller-manager kubectl; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$b" "https://dl.k8s.io/release/v1.31.2/bin/linux/amd64/$b"
            echo "$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "https://dl.k8s.io/release/v1.31.2/bin/linux/amd64/$b.sha256")  $b" | sha256sum -c -
          done
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 https://github.com/etcd-io/etcd/releases/download/v3.5.15/etcd-v3.5.15-linux-amd64.tar.gz \
            | tar -xz --strip-components 1 etcd-v3.5.15-linux-amd64/etcd
          chmod +x kube-apiserver kube-controller-manager kubectl etcd
          # The Spark Operator's SparkApplication CRD, pinned (what SparkApplications are validated against).
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o sparkapplications.yaml \
            https://raw.githubusercontent.com/kubeflow/spark-operator/v2.2.1/charts/spark-operator-chart/crds/sparkoperator.k8s.io_sparkapplications.yaml
          echo "50d3eeb2d5a58e162ed06e9a6d849227ed3522b0887a51b705dc1af8a0d53371  sparkapplications.yaml" | sha256sum -c -
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: dbt, Airflow and Spark end to end
        working-directory: cairn
        env:
          CAIRN_CATALOG_BIN: ${{ github.workspace }}/cairn/catalog/target/release/cairn-catalog
          CAIRN_STORE_BIN: ${{ github.workspace }}/cairn/store/target/release/cairn-store
          CAIRN_DBT_IMAGE: cairn/dbt:ci
          CAIRN_AIRFLOW_IMAGE: cairn/airflow:ci
          CAIRN_SPARK_IMAGE: cairn/spark:ci
          CAIRN_K8S_BIN_DIR: ${{ runner.temp }}/k8s
          CAIRN_SPARK_OPERATOR_CRD: ${{ runner.temp }}/k8s/sparkapplications.yaml
        run: |
          set -o pipefail   # pytest's failures must fail the step, not tee's success
          pip install -e ".[server,test,trino,export]" "dbt-core==1.12.6" "dbt-trino==1.11.0" "duckdb>=1.1"
          pytest -q -p no:cacheprovider -o addopts="" -rs --log-file="$RUNNER_TEMP/cairn-pipelines.log" --log-file-level=WARNING tests/test_dbt_e2e.py tests/test_dbt_more_e2e.py tests/test_airflow_e2e.py tests/test_airflow_more_e2e.py tests/test_flows_airflow_e2e.py \
            tests/test_spark_e2e.py tests/test_spark_k8s_e2e.py tests/test_lakehouse_access.py tests/test_lakehouse_client_e2e.py \
            tests/test_workload_identity_e2e.py tests/test_spark_teams_k8s.py tests/test_warehouses_k8s.py | tee "$RUNNER_TEMP/pipelines.log"
          # Skipped is not passed: every pipeline test must have run.
          ! grep -q "skipped" "$RUNNER_TEMP/pipelines.log"
      - name: Spark training (pyspark.ml in the cairn/spark image) tracked in MLflow through Cairn
        working-directory: cairn
        env:
          CAIRN_SPARK_IMAGE: cairn/spark:ci
        run: |
          set -o pipefail
          python -m venv "$RUNNER_TEMP/mlflow"
          "$RUNNER_TEMP/mlflow/bin/pip" install -q "mlflow==3.5.0" "scikit-learn>=1.4" "sqlalchemy<2.1" "fastapi<0.120" "starlette<0.50"
          CAIRN_MLFLOW_PYTHON="$RUNNER_TEMP/mlflow/bin/python" \
            pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_ml_e2e.py -k spark_image | tee "$RUNNER_TEMP/spark-ml.log"
          ! grep -q "skipped" "$RUNNER_TEMP/spark-ml.log"
      - name: Cairn's warnings and errors, on failure (its access decisions, the catalog's callbacks)
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/cairn-pipelines.log" || true

  spark-kind:
    # Spark on a full Kubernetes cluster: driver and executor pods really run, signed in by their
    # service account (no secret in the cluster), reading governed tables through Cairn Catalog.
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cairn/catalog
            cairn/store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cairn/pyproject.toml
      - name: Build the catalog, the store and the cairn/spark image
        working-directory: cairn
        run: |
          (cd catalog && cargo build --release --locked)
          (cd store && cargo build --release --locked)
          docker build -q -f docker/spark.Dockerfile -t cairn/spark:ci .
          docker build -q -f docker/jobs.Dockerfile -t cairn/jobs:ci .
          docker build -q -f docker/agent-runtime.Dockerfile -t cairn/agent-runtime:ci .
      - name: Kind cluster
        # Installed here rather than by helm/kind-action, whose download is not retried: one bad fetch from
        # GitHub (an empty checksum, run 269) failed the job before any test ran.
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$RUNNER_TEMP/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$RUNNER_TEMP/kind.sha256" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64.sha256sum
          (cd "$RUNNER_TEMP" && echo "$(cut -d' ' -f1 kind.sha256)  kind" | sha256sum -c -)
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind create cluster --name cairn --image kindest/node:v1.33.1 --wait 120s
          kubectl cluster-info --context kind-cairn
      - name: Load the images into the cluster
        run: |
          # Data apps (test_data_apps_k8s.py): single-platform copies of their images, which kind can import
          # (a pulled multi-platform image holds only this platform's layers).
          echo "FROM python:3.12-slim" | docker build -q -t cairn-test/python:ci -
          echo "FROM alpine/git:v2.49.1" | docker build -q -t cairn-test/git:ci -
          # Model serving (test_ml_serving_k8s.py): MLflow's model server.
          echo "FROM ghcr.io/mlflow/mlflow:v3.5.0" | docker build -q -t cairn-test/mlflow:ci -
          kind load docker-image cairn/spark:ci cairn/jobs:ci cairn/agent-runtime:ci cairn-test/python:ci cairn-test/git:ci cairn-test/mlflow:ci --name cairn
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4         # as the other jobs: Helm 4 installs server-side and conflicts with the CRDs applied first
      - name: Spark in pods on the cluster
        working-directory: cairn
        env:
          CAIRN_CATALOG_BIN: ${{ github.workspace }}/cairn/catalog/target/release/cairn-catalog
          CAIRN_STORE_BIN: ${{ github.workspace }}/cairn/store/target/release/cairn-store
          CAIRN_SPARK_IMAGE: cairn/spark:ci
        run: |
          set -o pipefail
          pip install -e ".[server,ai,test,trino,streams]" pyyaml
          export CAIRN_KIND_KUBECONFIG="$HOME/.kube/config"
          # Pods reach this host at the kind network's gateway.
          export CAIRN_KIND_HOST_IP="$(docker network inspect kind -f '{{range .IPAM.Config}}{{if .Gateway}}{{.Gateway}} {{end}}{{end}}' | tr ' ' '\n' | grep -E '^[0-9.]+$' | head -1)"
          echo "pods reach the host at $CAIRN_KIND_HOST_IP"
          pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_spark_kind_e2e.py | tee "$RUNNER_TEMP/kind.log"
          ! grep -q "skipped" "$RUNNER_TEMP/kind.log"
          # Data apps on the same cluster: from git, started on a visit, stopped when idle, reached only by Cairn.
          CAIRN_APPS_TEST_IMAGE=cairn-test/python:ci CAIRN_APPS_K8S_GIT_IMAGE=cairn-test/git:ci \
            pytest -q -p no:cacheprovider -o addopts="" -rs -s tests/test_data_apps_k8s.py | tee "$RUNNER_TEMP/apps.log"
          ! grep -q "skipped" "$RUNNER_TEMP/apps.log"
          # Agent apps as pods: deployed by Cairn with the chart's Role, called back as the asker, reached only by Cairn.
          CAIRN_AGENT_RUNTIME_TEST_IMAGE=cairn/agent-runtime:ci CAIRN_APPS_TEST_IMAGE=cairn-test/python:ci \
            pytest -q -p no:cacheprovider -o addopts="" -rs -s tests/test_agent_apps_k8s.py | tee "$RUNNER_TEMP/agents.log"
          ! grep -q "skipped" "$RUNNER_TEMP/agents.log"
          # The chart's Gateway API routes through a real Gateway implementation (Envoy Gateway).
          CAIRN_APPS_TEST_IMAGE=cairn-test/python:ci \
            pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_gateway_api_kind.py | tee "$RUNNER_TEMP/gateway.log"
          ! grep -q "skipped" "$RUNNER_TEMP/gateway.log"
          # Scheduled jobs as Kubernetes Jobs, made and removed with only the chart's Role.
          CAIRN_JOBS_TEST_IMAGE=cairn/jobs:ci \
            pytest -q -p no:cacheprovider -o addopts="" -rs tests/test_jobs_k8s.py | tee "$RUNNER_TEMP/jobs.log"
          ! grep -q "skipped" "$RUNNER_TEMP/jobs.log"
          # Model deployments as Deployments of MLflow's model server, scaled by Cairn, with only the chart's Role.
          python -m venv "$RUNNER_TEMP/mlflow" && "$RUNNER_TEMP/mlflow/bin/pip" install -q "mlflow==3.5.0" "sqlalchemy<2.1" "fastapi<0.120" "starlette<0.50"
          CAIRN_MLFLOW_PYTHON="$RUNNER_TEMP/mlflow/bin/python" CAIRN_ML_SERVING_TEST_IMAGE=cairn-test/mlflow:ci \
            pytest -q -p no:cacheprovider -o addopts="" -rs -s tests/test_ml_serving_k8s.py | tee "$RUNNER_TEMP/models.log"
          ! grep -q "skipped" "$RUNNER_TEMP/models.log"
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          for p in $(kubectl -n pipelines get pods -o name 2>/dev/null); do echo "== $p"; kubectl -n pipelines logs "$p" --tail=200 || true; done
          kubectl -n cairn-apps get events --sort-by=.lastTimestamp || true
          kubectl -n cairn-jobs-test get events --sort-by=.lastTimestamp || true
          for p in $(kubectl -n cairn-apps get pods -o name 2>/dev/null); do echo "== $p"; kubectl -n cairn-apps logs "$p" --all-containers --tail=100 || true; done
          kubectl -n cairn-agents get events --sort-by=.lastTimestamp || true
          for p in $(kubectl -n cairn-agents get pods -o name 2>/dev/null); do echo "== $p"; kubectl -n cairn-agents logs "$p" --tail=100 || true; done
          kubectl -n cairn-models get events --sort-by=.lastTimestamp || true
          for p in $(kubectl -n cairn-models get pods -o name 2>/dev/null); do echo "== $p"; kubectl -n cairn-models logs "$p" --tail=100 || true; done

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cairn/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Alert rules
        working-directory: cairn
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/o:ro" prom/prometheus:v2.53.0 check rules /o/cairn-alerts.yaml /o/cairn-store-alerts.yaml
      - name: Browser extension
        working-directory: cairn/extension
        run: npm test && node build.mjs --cairn-url https://cairn.example.com
      - name: Cairn Desktop (main process against a stand-in, then the real Electron app under xvfb)
        working-directory: cairn/desktop
        run: npm test && npm install --no-audit --no-fund && npm test
      - name: Spreadsheet add-ins (unit; the live tests run in the python job, tests/test_spreadsheet_addins.py)
        working-directory: cairn/addins
        run: npm test && node build.mjs --cairn-url https://cairn.example.com --addin-url https://addins.example.com

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn/plugins/java/cairn-authorizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --no-daemon test jar

  # The Hetzner hosting setup (deploy/hetzner) for real on the runner: its firewall, k3s config, platform
  # services and a tenant with its isolation (deploy/hetzner/ci/k3s-smoke.sh), plus the Terraform.
  hetzner:
    runs-on: ubuntu-24.04
    steps:
      # The platform's images (OpenSearch, PostgreSQL, Prometheus, ...) need room: without this the runner
      # crosses the kubelet's disk-pressure threshold and pods are evicted.
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the scripts
        run: shellcheck -S warning deploy/hetzner/*.sh deploy/hetzner/ci/*.sh deploy/hosting/tenant.sh
      - name: Terraform
        working-directory: cairn/deploy/hetzner/terraform
        run: |
          terraform fmt -check -recursive
          # The registry and GitHub (provider signatures) answer 5xx now and then (run 269): try again.
          for i in 1 2 3; do terraform init -backend=false -input=false && break; [ "$i" = 3 ] && exit 1; sleep 15; done
          terraform validate
      - name: Cluster, platform and a tenant on k3s
        run: |
          pip install -q cryptography sqlalchemy    # tenant.sh checks the licence with cairn.common.licence
          sudo apt-get install -y -q nftables >/dev/null
          deploy/hetzner/ci/k3s-smoke.sh
      - name: Cluster state, on failure
        if: failure()
        run: |
          export KUBECONFIG=$RUNNER_TEMP/cairn-hetzner-ci/state/kubeconfig
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          kubectl -n cairn-platform describe cluster.postgresql.cnpg.io cairn-pg | tail -40 || true
          for ns in cairn-ci-acme ingress-nginx; do kubectl -n $ns describe pods | tail -60 || true; done
          sudo journalctl -u k3s --no-pager | tail -80 || true

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubeconform
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Lint and validate every values profile
        run: |
          set -o pipefail   # a chart that fails to render must fail the step, not validate nothing
          helm lint helm/cairn helm/cairn-remote-agent
          for values in "" "-f helm/cairn/values-active-metadata.yaml" "-f helm/cairn/values-authoritative.yaml" \
              "-f helm/cairn/values-ha.yaml" "-f helm/cairn/values-ha.yaml -f helm/cairn/values-tenant.yaml" \
              "--set core.database.type=postgres" \
              "--set cairn.metadataExport.enabled=true --set cairn.metadataExport.destination=s3://bucket/cairn" \
              "--set cairn.serviceMonitor.enabled=true --set cairn.prometheusRule.enabled=true --set cairn.grafanaDashboard.enabled=true" \
              "--set cairn.store.enabled=true --set cairn.catalog.enabled=true --set cairn.trino.enabled=true --set cairn.trino.tls.secretName=cairn-trino-tls --set cairn.trino.workers=2 --set cairn.networkPolicy.enabled=true" \
              "--set cairn.store.enabled=true --set cairn.catalog.enabled=true --set cairn.trino.enabled=true --set cairn.trino.allowInsecureHttp=true" \
              "--set cairn.store.enabled=true --set cairn.catalog.enabled=true --set cairn.trino.enabled=true --set cairn.trino.tls.secretName=cairn-trino-tls --set cairn.networkPolicy.enabled=true --set cairn.trino.warehouses.list[0].name=sales --set cairn.trino.warehouses.list[0].port=8443 --set cairn.trino.warehouses.list[1].name=finance --set cairn.trino.warehouses.list[1].port=8444 --set cairn.trino.warehouses.list[1].idleMinutes=0 --set cairn.trino.warehouses.adaptive[0].name=auto --set cairn.trino.warehouses.adaptive[0].port=8450 --set cairn.trino.warehouses.adaptive[0].tiers={sales,finance} --set cairn.trino.warehouses.adaptive[0].largeWhen.cpu_ms=600000 --set cairn.trino.ai.enabled=true --set cairn.trino.ai.apiKeySecret.name=llm --set cairn.trino.delta.enabled=true --set cairn.trino.delta.credentialsSecret.name=delta --set cairn.trino.routines.enabled=true --set cairn.trino.routines.credentialsSecret.name=routines" \
              "--set cairn.store.enabled=true --set cairn.catalog.enabled=true --set cairn.trino.enabled=true --set cairn.trino.tls.secretName=cairn-trino-tls --set cairn.trino.workers=2 --set cairn.trino.autoscaling.enabled=true" \
              "--set cairn.store.enabled=true --set cairn.store.secret.stsSecretKey=sts --set cairn.catalog.enabled=true --set cairn.catalog.vendRole=cairn-catalog-tables --set cairn.trino.enabled=true --set cairn.trino.tls.secretName=cairn-trino-tls" \
              "--set cairn.store.enabled=true --set cairn.catalog.enabled=true --set cairn.trino.enabled=true --set cairn.trino.tls.secretName=cairn-trino-tls --set cairn.trino.workers=2 --set cairn.trino.faultTolerance.enabled=true --set cairn.trino.spill.enabled=true --set cairn.trino.cache.enabled=true" \
              "--set cairn.store.enabled=true --set cairn.store.secret.stsSecretKey=sts --set cairn.catalog.enabled=true --set cairn.catalog.vendRole=cairn-catalog-tables --set cairn.catalog.identity.enabled=true --set cairn.catalog.identity.publicUrl=https://catalog.example.com --set cairn.trino.enabled=true --set cairn.trino.tls.secretName=cairn-trino-tls --set cairn.networkPolicy.enabled=true" \
              "--set cairn.store.enabled=true --set cairn.catalog.enabled=true --set cairn.trino.enabled=true --set cairn.trino.tls.secretName=cairn-trino-tls --set cairn.workloadIdentity.issuers[0].name=k8s --set cairn.workloadIdentity.issuers[0].issuer=https://kubernetes.default.svc --set cairn.workloadIdentity.issuers[0].audience=cairn --set cairn.workloadIdentity.issuers[0].jwks_url=https://kubernetes.default.svc/openid/v1/jwks --set cairn.dbt.jobs[0].name=shop --set cairn.dbt.jobs[0].image=registry.example.com/shop-dbt:1.0 --set cairn.dbt.jobs[0].schedule=@daily --set cairn.dbt.jobs[0].workloadIdentity.serviceAccount=svc-dbt" \
              "--set cairn.workloadIdentity.issuers[0].name=k8s --set cairn.workloadIdentity.issuers[0].issuer=https://kubernetes.default.svc --set cairn.workloadIdentity.issuers[0].audience=cairn --set cairn.workloadIdentity.issuers[0].jwks_url=https://kubernetes.default.svc/openid/v1/jwks --set cairn.spark.enabled=true --set cairn.spark.historyServer.enabled=true --set cairn.spark.submitters[0].name=airflow-worker --set cairn.spark.submitters[0].namespace=airflow --set cairn.spark.teams[0].name=finance --set cairn.spark.teams[0].quota.cpu=32 --set cairn.spark.teams[1].name=marketing --set cairn.store.enabled=true --set cairn.spark.eventLog.store.enabled=true --set cairn.spark.eventLog.store.dir=s3a://spark-events/logs --set cairn.spark.eventLog.store.readerSecret=spark-history-reader" \
              "--set cairn.store.enabled=true --set cairn.catalog.enabled=true --set cairn.trino.enabled=true --set cairn.trino.tls.secretName=cairn-trino-tls --set cairn.trino.workers=2 --set cairn.trino.federation[0].name=crm --set cairn.trino.federation[0].connector=postgresql --set cairn.trino.federation[0].properties.connection-url=jdbc:postgresql://crm-db:5432/crm --set cairn.trino.federation[0].credentialsSecret.name=crm-trino --set cairn.trino.federation[0].platform=postgres --set cairn.trino.federation[0].database=crm" \
              "--set cairn.store.enabled=true --set cairn.catalog.enabled=true --set cairn.catalog.replicas=3 --set cairn.catalog.database.existingSecret=cairn-catalog-db --set cairn.ha.spreadReplicas=true" \
              "--set cairn.store.enabled=true --set cairn.store.cluster.enabled=true --set cairn.store.metadata.secretName=cairn-store-meta --set cairn.store.tlsSecret=cairn-store-tls --set cairn.store.cluster.mutualTls=true" \
              "--set cairn.store.enabled=true --set cairn.catalog.enabled=true --set cairn.trino.enabled=true --set cairn.trino.tls.secretName=cairn-trino-tls --set cairn.dbt.jobs[0].name=shop --set cairn.dbt.jobs[0].image=registry.example.com/shop-dbt:1.0 --set cairn.dbt.jobs[0].schedule=@daily --set cairn.dbt.jobs[0].tokenSecret.name=svc-dbt --set cairn.dbt.jobs[0].caSecret.name=cairn-trino-tls" \
              "--set cairn.jobs.runtime=kubernetes --set cairn.jobs.trinoUrl=https://cairn-trino:8443 --set cairn.jobs.trinoCa.configMap=cairn-trino-ca"; do
            # shellcheck disable=SC2086
            helm template cairn helm/cairn $values \
              | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0
          done
          # Gateway API routes (core.gateway), checked against the Gateway API's own schemas.
          for values in "--set core.gateway.enabled=true --set core.gateway.create.enabled=true --set core.gateway.create.className=eg --set core.gateway.create.tlsSecret=cairn-tls" \
              "-f helm/cairn/values-ha.yaml -f helm/cairn/values-tenant.yaml --set core.ingress.enabled=false --set core.gateway.enabled=true --set core.gateway.parentRefs[0].name=platform --set core.gateway.parentRefs[0].namespace=gateway"; do
            # shellcheck disable=SC2086
            helm template cairn helm/cairn $values --show-only templates/gateway-api.yaml \
              | kubeconform -strict -summary -kubernetes-version 1.30.0 \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
          # Gateway API routes and an Ingress both exposing Cairn are refused.
          ! helm template cairn helm/cairn --set core.ingress.enabled=true --set core.gateway.enabled=true \
              --set core.gateway.create.enabled=true --set core.gateway.create.className=eg >/dev/null 2>&1
          # Airflow with the official Apache Airflow chart and Cairn's values (deploy/airflow/values-cairn.yaml).
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/airflow-chart.tgz https://github.com/apache/airflow/releases/download/helm-chart/1.20.0/airflow-1.20.0.tgz
          tar xzf /tmp/airflow-chart.tgz -C /tmp
          helm template airflow /tmp/airflow -f deploy/airflow/values-cairn.yaml \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0
          # A store cluster without TLS between its nodes is refused unless asked for explicitly.
          ! helm template cairn helm/cairn --set cairn.store.enabled=true --set cairn.store.cluster.enabled=true \
              --set cairn.store.metadata.secretName=cairn-store-meta >/dev/null 2>&1
          # Cairn-issued tokens on the catalog without per-table temporary credentials are refused.
          ! helm template cairn helm/cairn --set cairn.store.enabled=true --set cairn.catalog.enabled=true \
              --set cairn.catalog.identity.enabled=true --set cairn.trino.enabled=true \
              --set cairn.trino.tls.secretName=cairn-trino-tls >/dev/null 2>&1
          # Catalog replicas without a shared database are refused.
          ! helm template cairn helm/cairn --set cairn.store.enabled=true --set cairn.catalog.enabled=true \
              --set cairn.catalog.replicas=2 >/dev/null 2>&1
          # Trino without TLS is refused unless asked for explicitly.
          ! helm template cairn helm/cairn --set cairn.store.enabled=true --set cairn.catalog.enabled=true \
              --set cairn.trino.enabled=true >/dev/null 2>&1
          helm template agent helm/cairn-remote-agent --set enrollment.existingSecret=cairn-agent-enrollment \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0

  # Builds every image, starts the full stack and runs the live suites against it. One job, because
  # the images (~10 GB) are not worth moving between jobs.
  stack:
    needs: [python, ui, java]
    # Playwright 1.56 installs Chromium on Ubuntu 24.04, not on 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Web UI bundle (cached per engine release and white-label patch)
        id: webui
        uses: actions/cache@v4
        with:
          path: cairn/core/web/build/web-ui-assets.jar
          key: webui-${{ hashFiles('cairn/core/UPSTREAM_VERSION', 'cairn/core/web/**') }}
      - name: Build web UI bundle
        if: steps.webui.outputs.cache-hit != 'true'
        run: core/web/build.sh "$RUNNER_TEMP/webui"

      - name: Build images
        run: deploy/build-images.sh
      - name: The platform image reads scanned documents (OCR)
        run: |
          docker run --rm --entrypoint python "cairn/platform:${CAIRN_VERSION}" -c '
          import io
          from PIL import Image, ImageDraw, ImageFont
          from cairn.pipelines.documents import extract
          img = Image.new("L", (1700, 600), 255)
          ImageDraw.Draw(img).text((150, 200), "Scanned in the image", fill=0, font=ImageFont.load_default(size=48))
          buf = io.BytesIO(); img.save(buf, format="PDF", resolution=200)
          text, pages, error = extract("scan.pdf", buf.getvalue())
          assert text == "Scanned in the image" and pages == 1 and error is None, (text, pages, error)
          print("OCR in the image: ok")'

      - name: Vulnerability database (fallback registries, retried)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          for attempt in 1 2 3; do
            docker run --rm -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" aquasec/trivy:0.57.1 image --download-db-only \
              --db-repository ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 \
              && exit 0
            sleep $((attempt * 20))
          done
          exit 1
      - name: Scan Cairn-owned images (fail on fixable critical CVEs)
        run: |
          for img in platform remote-agent agent-runtime store catalog; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.57.1 image --skip-db-update --quiet --scanners vuln --severity CRITICAL --ignore-unfixed \
              --exit-code 1 "cairn/${img}:${CAIRN_VERSION}"
          done
      - name: Scan remaining images (report only)
        run: |
          for img in consumer-ui core web setup executor; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.57.1 image --skip-db-update --quiet --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
              --format table "cairn/${img}:${CAIRN_VERSION}" \
              > "$RUNNER_TEMP/trivy-${img}.txt" || true
          done
      - name: SBOMs
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          for img in platform consumer-ui remote-agent agent-runtime store catalog authorizer core web setup executor; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.18.1 \
              "cairn/${img}:${CAIRN_VERSION}" -o spdx-json > "$RUNNER_TEMP/sbom/${img}.spdx.json"
          done

      - name: Start the stack
        run: |
          {
            echo "CAIRN_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            for k in CAIRN_SYSTEM_CLIENT_SECRET CAIRN_SESSION_SIGNING_KEY CAIRN_TOKEN_SALT CAIRN_WEB_SECRET \
                     CAIRN_DB_PASSWORD CAIRN_DB_ROOT_PASSWORD CAIRN_SERVICE_TOKEN CAIRN_ACTION_LINK_SECRET \
                     CAIRN_EMBED_SIGNING_SECRET CAIRN_SLACK_SIGNING_SECRET CAIRN_SCIM_TOKEN CAIRN_STORE_SECRET_KEY \
                     CAIRN_CATALOG_TOKEN; do
              echo "${k}=$(openssl rand -hex 32)"
            done
            echo "CAIRN_STORE_MASTER_KEY=$(openssl rand -base64 32)"
          } > .env
          # Embed origins the e2e suite exercises (test_11, test_20: localhost:8099 is the partner page).
          echo "CAIRN_EMBED_ALLOWED_ORIGINS=https://*.tableau.example.com,http://localhost:9000,http://localhost:8099" >> .env
          # Slack and Teams go to the integration doubles in tests/e2e/sink.py (test_19).
          {
            echo "CAIRN_SLACK_BOT_TOKEN=xoxb-e2e-double"
            echo "CAIRN_SLACK_API_URL=http://cairn-e2e-sink:8099/slack/api"
            echo "CAIRN_SLACK_RESPONSE_HOSTS=http://cairn-e2e-sink:8099"
            echo "CAIRN_TEAMS_WEBHOOK_HOSTS=.webhook.office.com,.logic.azure.com,http://cairn-e2e-sink:8099"
          } >> .env
          grep -vE '^(CAIRN_SLACK_BOT_TOKEN|CAIRN_SLACK_API_URL|CAIRN_SLACK_RESPONSE_HOSTS|CAIRN_TEAMS_WEBHOOK_HOSTS|CAIRN_EMBED_ALLOWED_ORIGINS|CAIRN_ADMIN_PASSWORD|CAIRN_SYSTEM_CLIENT_SECRET|CAIRN_SESSION_SIGNING_KEY|CAIRN_TOKEN_SALT|CAIRN_WEB_SECRET|CAIRN_DB_PASSWORD|CAIRN_DB_ROOT_PASSWORD|CAIRN_SERVICE_TOKEN|CAIRN_ACTION_LINK_SECRET|CAIRN_EMBED_SIGNING_SECRET|CAIRN_SLACK_SIGNING_SECRET|CAIRN_SCIM_TOKEN|CAIRN_STORE_SECRET_KEY|CAIRN_CATALOG_TOKEN|CAIRN_STORE_MASTER_KEY)=' \
            .env.example >> .env
          docker compose -f docker-compose.cairn.yml up -d --no-build --wait --wait-timeout 900 \
            || docker compose -f docker-compose.cairn.yml up -d --no-build --wait --wait-timeout 600

      - name: Database schema matches the models
        run: docker compose -f docker-compose.cairn.yml exec -T cairn-api cairn db check

      - name: Live e2e
        run: |
          pip install -e ".[test]" "boto3>=1.36" "pyiceberg[pyarrow]>=0.10"
          npm install --prefix "$RUNNER_TEMP/pw" "playwright@${PLAYWRIGHT_VERSION}"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          KEEP_SINK=1 NODE_PATH="$RUNNER_TEMP/pw/node_modules" CAIRN_E2E_SCREENSHOT_DIR="$RUNNER_TEMP/shots" tests/e2e/run.sh -v

      - name: Kubernetes token path (real kube-apiserver, chart RBAC)
        run: tests/k8s/token_secret.sh

      - name: Brand-leak scan
        run: |
          CAIRN_ADMIN_PASSWORD="$(grep ^CAIRN_ADMIN_PASSWORD= .env | cut -d= -f2-)" CAIRN_SINK_URL=http://127.0.0.1:8099/ \
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node core/tools/leak_scan.mjs http://localhost:9000

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.cairn.yml logs --no-color > "$RUNNER_TEMP/stack.log" 2>&1 || true

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-reports
          path: |
            ${{ runner.temp }}/sbom
            ${{ runner.temp }}/trivy-*.txt
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/stack.log
          if-no-files-found: ignore

      - name: Publish and sign (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          for img in platform consumer-ui remote-agent agent-runtime store catalog authorizer core web setup executor; do
            ref="${REGISTRY,,}/${img}:${CAIRN_VERSION}"
            docker tag "cairn/${img}:${CAIRN_VERSION}" "$ref"
            docker push "$ref"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")"
            cosign sign --yes "$digest"
            cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom/${img}.spdx.json" "$digest"
          done
