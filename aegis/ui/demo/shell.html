<title>Aegis Workspace</title>
<style>
/*ANTD_CSS*/
</style>
<style>
  /* Single light theme: the workspace is styled to sit inside DataHub's light UI. */
  :root {
    color-scheme: light;
    --page: #f7f7fb;
    --ink: #1f2937;
    --banner-bg: #eceafb;
    --banner-ink: #3b2f99;
    --banner-rule: #d9d4f7;
  }
  html, body { background: var(--page); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }
  .demo-banner {
    display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--banner-bg); color: var(--banner-ink);
    border-bottom: 1px solid var(--banner-rule); font-size: 13px; line-height: 1.4;
  }
  .demo-banner strong { font-weight: 600; letter-spacing: 0.02em; }
  #aegis-root { min-height: 100%; }
</style>
<div class="demo-banner" role="note">
  <strong>Aegis demo</strong>
  <span>Sample data for a fictional retailer. You are signed in as Alice Moreno (Finance analyst, admin). Changes you make last until you reload.</span>
</div>
<div id="aegis-root"></div>
<script>/*APP_JS*/</script>
