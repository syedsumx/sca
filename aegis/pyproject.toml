[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-platform"
version = "0.1.0"
description = "Aegis: self-hosted active metadata, governance and data quality platform built on DataHub: native data quality, ABAC governance, in-VPC remote agents and AI/MCP discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "croniter>=2.0",
  "cryptography>=42",
  "sqlglot>=25",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "prometheus-client>=0.20"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
ai = ["anthropic>=2.0", "mcp>=2.0"]
actions = ["acryl-datahub-actions>=1.0"]
agent = ["acryl-datahub>=1.0"]
warehouse = ["snowflake-sqlalchemy>=1.5", "sqlalchemy-bigquery>=1.9", "databricks-sql-connector>=3.0"]
test = ["pytest>=8", "fastapi>=0.110"]
all = ["aegis-platform[server,postgres,ai,actions,agent]"]

[project.scripts]
aegis = "aegis.cli:main"

[project.entry-points."datahub.ingestion.sink.plugins"]
aegis-encrypted = "aegis.agent.sink:EncryptedGatewaySink"

[project.entry-points."datahub_actions.action.plugins"]
aegis_pii_propagation = "aegis.governance.propagation_action:PiiPropagationAction"
aegis_label_propagation = "aegis.governance.propagation_rules:LabelPropagationAction"
aegis_vector_indexer = "aegis.ai.indexer_action:VectorIndexerAction"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
