# Drop this file at /etc/datahub/plugins/auth/config.yml (or ${HOME}/.datahub/plugins/auth/config.yml)
# and the jar at /etc/datahub/plugins/auth/aegis-authorizer/aegis-authorizer.jar.
# The plugin directory name must equal the `name` below.
#
# GMS env to set alongside:
#   additive mode      → AUTH_POLICIES_ENABLED=true   (native policies stay in the chain)
#   authoritative mode → AUTH_POLICIES_ENABLED=false  (this plugin is the only authorizer)
plugins:
  - name: "aegis-authorizer"
    type: "authorizer"
    enabled: "true"
    params:
      className: "io.aegis.authorization.AegisAuthorizer"
      configs:
        pdpUrl: "${AEGIS_PDP_URL:-http://aegis-pdp:8810}"
        # Read from the GMS process environment; never put the token in this file.
        serviceTokenEnv: "AEGIS_SERVICE_TOKEN"
        mode: "${AEGIS_AUTHZ_MODE:-additive}"
        connectTimeoutMs: 500
        requestTimeoutMs: 1500
        cacheTtlSeconds: 5
        cacheMaxEntries: 50000
        resolveResourceAttributes: "true"
        # Break-glass actors that are always allowed, even if the PDP is down.
        rootUsers:
          - "urn:li:corpuser:datahub"
        # Privileges allowed when the PDP is unreachable. Keep this list empty in regulated setups.
        failOpenPrivileges: []
        circuitBreaker:
          failureThreshold: 5
          openSeconds: 10
