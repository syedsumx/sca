# Slack app manifest for the Aegis notification hub + chat-ops bot.
# Create the app at https://api.slack.com/apps → "Create New App" → "From an app manifest", paste this
# file, then replace https://aegis.example.com with your AEGIS_PUBLIC_URL (Slack does not expand
# variables). After installing:
#   Bot User OAuth Token  (xoxb-…)  → AEGIS_SLACK_BOT_TOKEN      (helm: secret aegis-slack/bot-token)
#   Basic Information › Signing Secret → AEGIS_SLACK_SIGNING_SECRET (helm: secret aegis-slack/signing-secret)
display_information:
  name: Aegis
  description: Access requests, certifications, deprecations and data-quality alerts from Aegis.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: Aegis
    always_online: true
  slash_commands:
    - command: /aegis
      url: https://aegis.example.com/aegis/api/integrations/slack/commands
      description: Search the catalog or ask the Aegis assistant
      usage_hint: "search <text> | ask <question>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://aegis.example.com/aegis/api/integrations/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
