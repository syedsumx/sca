# datahub-actions pipeline: column-level PII term propagation along fine-grained lineage.
# Run with: aegis actions -c deploy/actions/pii_propagation.yml
name: aegis_pii_propagation
source:
  type: kafka
  config:
    connection:
      bootstrap: ${AEGIS_KAFKA_BOOTSTRAP:-broker:29092}
      schema_registry_url: ${AEGIS_SCHEMA_REGISTRY_URL:-http://datahub-gms:8080/schema-registry/api/}
    topic_routes:
      mcl: ${METADATA_CHANGE_LOG_VERSIONED_TOPIC_NAME:-MetadataChangeLog_Versioned_v1}
filter:
  event_type: MetadataChangeLogEvent_v1
  event:
    entityType: [dataset, schemaField]
    aspectName: [schemaMetadata, editableSchemaMetadata, glossaryTerms, upstreamLineage]
action:
  type: aegis_pii_propagation
  config:
    # Schema: aegis.governance.propagation_action.PropagationConfig
    max_hops: 5
    blocking_transforms: [HASH, AGGREGATE, COUNT, ENCRYPT, TOKENIZE, MASK]
    dry_run: false
    gms_url: ${AEGIS_GMS_URL:-http://datahub-gms:8080}
    gms_token: ${AEGIS_GMS_TOKEN}
datahub:
  server: ${AEGIS_GMS_URL:-http://datahub-gms:8080}
  token: ${AEGIS_GMS_TOKEN}
options:
  retry_count: 5
  failure_mode: CONTINUE
  failed_events_dir: /tmp/aegis/failed_events
