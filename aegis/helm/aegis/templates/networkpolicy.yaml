{{- if .Values.aegis.networkPolicy.enabled }}
{{- $sel := dict "app.kubernetes.io/name" (include "aegis.name" .) "app.kubernetes.io/instance" .Release.Name }}
# PDP: only GMS (authorizer plugin) and Aegis components may ask for decisions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-pdp
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: pdp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.aegis.networkPolicy.gmsPodSelector | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- toYaml $sel | nindent 14 }}
      ports:
        - port: http
---
# API: Aegis components, the DataHub frontend/ingress and explicitly configured sources.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-api
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $sel | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: datahub-frontend
        {{- with .Values.aegis.networkPolicy.apiIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
---
# Gateway: reachable by remote agents (any source); it is the only internet/PrivateLink-facing service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-gateway
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
---
# Workers (scheduler, actions) and MCP accept no unsolicited ingress except metrics scraping from
# within the namespace; MCP additionally accepts in-namespace clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-workers
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values: ["scheduler", "actions-pii-propagation", "actions-vector-indexer", "mcp", "context-miner", "notifier"]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
{{- if .Values.aegis.gmsProxy.enabled }}
---
# GMS proxy: on the frontend → GMS hot path. Only the DataHub frontend and Aegis components may call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-gms-proxy
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: gms-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.aegis.networkPolicy.frontendPodSelector | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- toYaml $sel | nindent 14 }}
      ports:
        - port: http
{{- end }}
{{- if .Values.aegis.consumerUi.enabled }}
---
# Consumer UI static assets: fetched by browsers through the ingress (and by the frontend pods).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-consumer-ui
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: consumer-ui
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.aegis.networkPolicy.frontendPodSelector | nindent 14 }}
        {{- with .Values.aegis.networkPolicy.apiIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
{{- end }}
{{- if .Values.aegis.notifier.enabled }}
---
# Notifier egress: in-cluster dependencies (DB, GMS, DNS) plus HTTPS/SMTP to Slack, Teams and the
# mail relay. Restrict external destinations with aegis.networkPolicy.notifierEgressTo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-notifier-egress
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: notifier
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        - { port: 443, protocol: TCP }
        - { port: 587, protocol: TCP }
        - { port: 465, protocol: TCP }
      {{- with .Values.aegis.networkPolicy.notifierEgressTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
