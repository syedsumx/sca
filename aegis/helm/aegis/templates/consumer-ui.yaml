{{- if .Values.aegis.consumerUi.enabled }}
{{- $u := .Values.aegis.consumerUi }}
{{- $ctx := dict "root" $ "component" "consumer-ui" "cfg" $u }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.componentName" $ctx }}
  labels:
    {{- include "aegis.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $u.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.componentLabels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.aegis.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.aegis.podSecurityContext | nindent 8 }}
      containers:
        - name: consumer-ui
          image: {{ printf "%s:%s" $u.image.repository (default .Chart.AppVersion $u.image.tag) }}
          imagePullPolicy: {{ $u.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $u.port }}
              protocol: TCP
          readinessProbe:
            httpGet: { path: /aegis-ui/remoteEntry.js, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /aegis-ui/remoteEntry.js, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml $u.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.aegis.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with $u.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{ include "aegis.service" (merge (dict "port" $u.port) $ctx) }}
{{- with (include "aegis.pdb" $ctx) }}
---
{{ . }}
{{- end }}
{{- if $u.ingress.enabled }}
---
# Serves /aegis-ui/* on the DataHub UI host (same origin as the frontend, required for the MFE).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aegis.componentName" $ctx }}
  labels:
    {{- include "aegis.componentLabels" $ctx | nindent 4 }}
  {{- with $u.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $u.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $u.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $u.ingress.host | quote }}
      http:
        paths:
          - path: {{ $u.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "aegis.componentName" $ctx }}
                port:
                  name: http
{{- end }}
{{- end }}
