{{- if and .Values.aegis.policies.files (not .Values.aegis.policies.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}-policies
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  {{- range $file, $body := .Values.aegis.policies.files }}
  {{ $file }}: |
    {{- $body | nindent 4 }}
  {{- end }}
---
{{- end }}
# Authorizer plugin config for GMS. The init-container image ships an identical default; mount this
# ConfigMap over /etc/datahub/plugins/auth/config.yml to customise it without rebuilding the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}-authorizer-config
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  config.yml: |
    plugins:
      - name: "aegis-authorizer"
        type: "authorizer"
        enabled: "true"
        params:
          className: "io.aegis.authorization.AegisAuthorizer"
          configs:
            pdpUrl: {{ printf "http://%s-pdp.%s.svc.cluster.local:%v" (include "aegis.fullname" .) .Release.Namespace .Values.aegis.pdp.port | quote }}
            serviceTokenEnv: "AEGIS_SERVICE_TOKEN"
            mode: {{ .Values.aegis.auth.mode | quote }}
            connectTimeoutMs: 500
            requestTimeoutMs: 1500
            cacheTtlSeconds: 5
            cacheMaxEntries: 50000
            rootUsers:
              {{- toYaml .Values.aegis.auth.rootUsers | nindent 14 }}
            failOpenPrivileges: []
            circuitBreaker:
              failureThreshold: 5
              openSeconds: 10
{{- if .Values.aegis.consumerUi.enabled }}
---
# DataHub micro-frontend config: mounted into datahub-frontend at /etc/datahub/mfe (MFE_CONFIG_FILE_PATH).
# datahub-frontend reads it once at startup; roll the frontend after changing it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}-mfe-config
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  mfe.config.yaml: |
    {{- .Values.aegis.mfe.config | nindent 4 }}
{{- end }}
