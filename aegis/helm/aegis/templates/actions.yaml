{{- $cm := printf "%s-actions" (include "aegis.fullname" $) }}
{{- $pipelines := dict "pii-propagation" (dict "cfg" .Values.aegis.actions.piiPropagation "file" "pii_propagation.yml") "vector-indexer" (dict "cfg" .Values.aegis.actions.vectorIndexer "file" "vector_indexer.yml") "label-propagation" (dict "cfg" .Values.aegis.actions.labelPropagation "file" "label_propagation.yml") }}
{{- $any := or .Values.aegis.actions.piiPropagation.enabled .Values.aegis.actions.vectorIndexer.enabled .Values.aegis.actions.labelPropagation.enabled }}
{{- if $any }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cm }}
  labels:
    {{- include "aegis.labels" $ | nindent 4 }}
data:
  {{- ($.Files.Glob "files/actions/*.yml").AsConfig | nindent 2 }}
{{- end }}
{{- range $name, $p := $pipelines }}
{{- if $p.cfg.enabled }}
---
{{- $ctx := dict "root" $ "component" (printf "actions-%s" $name) "cfg" $p.cfg "replicas" $p.cfg.replicas "args" (list "actions" "-c" (printf "/etc/aegis/actions/%s" $p.file)) "extraVolumes" (list (dict "name" "actions" "configMap" (dict "name" $cm))) "extraVolumeMounts" (list (dict "name" "actions" "mountPath" "/etc/aegis/actions" "readOnly" true)) }}
{{ include "aegis.deployment" $ctx }}
{{- end }}
{{- end }}
