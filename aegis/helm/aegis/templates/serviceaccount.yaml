{{- if .Values.aegis.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegis.serviceAccountName" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  {{- with .Values.aegis.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
