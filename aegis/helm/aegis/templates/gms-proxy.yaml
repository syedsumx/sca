{{- if .Values.aegis.gmsProxy.enabled }}
{{- /*
Masking middleware (frontend → gms-proxy → GMS). Every path except /__aegis/* is proxied to GMS,
so probes and metrics use the /__aegis/ prefix.
*/}}
{{- $g := .Values.aegis.gmsProxy }}
{{- $env := list (dict "name" "AEGIS_SESSION_SIGNING_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" $g.sessionSigningKey.secretRef "key" $g.sessionSigningKey.secretKey))) }}
{{- $ctx := dict "root" $ "component" "gms-proxy" "cfg" $g "replicas" $g.replicas "port" (int $g.port) "healthPath" "/__aegis/health" "metricsPath" "/__aegis/metrics" "extraEnv" $env "args" (list "gms-proxy" "--host" "0.0.0.0" "--port" (toString $g.port) "--upstream" (default .Values.aegis.gms.url $g.upstream)) }}
{{ include "aegis.deployment" $ctx }}
---
{{ include "aegis.service" (merge (dict "port" $g.port) $ctx) }}
{{- with (include "aegis.hpa" $ctx) }}
---
{{ . }}
{{- end }}
{{- with (include "aegis.pdb" $ctx) }}
---
{{ . }}
{{- end }}
{{- end }}
