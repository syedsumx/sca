# Default values for aegis.
#
# Two layers:
#   datahub:  pass-through values for the official DataHub chart (dependency). Only the keys Aegis needs
#             are shown; see https://github.com/acryldata/datahub-helm for the full reference.
#   aegis:      the Aegis enterprise control plane.

# ============================================================================================
# DataHub Core (official chart, https://helm.datahubproject.io)
# ============================================================================================
datahub:
  # Set to false to attach Aegis to an existing DataHub release; then set aegis.gms.url accordingly.
  enabled: true

  global:
    datahub:
      version: v1.8.0
      # Token auth is required: Aegis services and the authorizer plugin act as real principals.
      metadata_service_authentication:
        enabled: true

  datahub-gms:
    # --- Aegis authorizer plugin wiring -------------------------------------------------------
    # 1. An initContainer copies the plugin jar + config.yml into an emptyDir.
    # 2. The emptyDir is mounted at /etc/datahub/plugins/auth in GMS.
    # 3. Env vars point the plugin at the PDP and select the mode.
    # In authoritative mode set AUTH_POLICIES_ENABLED to "false" (and aegis.auth.mode=authoritative).
    extraInitContainers:
      - name: aegis-authorizer-plugin
        image: aegis/authorizer:0.1.0
        imagePullPolicy: IfNotPresent
        env:
          - name: PLUGIN_DIR
            value: /etc/datahub/plugins/auth
        volumeMounts:
          - name: aegis-auth-plugins
            mountPath: /etc/datahub/plugins/auth
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    extraVolumes:
      - name: aegis-auth-plugins
        emptyDir: {}
    extraVolumeMounts:
      - name: aegis-auth-plugins
        mountPath: /etc/datahub/plugins/auth
    extraEnvs:
      # Aegis branding of the DataHub shell (assets served by aegis-consumer-ui at /aegis-ui/brand/).
      - name: REACT_APP_LOGO_URL
        value: /aegis-ui/brand/aegis-logo.svg
      - name: REACT_APP_FAVICON_URL
        value: /aegis-ui/brand/favicon.svg
      - name: REACT_APP_TITLE
        value: Aegis
      - name: AUTH_POLICIES_ENABLED
        value: "true"
      - name: AEGIS_AUTHZ_MODE
        value: additive
      - name: VIEW_AUTHORIZATION_ENABLED
        value: "true"
      # Must resolve to the PDP Service of this release: <release>-aegis-pdp
      - name: AEGIS_PDP_URL
        value: http://datahub-aegis-pdp:8810
      - name: AEGIS_SERVICE_TOKEN
        valueFrom:
          secretKeyRef:
            name: aegis-secrets
            key: service-token

  datahub-frontend:
    # --- Active Metadata layer wiring. If you disable aegis.gmsProxy, delete datahub.gms below (the
    # frontend would otherwise point at a missing Service); if you disable aegis.consumerUi, delete the
    # MFE env/volume entries. ---
    # 1. All UI → GMS traffic goes through the Aegis masking middleware. The frontend subchart reads
    #    datahub.gms.host/port before the global values, so only the frontend is re-pointed; every
    #    other component (and the proxy itself) still talks to GMS directly.
    #    Must resolve to the gms-proxy Service of this release: <release>-aegis-gms-proxy
    datahub:
      gms:
        host: datahub-aegis-gms-proxy
        port: "8890"
    # 2. Mount the Aegis workspace micro-frontend config (ConfigMap rendered by this chart).
    extraEnvs:
      - name: MFE_CONFIG_FILE_PATH
        value: /etc/datahub/mfe/mfe.config.yaml
    extraVolumes:
      - name: aegis-mfe-config
        configMap:
          # <release>-aegis-mfe-config
          name: datahub-aegis-mfe-config
    extraVolumeMounts:
      - name: aegis-mfe-config
        mountPath: /etc/datahub/mfe
        readOnly: true

# ============================================================================================
# Aegis control plane
# ============================================================================================
global:
  aegis:
    image:
      repository: aegis/platform
      tag: ""            # defaults to .Chart.AppVersion
      pullPolicy: IfNotPresent
    imagePullSecrets: []

aegis:
  # DataHub endpoints as seen from inside the cluster. Defaults match the official chart's service names
  # for a release named "datahub"; override when using another release name or an external DataHub.
  gms:
    url: http://datahub-datahub-gms:8080
    frontendUrl: http://datahub-datahub-frontend:9002

  # Kubernetes Secret holding Aegis credentials. Create it yourself (or with ExternalSecrets / Vault):
  #   kubectl create secret generic aegis-secrets \
  #     --from-literal=service-token=$(openssl rand -hex 32) \
  #     --from-literal=gms-token=<DataHub PAT for the aegis service user> \
  #     --from-literal=database-url='postgresql+psycopg://aegis:***@aegis-postgres:5432/aegis' \
  #     --from-literal=anthropic-api-key=<optional>
  secrets:
    name: aegis-secrets
    serviceTokenKey: service-token
    gmsTokenKey: gms-token
    databaseUrlKey: database-url
    anthropicApiKeyKey: anthropic-api-key
    # Active Metadata layer: HMAC secrets for one-click action links (Teams/email) and embed tokens.
    #   --from-literal=action-link-secret=$(openssl rand -hex 32)
    #   --from-literal=embed-signing-secret=$(openssl rand -hex 32)
    actionLinkSecretKey: action-link-secret
    embedSigningSecretKey: embed-signing-secret

  auth:
    # additive | authoritative  (authoritative requires datahub-gms AUTH_POLICIES_ENABLED=false)
    mode: additive
    importNativePolicies: true
    decisionCacheTtlSeconds: 30
    rootUsers:
      - urn:li:corpuser:datahub

  kafka:
    bootstrap: datahub-prerequisites-kafka:9092
    schemaRegistryUrl: http://datahub-datahub-gms:8080/schema-registry/api/

  ai:
    # anthropic | ollama | none
    llmProvider: none
    model: claude-opus-5-5
    effort: high
    ollamaUrl: http://ollama:11434
    # hashing | ollama | datahub
    embeddingProvider: hashing
    auditPrompts: false

  # ABAC policy bundle (YAML documents) mounted at AEGIS_POLICY_DIR. Empty → the policies baked into the
  # image (/etc/aegis/config/policies) are used. Alternatively reference an existing ConfigMap.
  policies:
    existingConfigMap: ""
    files: {}
    #  10-pii.yaml: |
    #    policies: [...]

  extraEnv: []

  # ============================================================ Active Metadata layer
  # Public base URL users reach DataHub on (Slack/Teams links, embed snippets, OAuth-style redirects).
  publicUrl: https://aegis.example.com

  embeds:
    # Origins allowed to frame Aegis embeds (CSP frame-ancestors) and call the embed API.
    allowedOrigins: []
    #  - https://acme.looker.com
    #  - https://*.online.tableau.com
    #  - https://app.powerbi.com

  integrations:
    slack:
      enabled: false
      # Secret with the Slack app credentials (see deploy/slack/app-manifest.yaml).
      existingSecret: aegis-slack
      botTokenKey: bot-token
      signingSecretKey: signing-secret
    teams:
      enabled: false
      # Secret with the default Teams Workflows webhook URL (per-domain routes live in Aegis).
      existingSecret: aegis-teams
      webhookUrlKey: webhook-url
    email:
      enabled: false
      existingSecret: aegis-smtp
      smtpUrlKey: smtp-url

  # Micro-frontend config mounted into datahub-frontend (see datahub.datahub-frontend above).
  mfe:
    config: |
      topLevelMenuTitle: Workspace
      subNavigationMode: false
      loadTimeoutMs: 30000
      microFrontends:
        - id: AegisWorkspace
          label: Workspace
          path: /aegis
          remoteEntry: /aegis-ui/remoteEntry.js
          module: aegisConsumer/mount
          flags:
            enabled: true
            showInNav: true
          navIcon: Compass

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -------------------------------------------------------------------------- components
  api:
    enabled: true
    replicas: 2
    port: 8800
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    ingress:
      enabled: false
      className: ""
      host: datahub.example.com
      path: /aegis/api
      annotations: {}
      tls: []
    nodeSelector: {}
    tolerations: []
    affinity: {}

  pdp:
    enabled: true
    # The PDP is on the GMS authorization hot path: keep >= 2 replicas.
    replicas: 2
    port: 8810
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 768Mi }
    pdb:
      enabled: true
      minAvailable: 1
    nodeSelector: {}
    tolerations: []
    affinity: {}

  gateway:
    enabled: true
    replicas: 2
    port: 8820
    publicUrl: https://aegis-gateway.example.com
    # The gateway's X25519/Ed25519 identity must be identical on every replica. Provide it as a Secret
    # (files: gateway_x25519.key, gateway_ed25519.key). If empty, a PVC is used and replicas is forced to 1.
    keys:
      existingSecret: ""
      persistence:
        size: 64Mi
        storageClass: ""
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    # Public (or PrivateLink / VPC endpoint) exposure for remote agents.
    service:
      type: ClusterIP
      annotations: {}
    ingress:
      enabled: false
      className: ""
      host: aegis-gateway.example.com
      annotations: {}
      tls: []
    nodeSelector: {}
    tolerations: []
    affinity: {}

  mcp:
    enabled: true
    replicas: 1
    port: 8830
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 768Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  scheduler:
    enabled: true
    # Leader election uses a Postgres advisory lock; standby replicas take over within one tick.
    replicas: 2
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  actions:
    piiPropagation:
      enabled: true
      replicas: 1
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 768Mi }
    # Rule-based tag/term propagation (edit files/actions/label_propagation.yml for the rules).
    labelPropagation:
      enabled: false
      replicas: 1
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 768Mi }
    vectorIndexer:
      enabled: true
      replicas: 1
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 1Gi }

  # ---------------------------------------------------------------- Active Metadata components
  # Masking middleware between datahub-frontend and GMS. It sits on the UI hot path: keep >= 2
  # replicas with a PDB. Stateless; scales horizontally.
  gmsProxy:
    enabled: true
    replicas: 2
    port: 8890
    # Upstream GMS; defaults to aegis.gms.url.
    upstream: ""
    # DataHub's session-token signing key, used read-only to verify session JWTs (actorId claim).
    # Defaults match the official chart's provisioned auth secret.
    sessionSigningKey:
      secretRef: datahub-auth-secrets
      secretKey: token_service_signing_key
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 768Mi }
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Context Agents: mine queries, dbt, BI semantics and run histories (findings, drift, ontology).
  contextMiner:
    enabled: true
    replicas: 1
    intervalSeconds: 300
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 1536Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Notification hub fan-out to Slack / Teams / email / in-app.
  notifier:
    enabled: true
    replicas: 1
    intervalSeconds: 10
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { memory: 512Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Static host for the consumer workspace MFE (remoteEntry.js) and the embed SDK (web components).
  consumerUi:
    enabled: true
    replicas: 2
    port: 8080
    image:
      repository: aegis/consumer-ui
      tag: ""            # defaults to .Chart.AppVersion
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 128Mi }
    pdb:
      enabled: true
      minAvailable: 1
    # Must share the DataHub UI's origin so the MFE can use the session cookie.
    ingress:
      enabled: false
      className: ""
      host: datahub.example.com
      path: /aegis-ui
      annotations: {}
      tls: []
    nodeSelector: {}
    tolerations: []
    affinity: {}

  networkPolicy:
    enabled: true
    # Label selector for the GMS pods allowed to call the PDP.
    gmsPodSelector:
      app.kubernetes.io/name: datahub-gms
    # Label selector for the datahub-frontend pods (the only callers of the gms-proxy besides Aegis).
    frontendPodSelector:
      app.kubernetes.io/name: datahub-frontend
    # Egress for the notifier (Slack / Teams / SMTP over 443/587). Empty = allow any destination on
    # those ports; restrict with ipBlock / namespaceSelector entries for an egress proxy.
    notifierEgressTo: []
    # Extra ingress sources allowed to reach the API (e.g. the ingress controller namespace).
    apiIngressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx

  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

  serviceAccount:
    create: true
    name: ""
    annotations: {}
