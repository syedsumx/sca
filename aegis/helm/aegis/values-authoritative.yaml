# Overlay for authoritative ABAC mode: the Aegis authorizer becomes the ONLY authorizer in GMS
# (AuthorizerChain is first-ALLOW-wins, so the native authorizer must be removed from the chain).
#   helm upgrade --install datahub . -f values.yaml -f values-authoritative.yaml
# NOTE: Helm replaces lists wholesale, so extraEnvs is restated in full here.
aegis:
  auth:
    mode: authoritative

datahub:
  datahub-gms:
    extraEnvs:
      # Aegis branding of the DataHub shell (assets served by aegis-consumer-ui at /aegis-ui/brand/).
      - name: REACT_APP_LOGO_URL
        value: /aegis-ui/brand/aegis-logo.svg
      - name: REACT_APP_FAVICON_URL
        value: /aegis-ui/brand/favicon.svg
      - name: REACT_APP_TITLE
        value: Aegis
      - name: AUTH_POLICIES_ENABLED
        value: "false"
      - name: AEGIS_AUTHZ_MODE
        value: authoritative
      - name: VIEW_AUTHORIZATION_ENABLED
        value: "true"
      - name: AEGIS_PDP_URL
        value: http://datahub-aegis-pdp:8810
      - name: AEGIS_SERVICE_TOKEN
        valueFrom:
          secretKeyRef:
            name: aegis-secrets
            key: service-token
