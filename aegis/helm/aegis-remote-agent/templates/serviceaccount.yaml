{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent.serviceAccountName" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Token is mounted only when annotations request cloud workload identity (IRSA / GKE WI / Vault k8s auth).
automountServiceAccountToken: {{ not (empty .Values.serviceAccount.annotations) }}
{{- end }}
