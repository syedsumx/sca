[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codescope"
version = "0.1.0"
description = "A powerful Software Composition Analysis (SCA) tool for code quality and security"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "CodeScope Team" }
]
keywords = [
    "code-analysis",
    "static-analysis",
    "security",
    "sca",
    "code-quality",
    "linter",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "radon>=6.0.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "alembic>=1.12.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
]
all = [
    "codescope[dev,api]",
]

[project.scripts]
codescope = "codescope.cli.main:app"

[project.urls]
Homepage = "https://github.com/codescope/codescope"
Documentation = "https://codescope.readthedocs.io"
Repository = "https://github.com/codescope/codescope"

[tool.hatch.build.targets.wheel]
packages = ["src/codescope"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
