services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tether
      POSTGRES_PASSWORD: tether
      POSTGRES_DB: tether
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tether -d tether"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment: &backend-env
      TETHER_DATABASE_URL: postgresql+psycopg://tether:tether@db:5432/tether
      TETHER_TEST_DATABASE_URL: postgresql+psycopg://tether:tether@db:5432/tether_test
      TETHER_EMBEDDER: ${TETHER_EMBEDDER:-fake}
      TETHER_DELETION_STEP_DELAY: ${TETHER_DELETION_STEP_DELAY:-1.5}
      TETHER_OPENLINEAGE_URL: ${TETHER_OPENLINEAGE_URL:-}
      TETHER_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      TETHER_API_URL: http://api:8000
    ports:
      - "8000:8000"
    volumes:
      - ./certificates:/app/certificates
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    build: .
    command: ["tether", "worker"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy

  ui:
    build: ./ui
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
