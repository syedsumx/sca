# Slack app manifest for the DHE notification hub + chat-ops bot.
# Create the app at https://api.slack.com/apps → "Create New App" → "From an app manifest", paste this
# file, then replace https://datahub.example.com with your DHE_PUBLIC_URL (Slack does not expand
# variables). After installing:
#   Bot User OAuth Token  (xoxb-…)  → DHE_SLACK_BOT_TOKEN      (helm: secret dhe-slack/bot-token)
#   Basic Information › Signing Secret → DHE_SLACK_SIGNING_SECRET (helm: secret dhe-slack/signing-secret)
display_information:
  name: DataHub
  description: Access requests, certifications, deprecations and data-quality alerts from DataHub.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: DataHub
    always_online: true
  slash_commands:
    - command: /datahub
      url: https://datahub.example.com/dhe/api/integrations/slack/commands
      description: Search the catalog or ask the DataHub assistant
      usage_hint: "search <text> | ask <question>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://datahub.example.com/dhe/api/integrations/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
