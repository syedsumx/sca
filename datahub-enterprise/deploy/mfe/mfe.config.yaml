# DataHub micro-frontend config for the DHE consumer workspace.
# datahub-frontend reads it once at startup (MFE_CONFIG_FILE_PATH) and serves it with a 5-minute
# browser cache: restart datahub-frontend after editing.
#
# remoteEntry is same-origin (served by dhe-consumer-ui behind the edge proxy / ingress at /dhe-ui/),
# so the workspace can call /api/v2/graphql and /dhe/api/* with the user's DataHub session cookie.
# Keep in sync with ui/mfe.config.yaml.
topLevelMenuTitle: Workspace
subNavigationMode: false
loadTimeoutMs: 30000
microFrontends:
  - id: DheWorkspace
    label: Workspace
    path: /dhe
    remoteEntry: /dhe-ui/remoteEntry.js
    module: dheConsumer/mount
    flags:
      enabled: true
      showInNav: true
    navIcon: Compass
