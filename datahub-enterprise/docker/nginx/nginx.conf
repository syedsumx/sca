# DHE edge proxy: one origin for the DataHub UI and the DHE control-plane API so the enterprise UI
# modules can call /dhe/api/* with the user's DataHub session cookies (no CORS needed).
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  client_max_body_size 32m;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"upstream":"$upstream_addr","trace":"$http_traceparent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS; re-resolve so container restarts do not leave stale upstream IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # DHE control-plane API. Prefix is stripped: /dhe/api/quality/monitors → dhe-api:8800/quality/monitors
    location /dhe/api/ {
      set $dhe_api http://dhe-api:8800;
      rewrite ^/dhe/api/(.*)$ /$1 break;
      proxy_pass $dhe_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /dhe/api;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_pass_header Set-Cookie;
      # Streaming answers from /ai/ask (SSE).
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    # Remote-MCP endpoint for IDE agents (streamable HTTP).
    location /dhe/mcp/ {
      set $dhe_mcp http://dhe-mcp:8830;
      rewrite ^/dhe/mcp/(.*)$ /$1 break;
      proxy_pass $dhe_mcp;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # Everything else → DataHub frontend (UI, /api/v2/graphql, SSO callbacks).
    location / {
      set $frontend http://datahub-frontend-react:9002;
      proxy_pass $frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass_header Set-Cookie;
      proxy_read_timeout 120s;
    }
  }
}
