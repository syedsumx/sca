# Overlay for authoritative ABAC mode: the DHE authorizer becomes the ONLY authorizer in GMS
# (AuthorizerChain is first-ALLOW-wins, so the native authorizer must be removed from the chain).
#   helm upgrade --install datahub . -f values.yaml -f values-authoritative.yaml
# NOTE: Helm replaces lists wholesale, so extraEnvs is restated in full here.
dhe:
  auth:
    mode: authoritative

datahub:
  datahub-gms:
    extraEnvs:
      - name: AUTH_POLICIES_ENABLED
        value: "false"
      - name: DHE_AUTHZ_MODE
        value: authoritative
      - name: VIEW_AUTHORIZATION_ENABLED
        value: "true"
      - name: DHE_PDP_URL
        value: http://datahub-datahub-enterprise-pdp:8810
      - name: DHE_SERVICE_TOKEN
        valueFrom:
          secretKeyRef:
            name: dhe-secrets
            key: service-token
