# datahub-actions pipeline: keep the DHE semantic (pgvector) index fresh from MCL.
# Run with: dhe actions -c deploy/actions/vector_indexer.yml
name: dhe_vector_indexer
source:
  type: kafka
  config:
    connection:
      bootstrap: ${DHE_KAFKA_BOOTSTRAP:-broker:29092}
      schema_registry_url: ${DHE_SCHEMA_REGISTRY_URL:-http://datahub-gms:8080/schema-registry/api/}
    topic_routes:
      mcl: ${METADATA_CHANGE_LOG_VERSIONED_TOPIC_NAME:-MetadataChangeLog_Versioned_v1}
filter:
  event_type: MetadataChangeLogEvent_v1
  event:
    entityType: [dataset, dashboard, chart, dataJob, dataFlow, mlModel, glossaryTerm, domain, dataProduct]
    aspectName:
      - datasetProperties
      - editableDatasetProperties
      - schemaMetadata
      - editableSchemaMetadata
      - globalTags
      - glossaryTerms
      - domains
      - ownership
      - dashboardInfo
      - chartInfo
      - status
action:
  type: dhe_vector_indexer
  config:
    database_url: ${DHE_DATABASE_URL}
    embedding_provider: ${DHE_EMBEDDING_PROVIDER:-hashing}
datahub:
  server: ${DHE_GMS_URL:-http://datahub-gms:8080}
  token: ${DHE_GMS_TOKEN}
options:
  retry_count: 5
  failure_mode: CONTINUE
  failed_events_dir: /tmp/dhe/failed_events
