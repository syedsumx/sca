# datahub-actions pipeline: rule-based tag + glossary-term propagation along column lineage.
# Run with: dhe actions -c deploy/actions/label_propagation.yml
name: dhe_label_propagation
source:
  type: kafka
  config:
    connection:
      bootstrap: ${DHE_KAFKA_BOOTSTRAP:-broker:29092}
      schema_registry_url: ${DHE_SCHEMA_REGISTRY_URL:-http://datahub-gms:8080/schema-registry/api/}
    topic_routes:
      mcl: ${METADATA_CHANGE_LOG_VERSIONED_TOPIC_NAME:-MetadataChangeLog_Versioned_v1}
filter:
  event_type: MetadataChangeLogEvent_v1
  event:
    entityType: [dataset, schemaField]
    aspectName: [schemaMetadata, editableSchemaMetadata, upstreamLineage]
action:
  type: dhe_label_propagation
  config:
    # Schema: datahub_enterprise.governance.propagation_rules.RulesConfig
    rules:
      - id: gdpr-tags
        labels: ["urn:li:tag:gdpr*", "urn:li:tag:Confidential"]
        max_hops: 5
      - id: finance-terms
        labels: ["urn:li:glossaryTerm:Finance.*"]
        max_hops: 3
        blocking_transforms: [AGGREGATE, COUNT, HASH]
        target_platforms: [snowflake, dbt, looker]
    dry_run: false
    gms_url: ${DHE_GMS_URL:-http://datahub-gms:8080}
    gms_token: ${DHE_GMS_TOKEN}
datahub:
  server: ${DHE_GMS_URL:-http://datahub-gms:8080}
  token: ${DHE_GMS_TOKEN}
options:
  retry_count: 5
  failure_mode: CONTINUE
  failed_events_dir: /tmp/dhe/failed_events
