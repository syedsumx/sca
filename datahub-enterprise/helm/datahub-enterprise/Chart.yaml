apiVersion: v2
name: datahub-enterprise
description: >-
  DataHub Core (official chart) plus the DHE enterprise extension layer: native data quality engine,
  ABAC/RBAC policy decision point + GMS authorizer plugin, in-VPC remote agent gateway, and AI/MCP services.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
keywords: [datahub, metadata, governance, data-quality, mcp]
home: https://github.com/syedsumx/sca/tree/main/datahub-enterprise
sources:
  - https://github.com/datahub-project/datahub
  - https://github.com/acryldata/datahub-helm
dependencies:
  # Official DataHub chart. Disable (datahub.enabled=false) to attach DHE to an existing DataHub install.
  - name: datahub
    version: "~1.1.8"
    repository: https://helm.datahubproject.io/
    condition: datahub.enabled
annotations:
  artifacthub.io/license: Apache-2.0
