{{- if .Values.dhe.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dhe.fullname" . }}
  labels:
    {{- include "dhe.labels" . | nindent 4 }}
    {{- with .Values.dhe.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: datahub-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.dhe.serviceMonitor.interval }}
{{- end }}
