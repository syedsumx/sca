{{- if .Values.dhe.gmsProxy.enabled }}
{{- /*
Masking middleware (frontend → gms-proxy → GMS). Every path except /__dhe/* is proxied to GMS,
so probes and metrics use the /__dhe/ prefix.
*/}}
{{- $g := .Values.dhe.gmsProxy }}
{{- $env := list (dict "name" "DHE_SESSION_SIGNING_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" $g.sessionSigningKey.secretRef "key" $g.sessionSigningKey.secretKey))) }}
{{- $ctx := dict "root" $ "component" "gms-proxy" "cfg" $g "replicas" $g.replicas "port" (int $g.port) "healthPath" "/__dhe/health" "metricsPath" "/__dhe/metrics" "extraEnv" $env "args" (list "gms-proxy" "--host" "0.0.0.0" "--port" (toString $g.port) "--upstream" (default .Values.dhe.gms.url $g.upstream)) }}
{{ include "dhe.deployment" $ctx }}
---
{{ include "dhe.service" (merge (dict "port" $g.port) $ctx) }}
{{- with (include "dhe.hpa" $ctx) }}
---
{{ . }}
{{- end }}
{{- with (include "dhe.pdb" $ctx) }}
---
{{ . }}
{{- end }}
{{- end }}
