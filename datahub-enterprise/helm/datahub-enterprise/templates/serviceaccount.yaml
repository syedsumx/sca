{{- if .Values.dhe.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dhe.serviceAccountName" . }}
  labels:
    {{- include "dhe.labels" . | nindent 4 }}
  {{- with .Values.dhe.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
