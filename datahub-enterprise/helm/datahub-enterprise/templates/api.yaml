{{- if .Values.dhe.api.enabled }}
{{- $ctx := dict "root" $ "component" "api" "cfg" .Values.dhe.api "replicas" .Values.dhe.api.replicas "port" (int .Values.dhe.api.port) "args" (list "api" "--host" "0.0.0.0" "--port" (toString .Values.dhe.api.port)) }}
{{ include "dhe.deployment" $ctx }}
---
{{ include "dhe.service" (merge (dict "port" .Values.dhe.api.port) $ctx) }}
{{- with (include "dhe.hpa" $ctx) }}
---
{{ . }}
{{- end }}
{{- with (include "dhe.pdb" $ctx) }}
---
{{ . }}
{{- end }}
{{- if .Values.dhe.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dhe.componentName" $ctx }}
  labels:
    {{- include "dhe.componentLabels" $ctx | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- with .Values.dhe.api.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.dhe.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.dhe.api.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.dhe.api.ingress.host | quote }}
      http:
        paths:
          - path: {{ printf "%s(/|$)(.*)" (trimSuffix "/" .Values.dhe.api.ingress.path) }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "dhe.componentName" $ctx }}
                port:
                  name: http
{{- end }}
{{- end }}
