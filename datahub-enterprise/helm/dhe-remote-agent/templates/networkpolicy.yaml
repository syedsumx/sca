{{- if .Values.networkPolicy.enabled }}
# Egress-only posture: no ingress at all; egress limited to DNS, the gateway, and declared sources.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - {{- if .Values.networkPolicy.gatewayCIDRs }}
      to:
        {{- range .Values.networkPolicy.gatewayCIDRs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      {{- end }}
      ports:
        - { port: {{ .Values.networkPolicy.gatewayPort }}, protocol: TCP }
    {{- with .Values.networkPolicy.sourceEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
