{{- if and .Values.state.persistence.enabled (gt (int .Values.replicas) 1) }}
{{- fail "state.persistence uses a ReadWriteOnce PVC per release: install one release per agent (replicas: 1) or disable persistence" }}
{{- end }}
{{- if and (not .Values.enrollment.existingSecret) (not .Values.enrollment.token) }}
{{- fail "set enrollment.existingSecret (recommended) or enrollment.token" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ include "agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ not (empty .Values.serviceAccount.annotations) }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: {{ printf "%s:%s" .Values.image.repository (default .Chart.AppVersion .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "--config", "/etc/dhe-agent/agent.yml"]
          env:
            - name: DHE_AGENT_GATEWAY_URL
              value: {{ .Values.gateway.url | quote }}
            - name: DHE_AGENT_POOL
              value: {{ .Values.pool | quote }}
            - name: DHE_AGENT_STATE_DIR
              value: /var/lib/dhe-agent
            - name: DHE_AGENT_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.enrollmentSecret" . }}
                  key: token
                  optional: true
            {{- if .Values.gateway.caBundle }}
            - name: SSL_CERT_FILE
              value: /etc/dhe-agent/ca.pem
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.sourceCredentialsEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # No ports: the agent only makes outbound calls. Liveness = the agent process exiting on a
          # fatal error (it heartbeats the gateway; the gateway alerts on missed heartbeats).
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/dhe-agent
              readOnly: true
            - name: state
              mountPath: /var/lib/dhe-agent
            - name: tmp
              mountPath: /tmp/dhe
            {{- if .Values.sourceCredentialsSecret }}
            - name: source-credentials
              mountPath: /run/secrets/dhe
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "agent.fullname" . }}
        - name: state
          {{- if .Values.state.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "agent.fullname" . }}-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.state.spoolSizeLimit }}
        {{- if .Values.sourceCredentialsSecret }}
        - name: source-credentials
          secret:
            secretName: {{ .Values.sourceCredentialsSecret }}
            defaultMode: 0400
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
