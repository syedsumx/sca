{{- if and (not .Values.enrollment.existingSecret) .Values.enrollment.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.enrollmentSecret" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.enrollment.token | quote }}
{{- end }}
