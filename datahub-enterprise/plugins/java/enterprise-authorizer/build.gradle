plugins {
  id 'java-library'
}

group = 'io.dhe'
version = '0.1.0'

// Version of the DataHub Auth API to compile against. 1.5.0 is the newest release whose classes are
// Java 17 bytecode (1.6+ ships Java 25 class files and requires -PjavaToolchain=25). The SPI used
// here (Authorizer, AuthorizationRequest, EntitySpecResolver) is stable across 1.x, and the two
// newer accessors are resolved reflectively, so this jar runs on GMS 1.5 → 1.8+.
// Build against a newer API with e.g.:  ./gradlew build -PdatahubAuthApiVersion=1.7.0.17 -PjavaToolchain=25
def datahubAuthApiVersion = project.findProperty('datahubAuthApiVersion') ?: '1.5.0'
def javaToolchain = (project.findProperty('javaToolchain') ?: '21') as int

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(javaToolchain)
  }
  // datahub-auth-api >= 1.5 publishes Gradle metadata declaring org.gradle.jvm.version=25 (the
  // DataHub build's toolchain) although its classes are Java 17 bytecode. Opt out of Gradle's
  // automatic JVM-compatibility matching so we can compile on 21 and emit --release 17 bytecode
  // that loads in every supported GMS image.
  disableAutoTargetJvm()
}

tasks.withType(JavaCompile).configureEach {
  options.release = 17
  options.encoding = 'UTF-8'
  options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:-classfile', '-Xlint:-serial']
}

repositories {
  mavenCentral()
}

dependencies {
  // Provided by GMS at runtime. The plugin deliberately has NO runtime dependencies (no Jackson,
  // no Caffeine) so it cannot clash with the jars GMS ships, and no shading is required.
  compileOnly "io.acryl:datahub-auth-api:${datahubAuthApiVersion}"

  testImplementation "io.acryl:datahub-auth-api:${datahubAuthApiVersion}"
  testImplementation platform('org.junit:junit-bom:5.11.4')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
  testLogging {
    events 'passed', 'skipped', 'failed'
    exceptionFormat 'full'
  }
}

jar {
  // GMS loads <plugin-dir>/<plugin-name>.jar unless params.jarFileName is set, so the file name
  // carries no version (the version is in the manifest).
  archiveFileName = 'dhe-enterprise-authorizer.jar'
  manifest {
    attributes(
      'Implementation-Title': 'DHE Enterprise Authorizer',
      'Implementation-Version': project.version,
    )
  }
}

// Produces build/distributions/dhe-enterprise-authorizer-<version>.zip containing the jar and an
// example config.yml, laid out the way GMS expects under /etc/datahub/plugins/auth/.
tasks.register('pluginBundle', Zip) {
  dependsOn jar
  archiveFileName = "dhe-enterprise-authorizer-${project.version}.zip"
  destinationDirectory = layout.buildDirectory.dir('distributions')
  into('dhe-enterprise-authorizer') {
    from jar.archiveFile
  }
  from('config.yml')
}

assemble.dependsOn pluginBundle
