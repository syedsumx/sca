# Cairn: full local stack.
#
#   cp .env.example .env            # then set every CHANGE_ME
#   deploy/build-images.sh          # or pull cairn/* from your registry
#   docker compose -f docker-compose.cairn.yml up -d
#   docker compose -f docker-compose.cairn.yml --profile ai-local up -d   # + Ollama
#
# Open http://localhost:9000 and sign in as "admin" with CAIRN_ADMIN_PASSWORD.
#
# Topology (see ARCHITECTURE.md §2.8):
#   network "catalog"      Cairn Core + Cairn control plane
#   network "vpc-egress"   the ONLY path between the private VPC and the control plane: gateway <-> agent
#   network "vpc-finance"  simulated customer VPC: remote agent + private source DB (internal, no egress)

name: cairn

# ---------------------------------------------------------------- Cairn Core
x-core-env: &core-env
  CAIRN_DB_HOST: mysql:3306
  CAIRN_DB_NAME: cairn
  CAIRN_DB_USER: root   # cairn-setup creates the schema
  CAIRN_DB_PASSWORD: ${CAIRN_DB_ROOT_PASSWORD:?set CAIRN_DB_ROOT_PASSWORD in .env}
  CAIRN_SEARCH_HOST: search
  CAIRN_KAFKA_BOOTSTRAP: broker:29092
  CAIRN_SYSTEM_CLIENT_SECRET: ${CAIRN_SYSTEM_CLIENT_SECRET:?set CAIRN_SYSTEM_CLIENT_SECRET in .env}
  CAIRN_SESSION_SIGNING_KEY: ${CAIRN_SESSION_SIGNING_KEY:?set CAIRN_SESSION_SIGNING_KEY in .env}
  CAIRN_TOKEN_SALT: ${CAIRN_TOKEN_SALT:?set CAIRN_TOKEN_SALT in .env}

# ---------------------------------------------------------------- Cairn common
x-cairn-env: &cairn-env
  CAIRN_LICENCE_REQUIRED: ${CAIRN_LICENCE_REQUIRED:-false}   # true: read-only until a licence is installed
  CAIRN_TENANT_ID: ${CAIRN_TENANT_ID:-}                      # a licence for another tenant is refused
  CAIRN_CORE_URL: http://cairn-core:8080
  CAIRN_FRONTEND_URL: http://cairn-web:9002
  CAIRN_CORE_TOKEN_FILE: /run/cairn/core_token
  CAIRN_DATABASE_URL: postgresql+psycopg://cairn:${CAIRN_POSTGRES_PASSWORD:-cairn}@cairn-postgres:5432/cairn
  CAIRN_SERVICE_TOKEN: ${CAIRN_SERVICE_TOKEN:?set CAIRN_SERVICE_TOKEN in .env}
  CAIRN_AUTHZ_MODE: ${CAIRN_AUTHZ_MODE:-additive}
  CAIRN_POLICY_DIR: /etc/cairn/config/policies
  CAIRN_KAFKA_BOOTSTRAP: broker:29092
  CAIRN_SCHEMA_REGISTRY_URL: http://cairn-core:8080/schema-registry/api/
  CAIRN_GATEWAY_PUBLIC_URL: http://cairn-gateway:8820
  CAIRN_GATEWAY_KEY_DIR: /var/lib/cairn/keys
  CAIRN_LLM_PROVIDER: ${CAIRN_LLM_PROVIDER:-none}
  CAIRN_AI_MODEL: ${CAIRN_AI_MODEL:-claude-opus-5-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CAIRN_AI_DAILY_BUDGET_USD: ${CAIRN_AI_DAILY_BUDGET_USD:-}      # empty = no cap; AI features fall back when reached
  CAIRN_AI_USER_DAILY_TOKENS: ${CAIRN_AI_USER_DAILY_TOKENS:-}
  CAIRN_AI_PRICES: ${CAIRN_AI_PRICES:-}                          # JSON {"model-prefix": [in, out]} USD per MTok
  CAIRN_OLLAMA_URL: ${CAIRN_OLLAMA_URL:-http://ollama:11434}
  CAIRN_EMBEDDING_PROVIDER: ${CAIRN_EMBEDDING_PROVIDER:-hashing}
  # Cairn Ontology (profile ontology): set CAIRN_ONTOLOGY_URL=http://cairn-ontology:8590 in .env to use it.
  CAIRN_ONTOLOGY_URL: ${CAIRN_ONTOLOGY_URL:-}
  CAIRN_ONTOLOGY_TOKEN: ${CAIRN_ONTOLOGY_TOKEN:-cairn-ontology-dev-token-0001}
  CAIRN_ONTOLOGY_SAMPLE_AS: ${CAIRN_ONTOLOGY_SAMPLE_AS:-}
  CAIRN_ROOT_USERS: urn:li:corpuser:admin
  # ---- Active Metadata layer (UX_ACTIVE_METADATA_SPEC.md Part 8)
  CAIRN_PUBLIC_URL: ${CAIRN_PUBLIC_URL:-http://localhost:9000}
  CAIRN_MASKING_PROXY_ENABLED: "true"   # cairn-web talks to Cairn Core through cairn-core-proxy
  CAIRN_ACTION_LINK_SECRET: ${CAIRN_ACTION_LINK_SECRET:?set CAIRN_ACTION_LINK_SECRET in .env}
  CAIRN_EMBED_SIGNING_SECRET: ${CAIRN_EMBED_SIGNING_SECRET:?set CAIRN_EMBED_SIGNING_SECRET in .env}
  CAIRN_EMBED_ALLOWED_ORIGINS: ${CAIRN_EMBED_ALLOWED_ORIGINS:-}
  CAIRN_SLACK_BOT_TOKEN: ${CAIRN_SLACK_BOT_TOKEN:-}
  CAIRN_SLACK_SIGNING_SECRET: ${CAIRN_SLACK_SIGNING_SECRET:-}
  CAIRN_SLACK_API_URL: ${CAIRN_SLACK_API_URL:-https://slack.com/api}       # e.g. https://slack-gov.com/api
  CAIRN_SLACK_RESPONSE_HOSTS: ${CAIRN_SLACK_RESPONSE_HOSTS:-}              # extra origins for Slack replies
  CAIRN_TEAMS_WEBHOOK_HOSTS: ${CAIRN_TEAMS_WEBHOOK_HOSTS:-.webhook.office.com,.logic.azure.com,.powerplatform.com,.powerautomate.com}
  CAIRN_WEBHOOK_ALLOW_PRIVATE: ${CAIRN_WEBHOOK_ALLOW_PRIVATE:-true}        # false: webhooks only to public addresses
  CAIRN_TEAMS_WEBHOOK_URL: ${CAIRN_TEAMS_WEBHOOK_URL:-}
  CAIRN_SLACK_CHANNEL_ACTOR: ${CAIRN_SLACK_CHANNEL_ACTOR:-}               # Slack @mentions answered as this user
  CAIRN_TEAMS_OUTGOING_SECRET: ${CAIRN_TEAMS_OUTGOING_SECRET:-}           # the assistant in Teams channels
  CAIRN_TEAMS_CHANNEL_ACTOR: ${CAIRN_TEAMS_CHANNEL_ACTOR:-}
  CAIRN_TEAMS_REPLY_WEBHOOK: ${CAIRN_TEAMS_REPLY_WEBHOOK:-}
  CAIRN_OAUTH_REGISTRATION: ${CAIRN_OAUTH_REGISTRATION:-open}            # MCP clients: open | admin | off
  CAIRN_SMTP_URL: ${CAIRN_SMTP_URL:-}

x-cairn-service: &cairn-service
  image: ${CAIRN_REGISTRY:-cairn}/platform:${CAIRN_VERSION:-0.1.0}
  build:
    context: .
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  entrypoint: ["/opt/cairn/bin/dumb-init", "--", "/opt/cairn-bootstrap/with-token.sh"]
  environment:
    <<: *cairn-env
  volumes:
    - ./config:/etc/cairn/config:ro
    - ./deploy/bootstrap:/opt/cairn-bootstrap:ro
    - ./deploy/actions:/etc/cairn/actions:ro
    - cairn-bootstrap:/run/cairn:ro
  depends_on: &cairn-depends
    cairn-postgres:
      condition: service_healthy
    cairn-bootstrap:
      condition: service_completed_successfully
  networks: [catalog]
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

x-cairn-http-healthcheck: &cairn-http-healthcheck
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

# Airflow 3 on the lakehouse (opt-in: `--profile airflow`, with `--profile trino`): http://localhost:8090,
# sign-in through Cairn. Tasks run as the Cairn user whose token is CAIRN_AIRFLOW_TOKEN (the cairn_default
# connection); runs and lineage go to Cairn (OpenLineage). DAGs from CAIRN_AIRFLOW_DAGS.
x-airflow: &airflow
  image: ${CAIRN_REGISTRY:-cairn}/airflow:${CAIRN_VERSION:-0.1.0}
  profiles: [airflow]
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://cairn:${CAIRN_POSTGRES_PASSWORD:-cairn}@cairn-postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${CAIRN_AIRFLOW_FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}
    AIRFLOW__API_AUTH__JWT_SECRET: ${CAIRN_AIRFLOW_JWT_SECRET:-cairn-airflow-dev-jwt-secret-0001}
    AIRFLOW__API__SECRET_KEY: ${CAIRN_AIRFLOW_SECRET_KEY:-cairn-airflow-dev-secret-key-0001}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API__BASE_URL: ${CAIRN_AIRFLOW_PUBLIC_URL:-http://localhost:8090}
    AIRFLOW__FAB__CONFIG_FILE: /opt/airflow/config/webserver_config.py
    AIRFLOW_CONN_CAIRN_DEFAULT: >-
      {"conn_type": "cairn", "host": "http://cairn-api:8800", "password": "${CAIRN_AIRFLOW_TOKEN:-}",
       "extra": {"trino_host": "cairn-trino", "trino_port": 8443, "trino_catalog": "lakehouse",
                 "ca_file": "/etc/trino/tls/ca.pem"}}
    AIRFLOW__OPENLINEAGE__TRANSPORT: >-
      {"type": "http", "url": "http://cairn-api:8800", "endpoint": "openlineage/api/v1/lineage",
       "auth": {"type": "api_key", "apiKey": "${CAIRN_AIRFLOW_TOKEN:-}"}}
    CAIRN_DBT_SCHEMA: analytics
    # Sign-in through Cairn (client "airflow"): the same secret as cairn-api's CAIRN_AIRFLOW_OAUTH_SECRET.
    CAIRN_URL: http://cairn-api:8800
    CAIRN_PUBLIC_URL: ${CAIRN_PUBLIC_URL:-http://localhost:9000}
    CAIRN_AIRFLOW_ALLOW_HTTP: "true"   # Compose on localhost only: production signs in over HTTPS
    CAIRN_AIRFLOW_OAUTH_SECRET: ${CAIRN_AIRFLOW_OAUTH_SECRET:-cairn-airflow-dev-oauth-secret-0001}
    CAIRN_AIRFLOW_ROLES: ${CAIRN_AIRFLOW_ROLES:-cairn-admins=Admin;data-engineers=User}
  volumes:
    - ${CAIRN_AIRFLOW_DAGS:-./examples/airflow/dags}:/opt/airflow/dags:ro
    - ./examples/dbt:/opt/airflow/dbt:ro
    - ./deploy/airflow/webserver_config.py:/opt/airflow/config/webserver_config.py:ro
    - ${CAIRN_TRINO_TLS_DIR:-trinotls}:/etc/trino/tls:ro
  networks: [catalog]

services:
  # ============================================================ Cairn Core storage
  mysql:
    image: mysql:8.2
    hostname: mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: cairn
      MYSQL_USER: cairn
      MYSQL_PASSWORD: ${CAIRN_DB_PASSWORD:?set CAIRN_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${CAIRN_DB_ROOT_PASSWORD:?set CAIRN_DB_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h mysql -u $$MYSQL_USER --password=$$MYSQL_PASSWORD"]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 90s   # first start initialises the data directory
    volumes:
      - mysqldata:/var/lib/mysql
    networks: [catalog]
    restart: on-failure

  search:
    image: opensearchproject/opensearch:2.19.3
    hostname: search
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx1024m -Dlog4j2.formatMsgNoLookups=true
      # Local dev: OpenSearch blocks index creation at the 95% disk flood stage, which laptops and
      # quota-limited sandboxes hit easily. Set to "true" for production-like behaviour.
      cluster.routing.allocation.disk.threshold_enabled: ${CAIRN_SEARCH_DISK_THRESHOLD_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail 'http://search:9200/_cluster/health?wait_for_status=yellow&timeout=0s'"]
      interval: 5s
      timeout: 15s
      retries: 20
      start_period: 1m
    volumes:
      - osdata:/usr/share/opensearch/data
    networks: [catalog]

  # Apache Kafka (Apache-2.0), KRaft mode: one combined broker/controller for local use.
  broker:
    image: apache/kafka:3.9.1
    hostname: broker
    environment:
      CLUSTER_ID: ${CAIRN_KAFKA_CLUSTER_ID:-cairnKafkaLocal0000001}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:39092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: BROKER://broker:29092,EXTERNAL://broker:9092,CONTROLLER://broker:39092
      KAFKA_ADVERTISED_LISTENERS: BROKER://broker:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_MESSAGE_MAX_BYTES: "5242880"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "5242880"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server broker:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 1m
    volumes:
      - broker:/var/lib/kafka/data
    networks: [catalog]

  # ============================================================ Cairn Core services
  # Images: core/Dockerfile (deploy/build-images.sh). Only CAIRN_* settings are read here; every
  # engine default is baked into the images.

  # Creates / migrates the schema, search indices, topics and seed data. Runs before every start.
  cairn-setup:
    image: ${CAIRN_REGISTRY:-cairn}/setup:${CAIRN_VERSION:-0.1.0}
    hostname: cairn-setup
    environment:
      <<: *core-env
      CAIRN_CORE_API_HOST: cairn-core
      CAIRN_CORE_API_PORT: "8080"
    depends_on:
      mysql:
        condition: service_healthy
      search:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks: [catalog]

  cairn-core:
    image: ${CAIRN_REGISTRY:-cairn}/core:${CAIRN_VERSION:-0.1.0}
    hostname: cairn-core
    restart: unless-stopped
    environment:
      <<: *core-env
      # Cairn authorizer (baked in). Authoritative mode REQUIRES CAIRN_NATIVE_POLICIES_ENABLED=false.
      CAIRN_PDP_URL: http://cairn-pdp:8810
      CAIRN_SERVICE_TOKEN: ${CAIRN_SERVICE_TOKEN:?set CAIRN_SERVICE_TOKEN in .env}
      CAIRN_AUTHZ_MODE: ${CAIRN_AUTHZ_MODE:-additive}
      CAIRN_NATIVE_POLICIES_ENABLED: ${CAIRN_NATIVE_POLICIES_ENABLED:-true}
      # View authorization makes ABAC visibility rules apply to entity pages too.
      CAIRN_VIEW_AUTHORIZATION_ENABLED: ${CAIRN_VIEW_AUTHORIZATION_ENABLED:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://cairn-core:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 1m30s
    # Internal API: published on loopback only, for operators and the e2e suite. Users go through the edge.
    ports:
      - "127.0.0.1:${CAIRN_MAPPED_CORE_PORT:-8080}:8080"
    depends_on:
      cairn-setup:
        condition: service_completed_successfully
    networks: [catalog]

  cairn-web:
    image: ${CAIRN_REGISTRY:-cairn}/web:${CAIRN_VERSION:-0.1.0}
    hostname: cairn-web
    restart: unless-stopped
    environment:
      # All UI traffic to Cairn Core goes through the Cairn masking middleware (cairn-core-proxy).
      CAIRN_CORE_API_HOST: cairn-core-proxy
      CAIRN_CORE_API_PORT: "8890"
      CAIRN_WEB_SECRET: ${CAIRN_WEB_SECRET:?set CAIRN_WEB_SECRET in .env}
      CAIRN_ADMIN_PASSWORD: ${CAIRN_ADMIN_PASSWORD:?set CAIRN_ADMIN_PASSWORD in .env}
      CAIRN_SYSTEM_CLIENT_SECRET: ${CAIRN_SYSTEM_CLIENT_SECRET}
      CAIRN_KAFKA_BOOTSTRAP: broker:29092
      # Single sign-on (docs: Administration → Single sign-on). Empty = off.
      CAIRN_SSO_ENABLED: ${CAIRN_SSO_ENABLED:-}
      CAIRN_SSO_CLIENT_ID: ${CAIRN_SSO_CLIENT_ID:-}
      CAIRN_SSO_CLIENT_SECRET: ${CAIRN_SSO_CLIENT_SECRET:-}
      CAIRN_SSO_DISCOVERY_URL: ${CAIRN_SSO_DISCOVERY_URL:-}
      CAIRN_SSO_BASE_URL: ${CAIRN_PUBLIC_URL:-http://localhost:9000}
      CAIRN_SSO_SCOPE: ${CAIRN_SSO_SCOPE:-}
      CAIRN_SSO_USER_CLAIM: ${CAIRN_SSO_USER_CLAIM:-preferred_username}
      CAIRN_SSO_GROUPS_CLAIM: ${CAIRN_SSO_GROUPS_CLAIM:-groups}
      CAIRN_SSO_REQUIRED_GROUPS: ${CAIRN_SSO_REQUIRED_GROUPS:-}
      CAIRN_SSO_EXTRACT_GROUPS: ${CAIRN_SSO_EXTRACT_GROUPS:-true}
      CAIRN_SSO_JIT_PROVISIONING: ${CAIRN_SSO_JIT_PROVISIONING:-}
    volumes:
      # The catalog's left navigation (workspace sections); baked into the image too, mounted so a
      # new section needs no web image rebuild. Read at start: restart cairn-web after changing it.
      - ./deploy/mfe/mfe.config.yaml:/etc/cairn/mfe.config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://127.0.0.1:9002/admin"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 1m
    ports:
      - "127.0.0.1:${CAIRN_MAPPED_WEB_PORT:-9002}:9002"
    depends_on:
      cairn-core:
        condition: service_healthy
      cairn-core-proxy:
        condition: service_healthy
    networks: [catalog]

  # Runs ingestion recipes scheduled from the UI.
  cairn-executor:
    image: ${CAIRN_REGISTRY:-cairn}/executor:${CAIRN_VERSION:-0.1.0}
    hostname: cairn-executor
    restart: unless-stopped
    environment:
      CAIRN_CORE_API_HOST: cairn-core
      CAIRN_CORE_API_PORT: "8080"
      CAIRN_SYSTEM_CLIENT_SECRET: ${CAIRN_SYSTEM_CLIENT_SECRET}
      CAIRN_KAFKA_BOOTSTRAP: broker:29092
    depends_on:
      cairn-core:
        condition: service_healthy
    networks: [catalog]

  # ============================================================ Cairn control plane
  cairn-postgres:
    image: pgvector/pgvector:pg16
    hostname: cairn-postgres
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: ${CAIRN_POSTGRES_PASSWORD:-cairn}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - cairn-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-cairn.sql:ro
    networks: [catalog]

  # Creates the least-privilege service account (urn:li:corpuser:cairn-service) and its policies,
  # and writes its token into the cairn-bootstrap volume (idempotent). See deploy/bootstrap/mint_core_token.py.
  cairn-bootstrap:
    image: python:3.12-slim
    command: ["python", "/opt/cairn-bootstrap/mint_core_token.py", "--out", "/run/cairn/core_token",
              "--provisioner-out", "/run/cairn-provisioner/provisioner_token"]
    environment:
      CAIRN_FRONTEND_URL: http://cairn-web:9002
      CAIRN_CORE_URL: http://cairn-core:8080
      CAIRN_ADMIN_PASSWORD: ${CAIRN_ADMIN_PASSWORD:?set CAIRN_ADMIN_PASSWORD in .env}
    volumes:
      - ./deploy/bootstrap:/opt/cairn-bootstrap:ro
      - cairn-bootstrap:/run/cairn
      # The provisioning (SCIM) token: only cairn-api mounts it.
      - cairn-provisioner:/run/cairn-provisioner
    depends_on:
      cairn-web:
        condition: service_healthy
    networks: [catalog]

  # Rotates the service token: the account mints its own successor every CAIRN_TOKEN_ROTATE_DAYS and
  # revokes the previous token after a grace period. Holds no admin credentials.
  cairn-token-keeper:
    image: python:3.12-slim
    command: ["python", "/opt/cairn-bootstrap/mint_core_token.py", "--out", "/run/cairn/core_token",
              "--provisioner-out", "/run/cairn-provisioner/provisioner_token", "--keep"]
    restart: unless-stopped
    environment:
      CAIRN_CORE_URL: http://cairn-core:8080
      CAIRN_TOKEN_ROTATE_DAYS: ${CAIRN_TOKEN_ROTATE_DAYS:-7}
      CAIRN_TOKEN_GRACE_MINUTES: ${CAIRN_TOKEN_GRACE_MINUTES:-15}
      CAIRN_TOKEN_CHECK_MINUTES: ${CAIRN_TOKEN_CHECK_MINUTES:-30}
    volumes:
      - ./deploy/bootstrap:/opt/cairn-bootstrap:ro
      - cairn-bootstrap:/run/cairn
      # The provisioning (SCIM) token: only cairn-api mounts it.
      - cairn-provisioner:/run/cairn-provisioner
    depends_on:
      cairn-bootstrap:
        condition: service_completed_successfully
    networks: [catalog]

  cairn-pdp:
    <<: *cairn-service
    hostname: cairn-pdp
    command: ["pdp", "--host", "0.0.0.0", "--port", "8810"]
    healthcheck:
      <<: *cairn-http-healthcheck
      test: ["CMD", "python", "/usr/local/bin/cairn-healthcheck", "http://127.0.0.1:8810/health"]
    # The PDP must start before Cairn Core can authorize non-root users, but needs a Cairn Core token to import
    # native policies; it tolerates Cairn Core being unavailable at boot and retries the import.
    depends_on:
      cairn-postgres:
        condition: service_healthy

  cairn-api:
    <<: *cairn-service
    hostname: cairn-api
    command: ["api", "--host", "0.0.0.0", "--port", "8800"]
    volumes:
      - ./config:/etc/cairn/config:ro
      - ./deploy/bootstrap:/opt/cairn-bootstrap:ro
      - ./deploy/actions:/etc/cairn/actions:ro
      - cairn-bootstrap:/run/cairn:ro
      - cairn-provisioner:/run/cairn-provisioner:ro
      # Trino's certificate (ca.pem), for SQL editor connections to it over HTTPS.
      - ${CAIRN_TRINO_TLS_DIR:-trinotls}:/etc/cairn/trino-tls:ro
    environment:
      <<: *cairn-env
      # SCIM provisioning (Administration → User provisioning). Empty = SCIM answers 503.
      CAIRN_SCIM_TOKEN: ${CAIRN_SCIM_TOKEN:-}
      # Cairn Store administration (Settings → Storage), with the store's admin key.
      CAIRN_STORE_URL: http://cairn-store:8333
      CAIRN_STORE_ADMIN_ACCESS_KEY: ${CAIRN_STORE_ACCESS_KEY:-cairn-store}
      CAIRN_STORE_ADMIN_SECRET_KEY: ${CAIRN_STORE_SECRET_KEY:-cairn-store-dev-secret}
      # Trino asks Cairn before every action (deploy/trino/access-control.properties) with this key.
      CAIRN_TRINO_ACCESS_KEY: ${CAIRN_TRINO_ACCESS_KEY:-cairn-trino-dev-access-key-0001}
      CAIRN_TRINO_TOKEN_ISSUER: ${CAIRN_TRINO_TOKEN_ISSUER:-cairn}
      # Trino's sign-in through Cairn (OAuth2): its client secret and where it may send people back to.
      CAIRN_TRINO_OAUTH_SECRET: ${CAIRN_TRINO_OAUTH_SECRET:-cairn-trino-dev-oauth-secret-0001}
      CAIRN_AIRFLOW_OAUTH_SECRET: ${CAIRN_AIRFLOW_OAUTH_SECRET:-cairn-airflow-dev-oauth-secret-0001}
      CAIRN_AIRFLOW_OAUTH_REDIRECT_URIS: ${CAIRN_AIRFLOW_PUBLIC_URL:-http://localhost:8090}/auth/oauth-authorized/cairn
      CAIRN_TRINO_OAUTH_REDIRECT_URIS: ${CAIRN_TRINO_OAUTH_REDIRECT_URIS:-https://localhost:8443/oauth2/callback}
      # Cairn Catalog's addresses as engines name it in OpenLineage: Spark lineage lands on lakehouse tables.
      CAIRN_LAKEHOUSE_CATALOG_URIS: http://cairn-catalog:8181,${CAIRN_CATALOG_PUBLIC_URL:-http://localhost:8181}
      # Spark's history server (profile spark), served behind Cairn's sign-in at /v1/spark/history/.
      CAIRN_SPARK_HISTORY_URL: http://cairn-spark-history:18080
      CAIRN_STREAMS_ENABLED: ${CAIRN_STREAMS_ENABLED:-false}   # true with the streams profile: /v1/streams
      CAIRN_LAKEHOUSE_TOKEN_TTL: ${CAIRN_LAKEHOUSE_TOKEN_TTL:-3600}
      CAIRN_LAKEHOUSE_MAX_SESSION: ${CAIRN_LAKEHOUSE_MAX_SESSION:-604800}
      CAIRN_SCIM_CORE_TOKEN_FILE: /run/cairn-provisioner/provisioner_token
      # For `cairn sso check` (the web app does the actual sign-in).
      CAIRN_SSO_CLIENT_ID: ${CAIRN_SSO_CLIENT_ID:-}
      CAIRN_SSO_CLIENT_SECRET: ${CAIRN_SSO_CLIENT_SECRET:-}
      CAIRN_SSO_DISCOVERY_URL: ${CAIRN_SSO_DISCOVERY_URL:-}
    ports:
      - "${CAIRN_MAPPED_API_PORT:-8800}:8800"
    healthcheck:
      <<: *cairn-http-healthcheck
      test: ["CMD", "python", "/usr/local/bin/cairn-healthcheck", "http://127.0.0.1:8800/health"]
    depends_on:
      <<: *cairn-depends
      cairn-pdp:
        condition: service_healthy

  cairn-gateway:
    <<: *cairn-service
    hostname: cairn-gateway
    command: ["gateway", "--host", "0.0.0.0", "--port", "8820"]
    volumes:
      - ./config:/etc/cairn/config:ro
      - ./deploy/bootstrap:/opt/cairn-bootstrap:ro
      - cairn-bootstrap:/run/cairn:ro
      - cairn-gateway-keys:/var/lib/cairn/keys
    healthcheck:
      <<: *cairn-http-healthcheck
      test: ["CMD", "python", "/usr/local/bin/cairn-healthcheck", "http://127.0.0.1:8820/health"]
    # The gateway is the only control-plane service reachable from the VPC side.
    networks: [catalog, vpc-egress]

  cairn-scheduler:
    <<: *cairn-service
    hostname: cairn-scheduler
    command: ["scheduler"]
    depends_on:
      <<: *cairn-depends
      cairn-core:
        condition: service_healthy

  cairn-actions-pii:
    <<: *cairn-service
    hostname: cairn-actions-pii
    command: ["actions", "-c", "/etc/cairn/actions/pii_propagation.yml"]
    environment:
      <<: *cairn-env
      CAIRN_RESTART_ON_TOKEN_CHANGE: "1"   # the pipeline config holds the token: restart on rotation
    depends_on:
      <<: *cairn-depends
      broker:
        condition: service_healthy

  # Rule-based tag + glossary-term propagation over column lineage (rules in deploy/actions/label_propagation.yml).
  cairn-actions-labels:
    <<: *cairn-service
    hostname: cairn-actions-labels
    command: ["actions", "-c", "/etc/cairn/actions/label_propagation.yml"]
    environment:
      <<: *cairn-env
      CAIRN_RESTART_ON_TOKEN_CHANGE: "1"   # the pipeline config holds the token: restart on rotation
    depends_on:
      <<: *cairn-depends
      broker:
        condition: service_healthy

  cairn-actions-indexer:
    <<: *cairn-service
    hostname: cairn-actions-indexer
    command: ["actions", "-c", "/etc/cairn/actions/vector_indexer.yml"]
    environment:
      <<: *cairn-env
      CAIRN_RESTART_ON_TOKEN_CHANGE: "1"   # the pipeline config holds the token: restart on rotation
    depends_on:
      <<: *cairn-depends
      broker:
        condition: service_healthy

  cairn-mcp:
    <<: *cairn-service
    hostname: cairn-mcp
    command: ["mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8830"]
    ports:
      - "${CAIRN_MAPPED_MCP_PORT:-8830}:8830"
    healthcheck:
      <<: *cairn-http-healthcheck
      test: ["CMD", "python", "/usr/local/bin/cairn-healthcheck", "http://127.0.0.1:8830/health"]

  # ---------------------------------------------------------- Active Metadata layer
  # Masking middleware between cairn-web and Cairn Core. Must NOT depend on cairn-bootstrap
  # (bootstrap → frontend → proxy would be a cycle); it starts with the PDP and reads the Cairn Core token
  # file lazily once cairn-bootstrap has minted it.
  cairn-core-proxy:
    <<: *cairn-service
    hostname: cairn-core-proxy
    command: ["core-proxy", "--host", "0.0.0.0", "--port", "8890", "--upstream", "http://cairn-core:8080"]
    environment:
      <<: *cairn-env
      # Cairn Core's session-token signing key, used read-only to verify session JWTs and read actorId.
      CAIRN_SESSION_SIGNING_KEY: ${CAIRN_SESSION_SIGNING_KEY:?set CAIRN_SESSION_SIGNING_KEY in .env}
    healthcheck:
      <<: *cairn-http-healthcheck
      test: ["CMD", "python", "/usr/local/bin/cairn-healthcheck", "http://127.0.0.1:8890/__cairn/health"]
    depends_on:
      cairn-postgres:
        condition: service_healthy
      cairn-pdp:
        condition: service_healthy
      cairn-core:
        condition: service_healthy

  # Context Agents: mine queries, dbt, BI semantics and run histories into findings + ontology.
  cairn-context-miner:
    <<: *cairn-service
    hostname: cairn-context-miner
    command: ["context-miner", "--interval", "300"]
    depends_on:
      <<: *cairn-depends
      cairn-core:
        condition: service_healthy

  # Notification hub fan-out: Slack (Block Kit), Teams (Adaptive Cards), email, in-app.
  cairn-notifier:
    <<: *cairn-service
    hostname: cairn-notifier
    command: ["notifier", "--interval", "10"]
    depends_on:
      <<: *cairn-depends

  # Streams: Kafka topics (CDC included) into lakehouse tables. Settings in CAIRN_STREAMS_KAFKA and
  # CAIRN_STREAMS_CATALOG (JSON); define streams with POST /v1/streams on cairn-api.
  cairn-streams:
    <<: *cairn-service
    hostname: cairn-streams
    command: ["streams"]
    profiles: [streams]
    environment:
      <<: *cairn-env
      CAIRN_STREAMS_KAFKA: '{"bootstrap_servers": "broker:29092"}'
      CAIRN_STREAMS_CATALOG: ${CAIRN_STREAMS_CATALOG:-}
    depends_on:
      <<: *cairn-depends

  # Static host for the consumer workspace MFE (remoteEntry.js) and the embed SDK (web components).
  cairn-consumer-ui:
    image: ${CAIRN_REGISTRY:-cairn}/consumer-ui:${CAIRN_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: docker/consumer-ui.Dockerfile
    hostname: cairn-consumer-ui
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/cairn-ui/remoteEntry.js"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [catalog]

  # Cairn Store: S3-compatible object store for the lakehouse (Iceberg tables, metadata exports).
  # S3 endpoint http://cairn-store:8333 inside the stack, http://localhost:8333 from the host.
  cairn-store:
    image: ${CAIRN_REGISTRY:-cairn}/store:${CAIRN_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: docker/store.Dockerfile
    hostname: cairn-store
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      CAIRN_STORE_ACCESS_KEY: ${CAIRN_STORE_ACCESS_KEY:-cairn-store}
      CAIRN_STORE_SECRET_KEY: ${CAIRN_STORE_SECRET_KEY:-cairn-store-dev-secret}
      CAIRN_STORE_BUCKETS: ${CAIRN_STORE_BUCKETS:-lakehouse}
      CAIRN_STORE_REGION: ${CAIRN_STORE_REGION:-us-east-1}
      CAIRN_STORE_BLOCK_PUBLIC_ACCESS: ${CAIRN_STORE_BLOCK_PUBLIC_ACCESS:-true}
      # Encryption at rest (SSE-S3 for every new object) when set: a base64 32-byte key.
      CAIRN_STORE_MASTER_KEY: ${CAIRN_STORE_MASTER_KEY:-}
      # Temporary credentials (STS): the catalog's per-table credentials need them.
      CAIRN_STORE_STS_SECRET: ${CAIRN_STORE_STS_SECRET:-cairn-store-dev-sts-secret-0001-change-me}
      CAIRN_STORE_STS_PROVIDERS: ${CAIRN_STORE_STS_PROVIDERS:-}
      # Optional: ask Cairn's PDP (http://cairn-pdp:8810, with CAIRN_SERVICE_TOKEN) about every allowed request.
      CAIRN_STORE_PDP_URL: ${CAIRN_STORE_PDP_URL:-}
      CAIRN_STORE_PDP_TOKEN: ${CAIRN_STORE_PDP_TOKEN:-}
    ports:
      - "${CAIRN_MAPPED_STORE_PORT:-8333}:8333"
    volumes:
      - storedata:/data
    networks: [catalog]

  # Cairn Catalog: Iceberg REST catalog on http://cairn-catalog:8181 (http://localhost:8181 from the
  # host); tables live in Cairn Store. Clients authenticate with CAIRN_CATALOG_TOKEN as a bearer token.
  cairn-catalog:
    image: ${CAIRN_REGISTRY:-cairn}/catalog:${CAIRN_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: docker/catalog.Dockerfile
    hostname: cairn-catalog
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      CAIRN_CATALOG_TOKEN: ${CAIRN_CATALOG_TOKEN:-cairn-catalog-dev-token}
      CAIRN_CATALOG_WAREHOUSE: ${CAIRN_CATALOG_WAREHOUSE:-s3://lakehouse/warehouse}
      CAIRN_CATALOG_S3_ENDPOINT: http://cairn-store:8333
      CAIRN_CATALOG_S3_ACCESS_KEY: ${CAIRN_STORE_ACCESS_KEY:-cairn-store}
      CAIRN_CATALOG_S3_SECRET_KEY: ${CAIRN_STORE_SECRET_KEY:-cairn-store-dev-secret}
      # The store endpoint engines are told to use (in-stack engines reach cairn-store directly).
      CAIRN_CATALOG_CLIENT_S3_ENDPOINT: ${CAIRN_CATALOG_CLIENT_S3_ENDPOINT:-http://cairn-store:8333}
      # Engines get temporary keys for one table at a time (the store's STS), never the store's key.
      CAIRN_CATALOG_VEND_ROLE: ${CAIRN_CATALOG_VEND_ROLE:-cairn-catalog-tables}
      # Clients come back for keys this often (each renewal decided again by Cairn).
      CAIRN_CATALOG_VEND_REVALIDATE_SECONDS: ${CAIRN_CATALOG_VEND_REVALIDATE_SECONDS:-900}
      # People and pipeline users (Spark, pyiceberg) sign in with a Cairn-issued token (audience lakehouse);
      # the catalog asks Cairn about every table they touch, with the Cairn service token.
      CAIRN_CATALOG_JWKS_URL: http://cairn-api:8800/v1/trino/jwks.json
      CAIRN_CATALOG_JWT_ISSUER: ${CAIRN_TRINO_TOKEN_ISSUER:-cairn}
      CAIRN_CATALOG_CAIRN_URL: http://cairn-api:8800
      CAIRN_CATALOG_CAIRN_TOKEN: ${CAIRN_SERVICE_TOKEN:?set CAIRN_SERVICE_TOKEN in .env}
    ports:
      - "${CAIRN_MAPPED_CATALOG_PORT:-8181}:8181"
    volumes:
      - catalogdata:/data
    depends_on:
      cairn-store:
        condition: service_healthy
    networks: [catalog]

  # Cairn Ontology (opt-in: `--profile ontology`): the ontology compiler. Cairn pushes its catalog and query
  # history to it and reads the compiled terms, relationships and metrics back as proposals. Its model calls go
  # through Cairn's AI gateway as its agent identity: create one (POST /v1/ontology/agent), put the key in
  # CAIRN_ONTOLOGY_MODEL_KEY_FILE, and serve the models through the gateway (CAIRN_AI_GATEWAY_*). State: a
  # SQLite file in the ontologydata volume here; production uses PostgreSQL (Helm: cairn.ontology.database).
  cairn-ontology:
    image: ${CAIRN_REGISTRY:-cairn}/ontology:${CAIRN_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: docker/ontology.Dockerfile
    hostname: cairn-ontology
    restart: unless-stopped
    profiles: [ontology]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      CAIRN_ONTOLOGY_TOKEN: ${CAIRN_ONTOLOGY_TOKEN:-cairn-ontology-dev-token-0001}
      CAIRN_ONTOLOGY_MODEL_URL: http://cairn-api:8800/v1/ai/gateway/openai/v1
      CAIRN_ONTOLOGY_MODEL: ${CAIRN_ONTOLOGY_MODEL:-}
      CAIRN_ONTOLOGY_EMBED_MODEL: ${CAIRN_ONTOLOGY_EMBED_MODEL:-}
      CAIRN_ONTOLOGY_MODEL_API_KEY_FILE: /run/cairn-ontology/model-key
    volumes:
      - ontologydata:/data
      - ${CAIRN_ONTOLOGY_MODEL_KEY_FILE:-/dev/null}:/run/cairn-ontology/model-key:ro
    networks: [catalog]

  # Trino on the lakehouse (opt-in: `--profile trino`): SQL on Cairn Catalog's Iceberg tables, data in
  # Cairn Store, as the `lakehouse` catalog. http://localhost:8088 (e.g. `trino --server localhost:8088`).
  # Once: a self-signed certificate for Trino's HTTPS port (kept in the trinotls volume).
  cairn-trino-tls:
    image: trinodb/trino:484
    profiles: [trino]
    user: "0"
    entrypoint: ["/bin/sh", "/make-tls.sh"]
    environment:
      CAIRN_TRINO_KEYSTORE_PASSWORD: ${CAIRN_TRINO_KEYSTORE_PASSWORD:-cairn-trino-dev-keystore}
    volumes:
      - ./deploy/trino/make-tls.sh:/make-tls.sh:ro
      - ${CAIRN_TRINO_TLS_DIR:-trinotls}:/etc/trino/tls
    networks: [catalog]

  cairn-trino:
    image: trinodb/trino:484
    hostname: cairn-trino
    restart: unless-stopped
    profiles: [trino]
    security_opt:
      - no-new-privileges:true
    environment:
      CAIRN_CATALOG_URI: http://cairn-catalog:8181
      CAIRN_CATALOG_TOKEN: ${CAIRN_CATALOG_TOKEN:-cairn-catalog-dev-token}
      CAIRN_STORE_ENDPOINT: http://cairn-store:8333
      CAIRN_API_URL: http://cairn-api:8800
      CAIRN_TRINO_ACCESS_KEY: ${CAIRN_TRINO_ACCESS_KEY:-cairn-trino-dev-access-key-0001}
      CAIRN_TRINO_URI: http://cairn-trino:8080
      CAIRN_TRINO_TOKEN_ISSUER: ${CAIRN_TRINO_TOKEN_ISSUER:-cairn}
      CAIRN_TRINO_KEYSTORE_PASSWORD: ${CAIRN_TRINO_KEYSTORE_PASSWORD:-cairn-trino-dev-keystore}
      CAIRN_TRINO_SHARED_SECRET: ${CAIRN_TRINO_SHARED_SECRET:-cairn-trino-dev-shared-secret-0001}
      CAIRN_TRINO_OAUTH_SECRET: ${CAIRN_TRINO_OAUTH_SECRET:-cairn-trino-dev-oauth-secret-0001}
      CAIRN_PUBLIC_URL: ${CAIRN_PUBLIC_URL:-http://localhost:9000}
    volumes:
      - ${CAIRN_TRINO_TLS_DIR:-trinotls}:/etc/trino/tls:ro
      - ./deploy/trino/config.properties:/etc/trino/config.properties:ro
      - ./deploy/trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./deploy/trino/event-listener.properties:/etc/trino/event-listener.properties:ro
      - ./deploy/trino/usage-listener.properties:/etc/trino/usage-listener.properties:ro
      - ./deploy/trino/resource-groups.properties:/etc/trino/resource-groups.properties:ro
      - ./deploy/trino/resource-groups.json:/etc/trino/resource-groups.json:ro
      - ./deploy/trino/catalog:/etc/trino/catalog:ro
    ports:
      # HTTPS with a Cairn token: get one with POST /v1/trino/token (or the SQL editor does it for you).
      - "${CAIRN_MAPPED_TRINO_PORT:-8443}:8443"
    depends_on:
      cairn-trino-tls:
        condition: service_completed_successfully
      cairn-catalog:
        condition: service_started
      cairn-api:
        condition: service_healthy  # Trino reads Cairn's signing key (JWKS) when it starts
    networks: [catalog]

  # dbt on the lakehouse (opt-in: `--profile dbt`): `docker compose -f docker-compose.cairn.yml --profile trino
  # --profile dbt run --rm cairn-dbt build` runs the project in CAIRN_DBT_PROJECT (default: the example) as
  # the Cairn user whose token is CAIRN_DBT_TOKEN, and records the run in Cairn.
  cairn-dbt:
    image: ${CAIRN_REGISTRY:-cairn}/dbt:${CAIRN_VERSION:-0.1.0}
    profiles: [dbt]
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      CAIRN_URL: http://cairn-api:8800
      CAIRN_TOKEN: ${CAIRN_DBT_TOKEN:-}
      CAIRN_CA_FILE: /etc/trino/tls/ca.pem
      CAIRN_TRINO_HOST: cairn-trino
      CAIRN_TRINO_PORT: "8443"
      CAIRN_TRINO_CATALOG: lakehouse
      CAIRN_DBT_SCHEMA: ${CAIRN_DBT_SCHEMA:-analytics}
      CAIRN_DBT_ENVIRONMENT: ${CAIRN_DBT_ENVIRONMENT:-prod}
      CAIRN_DBT_DEFER_TO: ${CAIRN_DBT_DEFER_TO:-}
      CAIRN_DBT_PACKAGE_HUB_URL: ${CAIRN_DBT_PACKAGE_HUB_URL:-}
    volumes:
      - ${CAIRN_DBT_PROJECT:-./examples/dbt/lakehouse}:/project:ro
      - ${CAIRN_TRINO_TLS_DIR:-trinotls}:/etc/trino/tls:ro
    tmpfs:
      - /tmp/cairn:uid=10001,gid=10001
    depends_on:
      cairn-trino:
        condition: service_started
    networks: [catalog]

  # Spark on the lakehouse (opt-in: `--profile spark`): `docker compose -f docker-compose.cairn.yml --profile spark
  # run --rm cairn-spark /jobs/lakehouse_products.py` runs a PySpark job from CAIRN_SPARK_JOBS (default: the
  # example) as the Cairn user whose token is CAIRN_SPARK_TOKEN. Every table it touches is decided by Cairn;
  # tables a mask or row filter applies to are refused (query them through Trino).
  cairn-spark:
    image: ${CAIRN_REGISTRY:-cairn}/spark:${CAIRN_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    profiles: [spark]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    entrypoint: ["/opt/spark/bin/spark-submit", "--master", "${CAIRN_SPARK_MASTER:-local[*]}", "--conf", "spark.ui.enabled=false"]
    environment:
      CAIRN_URL: http://cairn-api:8800
      CAIRN_TOKEN: ${CAIRN_SPARK_TOKEN:-}
      CAIRN_CATALOG_URI: http://cairn-catalog:8181
      CAIRN_SPARK_EVENT_LOG_DIR: file:///opt/spark-events
    volumes:
      - ${CAIRN_SPARK_JOBS:-./examples/spark}:/jobs:ro
      - spark-events:/opt/spark-events
    depends_on:
      cairn-catalog:
        condition: service_started
      cairn-api:
        condition: service_healthy
    networks: [catalog]

  # Spark's history server over the jobs' event logs (secrets in them are redacted). It has no sign-in of
  # its own: people use it through Cairn (/cairn/api/v1/spark/history/, each their own runs); its port is
  # on this host's loopback only, for operators.
  cairn-spark-history:
    image: ${CAIRN_REGISTRY:-cairn}/spark:${CAIRN_VERSION:-0.1.0}
    profiles: [spark]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    environment:
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:///opt/spark-events -Dspark.history.fs.cleaner.enabled=true
        -Dspark.history.fs.cleaner.maxAge=${CAIRN_SPARK_HISTORY_MAX_AGE:-30d}
        -Dspark.ui.proxyBase=${CAIRN_SPARK_HISTORY_PROXY_BASE:-/cairn/api/v1/spark/history}
    volumes:
      - spark-events:/opt/spark-events:ro
    ports:
      - "127.0.0.1:18080:18080"
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        python - <<'PY'
        import os, psycopg2
        c = psycopg2.connect(host="cairn-postgres", user="cairn", password=os.environ["PGPASSWORD"], dbname="postgres")
        c.autocommit = True
        cur = c.cursor()
        cur.execute("SELECT 1 FROM pg_database WHERE datname = 'airflow'")
        if not cur.fetchone():
            cur.execute("CREATE DATABASE airflow")
        PY
        airflow db migrate
    environment:
      <<: *airflow-env
      PGPASSWORD: ${CAIRN_POSTGRES_PASSWORD:-cairn}
    depends_on:
      cairn-postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow
    command: ["api-server"]
    ports:
      - "${CAIRN_MAPPED_AIRFLOW_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow
    command: ["triggerer"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Single origin for the UI + Cairn API (+ remote MCP) on http://localhost:9000
  edge:
    image: nginx:1.27-alpine
    hostname: edge
    ports:
      - "${CAIRN_MAPPED_EDGE_PORT:-9000}:8080"
      - "${CAIRN_MAPPED_EDGE_TLS_PORT:-9443}:8443"
    environment:
      # HTTPS: put tls.crt and tls.key (PEM) in CAIRN_TLS_DIR. Set CAIRN_TLS_REDIRECT=true to send
      # HTTP to HTTPS; CAIRN_TLS_PUBLIC_PORT is the HTTPS port users reach (default 443).
      CAIRN_TLS_REDIRECT: ${CAIRN_TLS_REDIRECT:-false}
      CAIRN_TLS_PUBLIC_PORT: ${CAIRN_TLS_PUBLIC_PORT:-443}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/locations.conf:/etc/nginx/cairn/locations.conf:ro
      - ./docker/nginx/40-cairn-edge.sh:/docker-entrypoint.d/40-cairn-edge.sh:ro
      - ${CAIRN_TLS_DIR:-./deploy/tls}:/etc/cairn/tls:ro
    tmpfs:
      - /tmp
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      cairn-web:
        condition: service_healthy
      cairn-api:
        condition: service_healthy
      cairn-consumer-ui:
        condition: service_healthy
    networks: [catalog]

  # ============================================================ simulated private VPC "finance"
  finance-db:
    image: postgres:16-alpine
    hostname: finance-db
    environment:
      POSTGRES_USER: finance_admin
      POSTGRES_PASSWORD: ${FINANCE_DB_ADMIN_PASSWORD:-finance-admin-demo}
      POSTGRES_DB: finance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_admin -d finance"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - ./docker/demo-source/init.sql:/docker-entrypoint-initdb.d/00-finance.sql:ro
    networks: [vpc-finance]

  cairn-remote-agent:
    image: ${CAIRN_REGISTRY:-cairn}/remote-agent:${CAIRN_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
      args:
        INGEST_EXTRAS: postgres
    hostname: cairn-remote-agent
    restart: unless-stopped
    environment:
      CAIRN_AGENT_GATEWAY_URL: http://cairn-gateway:8820
      CAIRN_AGENT_POOL: ${CAIRN_AGENT_POOL:-finance}
      # One-time token from: POST /agents/pools/finance/enrollment-tokens (see README quickstart).
      CAIRN_AGENT_ENROLLMENT_TOKEN: ${CAIRN_AGENT_ENROLLMENT_TOKEN:-}
      CAIRN_AGENT_STATE_DIR: /var/lib/cairn-agent
      # Resolved locally for ${FINANCE_PG_PASSWORD} references in recipes; never sent upstream.
      FINANCE_PG_PASSWORD: reader-demo-only
    volumes:
      - ./docker/agent/agent.yml:/etc/cairn-agent/agent.yml:ro
      - cairn-agent-state:/var/lib/cairn-agent
    tmpfs:
      - /tmp/cairn:mode=1777  # default tmpfs is root:root 0755, unwritable for uid 10001
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      finance-db:
        condition: service_healthy
      cairn-gateway:
        condition: service_healthy
    # vpc-finance: reach the private source; vpc-egress: reach ONLY the gateway. No route to Cairn Core.
    networks: [vpc-finance, vpc-egress]

  # ============================================================ optional in-VPC LLM
  ollama:
    image: ollama/ollama:0.6.8
    hostname: ollama
    profiles: [ai-local]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [catalog]

networks:
  catalog:
    name: cairn_catalog
  vpc-egress:
    name: cairn_vpc_egress
    internal: true
  vpc-finance:
    name: cairn_vpc_finance
    internal: true

volumes:
  storedata:
  ontologydata:
  spark-events:
  catalogdata:
  trinotls:
  mysqldata:
  osdata:
  broker:
  cairn-pgdata:
  cairn-bootstrap:
  cairn-provisioner:
  cairn-gateway-keys:
  cairn-agent-state:
  ollama:
