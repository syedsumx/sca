[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-lakehouse"
version = "0.1.0"
description = "pyiceberg and DuckDB on the Cairn lakehouse, as a Cairn identity, governed table by table by Cairn."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27", "pyiceberg[pyarrow]>=0.9"]

[project.optional-dependencies]
duckdb = ["duckdb>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]
