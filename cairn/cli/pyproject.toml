# cairn-cli: the command line for people, without Cairn's server.
#
#   pipx install ./cli                     # from a checkout of this repository (cairn/)
#   pipx install "cairn-cli[parquet]"      # once published; [parquet] adds pyarrow for --format parquet
#
# It packages the client (src/cairn_cli) and the few pure-Python modules its commands reuse (flows definitions, the
# everything-as-code registry and engine, policy validation), straight from ../src: one source for both
# distributions. The full `cairn-platform` package contains the same commands, so install one or the other in an
# environment, not both. Build the wheel straight from this folder (`pip wheel --no-deps ./cli`, or
# `python -m build --wheel cli`): it reads ../src, so a source distribution of this folder alone would be empty.
# Release binaries are built from the same sources with PyInstaller (cairn.spec).
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cairn-cli"
version = "0.1.0"
description = "The Cairn command line: sign in, then query, search, show and ask as yourself."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "keyring>=24",
  "pydantic>=2.6",
  "croniter>=2.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]

[project.scripts]
cairn = "cairn_cli.main:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../src/cairn_cli" = "cairn_cli"
"../src/cairn/__init__.py" = "cairn/__init__.py"
"../src/cairn/py.typed" = "cairn/py.typed"
"../src/cairn/flows/__init__.py" = "cairn/flows/__init__.py"
"../src/cairn/flows/cli.py" = "cairn/flows/cli.py"
"../src/cairn/flows/model.py" = "cairn/flows/model.py"
"../src/cairn/flows/expr.py" = "cairn/flows/expr.py"
"../src/cairn/flows/airflow_dag.py" = "cairn/flows/airflow_dag.py"
"../src/cairn/iac/__init__.py" = "cairn/iac/__init__.py"
"../src/cairn/iac/registry.py" = "cairn/iac/registry.py"
"../src/cairn/iac/kinds.py" = "cairn/iac/kinds.py"
"../src/cairn/iac/engine.py" = "cairn/iac/engine.py"
"../src/cairn/iac/bundle.py" = "cairn/iac/bundle.py"
"../src/cairn/iac/export.py" = "cairn/iac/export.py"
"../src/cairn/governance/__init__.py" = "cairn/governance/__init__.py"
"../src/cairn/governance/abac.py" = "cairn/governance/abac.py"
