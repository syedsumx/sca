# High-availability profile: helm install cairn ./helm/cairn -f values.yaml -f values-ha.yaml
# Stateless services run 3 replicas spread over nodes and zones; the scheduler, notifier and context
# miner run 2 (a Postgres advisory lock keeps one active, the other takes over within a tick). Every
# component keeps one pod up during node drains. Use managed, replicated Postgres, MySQL and
# OpenSearch (global.*): the chart's databases are single-instance.
#
# The gateway runs more than one replica only with a shared key Secret (gateway.keys.existingSecret);
# without one it stays at one replica on a PVC and gets no PodDisruptionBudget.
cairn:
  ha:
    spreadReplicas: true
  api: {replicas: 3, autoscaling: {minReplicas: 3}, pdb: {enabled: true, minAvailable: 2}}
  pdp: {replicas: 3, pdb: {enabled: true, minAvailable: 2}}
  coreProxy: {replicas: 3, autoscaling: {minReplicas: 3}, pdb: {enabled: true, minAvailable: 2}}
  gateway: {replicas: 2, pdb: {enabled: true, minAvailable: 1}}
  consumerUi: {replicas: 2, pdb: {enabled: true, minAvailable: 1}}
  mcp: {replicas: 2, pdb: {enabled: true, minAvailable: 1}}
  scheduler: {replicas: 2, pdb: {enabled: true, minAvailable: 1}}
  notifier: {replicas: 2, pdb: {enabled: true, minAvailable: 1}}
  contextMiner: {replicas: 2, pdb: {enabled: true, minAvailable: 1}}
