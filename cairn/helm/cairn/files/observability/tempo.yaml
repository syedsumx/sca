# Tempo, single binary, traces on local disk (/var/tempo): Cairn's bundled trace store. Cairn reads a trace with
# GET /api/traces/<id> and searches with GET /api/search (CAIRN_OBS_TEMPO_URL=http://<tempo>:3200).
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: "0.0.0.0:4317"}
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 168h          # a week of traces
storage:
  trace:
    backend: local
    wal: {path: /var/tempo/wal}
    local: {path: /var/tempo/blocks}
usage_report:
  reporting_enabled: false
