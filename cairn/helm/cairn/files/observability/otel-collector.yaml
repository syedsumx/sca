# The OpenTelemetry Collector of Cairn's bundled observability stack (docker-compose.observability.yml, and the
# Helm chart with cairn.observability.enabled; the chart's copy is helm/cairn/files/observability/, kept identical).
#
# In:  OTLP over HTTP (4318) and gRPC (4317) from Cairn's processes, Trino, Cairn Core's Java agent, Airflow.
# Out: traces to Tempo, logs to Loki (its OTLP endpoint), metrics (the processes' own, and span metrics and the
#      service graph derived from the traces) for Prometheus to scrape on 8889.
# Where they are: CAIRN_OTEL_TEMPO (host:port of Tempo's OTLP gRPC) and CAIRN_OTEL_LOKI (Loki's base URL).
#
# Cairn's processes clean what they send (cairn.observability.redact). This removes credentials once more, for
# whatever else sends here (Airflow, Trino, the Java agent): header attributes other than a few, attributes whose
# names say they hold a secret, values that look like bearer tokens, JWTs, keys or URLs with a password, in spans,
# span events (an exception's message), logs and metrics.
#
# OTLP destinations configured in Cairn (kind observability_exporters) are a second file loaded next to this one
# (--config twice): each of their pipelines runs these same redaction processors before its exporter, and Cairn
# refuses any pipeline that does not (cairn.observability.exporters.check_redaction; this file passes it too).
receivers:
  otlp:
    protocols:
      http: {endpoint: "0.0.0.0:4318"}
      grpc: {endpoint: "0.0.0.0:4317"}

processors:
  memory_limiter: {check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20}
  batch: {timeout: 2s}
  attributes/credentials:
    actions:
      - {action: delete, pattern: '(?i)^http\.(request|response)\.header\.(authorization|cookie|set[-_]cookie|proxy[-_]authorization|x[-_]api[-_]key|x[-_]trino[-_]extra[-_]credential).*'}
      - {action: delete, pattern: '(?i).*(password|passwd|secret|api[-_.]?key|private[-_.]?key|credential).*'}
  redaction/values:
    allow_all_keys: true
    blocked_values:
      - '(?i)bearer\s+[A-Za-z0-9._~+/=-]{8,}'
      - 'eyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]*'
      - '(AKIA|ASIA)[A-Z0-9]{16}'
      - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
      - '[A-Za-z][A-Za-z0-9+.-]*://[^/\s:@]+:[^/\s@]+@'
    summary: silent
  # URLs other components record (Trino's calls to Cairn's access control carry Trino's key in the path; any URL
  # may carry one in its query): the key becomes {key}, query strings go.
  transform/urls:
    error_mode: ignore
    trace_statements:
      - 'replace_pattern(span.attributes["url.full"], "/v1/trino/[^/?]+/", "/v1/trino/{key}/")'
      - 'replace_pattern(span.attributes["http.url"], "/v1/trino/[^/?]+/", "/v1/trino/{key}/")'
      - 'replace_pattern(span.attributes["url.path"], "/v1/trino/[^/?]+/", "/v1/trino/{key}/")'
      - 'replace_pattern(span.attributes["http.target"], "/v1/trino/[^/?]+/", "/v1/trino/{key}/")'
      - 'replace_pattern(span.name, "/v1/trino/[^/?]+/", "/v1/trino/{key}/")'
      - 'replace_pattern(span.attributes["url.full"], "\\?.*$", "")'
      - 'replace_pattern(span.attributes["http.url"], "\\?.*$", "")'
      - 'replace_pattern(span.attributes["http.target"], "\\?.*$", "")'
      - 'delete_key(span.attributes, "url.query")'
      # An exception recorded on a span (Airflow's task spans) keeps its type, never a password in its message or
      # stack: URLs lose their user:password@, key=value secrets their value.
      - 'replace_pattern(spanevent.attributes["exception.message"], "://[^/\\s:@]+:[^/\\s@]+@", "://[redacted]@")'
      - 'replace_pattern(spanevent.attributes["exception.stacktrace"], "://[^/\\s:@]+:[^/\\s@]+@", "://[redacted]@")'
      - 'replace_pattern(spanevent.attributes["exception.message"], "(?i)((password|passwd|secret|token|api[_-]?key)[a-z_]*\\s*[=:]\\s*)[^\\s,;&]+", "$$1[redacted]")'
      - 'replace_pattern(spanevent.attributes["exception.stacktrace"], "(?i)((password|passwd|secret|token|api[_-]?key)[a-z_]*\\s*[=:]\\s*)[^\\s,;&]+", "$$1[redacted]")'
      - 'replace_pattern(span.status.message, "://[^/\\s:@]+:[^/\\s@]+@", "://[redacted]@")'
    log_statements:
      - 'replace_pattern(log.body, "://[^/\\s:@]+:[^/\\s@]+@", "://[redacted]@") where IsString(log.body)'
      - 'replace_pattern(log.body, "(?i)((password|passwd|secret|token|api[_-]?key)[a-z_]*\\s*[=:]\\s*)[^\\s,;&]+", "$$1[redacted]") where IsString(log.body)'

connectors:
  span_metrics:
    histogram:
      explicit: {buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s, 30s]}
    metrics_flush_interval: 15s
  service_graph:
    latency_histogram_buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 5s]
    store: {ttl: 10s, max_items: 5000}

exporters:
  otlp_grpc/tempo:
    endpoint: "${env:CAIRN_OTEL_TEMPO:-cairn-tempo:4317}"
    tls: {insecure: true}
  otlp_http/loki:
    endpoint: "${env:CAIRN_OTEL_LOKI:-http://cairn-loki:3100}/otlp"
  prometheus:
    endpoint: "0.0.0.0:8889"

extensions:
  health_check: {endpoint: "0.0.0.0:13133"}

service:
  extensions: [health_check]
  telemetry:
    logs: {level: warn}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/credentials, transform/urls, redaction/values, batch]
      exporters: [otlp_grpc/tempo, span_metrics, service_graph]
    metrics:
      receivers: [otlp, span_metrics, service_graph]
      processors: [memory_limiter, attributes/credentials, redaction/values, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/credentials, transform/urls, redaction/values, batch]
      exporters: [otlp_http/loki]
