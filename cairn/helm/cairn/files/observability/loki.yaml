# Loki, single binary, logs on local disk (/loki): Cairn's bundled log store. The Collector writes to its OTLP
# endpoint (/otlp): service.name becomes the service_name label, and trace_id, span_id and severity_text are
# structured metadata, so Cairn finds a trace's lines with {service_name=~".+"} | trace_id="<id>"
# (CAIRN_OBS_LOKI_URL=http://<loki>:3100).
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}
limits_config:
  allow_structured_metadata: true
  retention_period: 168h           # a week of logs
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
pattern_ingester:
  enabled: false
analytics:
  reporting_enabled: false
