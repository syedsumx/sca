# Default values for cairn.
#
# Two layers:
#   core:   Cairn Core — metadata service, web application, setup job and ingestion executor.
#   cairn:  the Cairn control plane.
#
# Prerequisites (external, managed or self-hosted): MySQL 8, OpenSearch 2.x, Kafka 3.x+, PostgreSQL 16
# with pgvector (control plane). Secrets:
#
#   kubectl create secret generic cairn-core-secrets \
#     --from-literal=admin-password=$(openssl rand -base64 24) \
#     --from-literal=system-client-secret=$(openssl rand -hex 32) \
#     --from-literal=session-signing-key=$(openssl rand -hex 32) \
#     --from-literal=token-salt=$(openssl rand -hex 32) \
#     --from-literal=web-secret=$(openssl rand -hex 32) \
#     --from-literal=db-password='<MySQL password of core.database.user>'
#   kubectl create secret generic cairn-secrets ...   (see cairn.secrets below)

global:
  cairn:
    # Registry/namespace of the Cairn images: <registry>/core, /web, /setup, /executor, /platform.
    registry: cairn
    image:
      # Control-plane image; empty = <registry>/platform.
      repository: ""
      tag: ""            # defaults to .Chart.AppVersion (applies to every Cairn image)
      pullPolicy: IfNotPresent
    imagePullSecrets: []

# ============================================================================================
# Cairn Core
# ============================================================================================
core:
  # Set to false to attach the control plane to an existing Cairn Core; then set cairn.core.url,
  # cairn.core.frontendUrl and cairn.kafka.* explicitly.
  enabled: true

  # Existing Secret with the Cairn Core credentials (see the kubectl example at the top).
  secrets:
    name: cairn-core-secrets
    adminPasswordKey: admin-password
    systemClientSecretKey: system-client-secret
    sessionSigningKeyKey: session-signing-key
    tokenSaltKey: token-salt
    webSecretKey: web-secret
    dbPasswordKey: db-password

  database:          # MySQL 8, or PostgreSQL 14+ (type: postgres)
    # postgres puts the catalog in PostgreSQL, e.g. the same server as the Cairn database (port 5432,
    # name cairn_catalog); the setup job creates the database. Choose it at install time.
    type: mysql
    host: mysql
    port: 3306
    name: cairn
    # postgres only: the JDBC sslmode (disable, prefer, require, verify-full).
    sslMode: prefer
    # The setup job creates the schema: the user needs DDL rights on the database.
    user: root
  search:            # OpenSearch 2.x
    host: opensearch
    port: 9200
    # Prefix for every index name, so several deployments (tenants) can share one cluster.
    indexPrefix: ""
    useSsl: false
    username: ""
    # Key in core.secrets.name holding the search password; empty = no authentication.
    passwordKey: ""
  kafka:
    bootstrap: kafka:9092

  # Authorization: additive keeps the native policies in the chain; authoritative makes the Cairn
  # authorizer the only one (set cairn.auth.mode=authoritative too).
  nativePoliciesEnabled: true
  # ABAC visibility rules also apply to entity pages.
  viewAuthorizationEnabled: true

  # Optional per-tenant branding (served by the web application).
  branding:
    appTitle: ""
    logoUrl: ""
    faviconUrl: ""

  api:
    replicas: 1
    javaOpts: "-Xms1g -Xmx1g"
    resources:
      requests: { cpu: 500m, memory: 1536Mi }
      limits: { memory: 2560Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  web:
    replicas: 1
    javaOpts: "-Xms512m -Xmx512m"
    # Workspace micro-frontend config. The image ships the default (/cairn workspace); set this to
    # replace it (mounted at /etc/cairn/mfe.config.yaml). Restart the web pods after changing it.
    mfeConfigOverride: ""
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { memory: 1280Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  executor:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Runs as a pre-install / pre-upgrade hook: schema, search indices, topics, seed data.
  setup:
    backoffLimit: 3
    activeDeadlineSeconds: 1800
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }

  # Single host for the UI, the Cairn API, the workspace MFE and remote MCP. The engine's developer
  # consoles (/openapi/swagger-ui, /openapi/v3/api-docs, /api/graphiql) are answered with 404 through an
  # ingress-nginx server-snippet (requires allow-snippet-annotations on the controller); with another
  # controller, block those paths there.
  ingress:
    enabled: false
    className: nginx
    host: cairn.example.com
    annotations: {}
    tls: []
    blockDeveloperConsoles: true

  # Gateway API routes instead of the Ingress (enable one): HTTPRoutes serving the same paths, attached to
  # parentRefs (a shared Gateway), or to a Gateway the chart creates (create.enabled, with its GatewayClass).
  gateway:
    enabled: false
    parentRefs: []        # e.g. [{name: platform, namespace: gateway-system, sectionName: https}]
    hostnames: []         # default: [core.ingress.host]
    timeout: 300s         # the UI and the engine
    apiTimeout: 3600s     # the Cairn API and MCP (long SQL runs, streams)
    create:
      enabled: false
      className: ""
      tlsSecret: ""       # an HTTPS listener on 443 with this certificate
      annotations: {}     # e.g. cert-manager.io/cluster-issuer

# ============================================================================================
# Cairn control plane
# ============================================================================================
cairn:
  # Cairn Core endpoints as seen from inside the cluster. Empty = this release's core / web Services.
  core:
    url: ""
    frontendUrl: ""

  # Kubernetes Secret holding control-plane credentials. Create it yourself (or with ExternalSecrets / Vault):
  #   kubectl create secret generic cairn-secrets \
  #     --from-literal=service-token=$(openssl rand -hex 32) \
  #     --from-literal=database-url='postgresql+psycopg://cairn:***@cairn-postgres:5432/cairn' \
  #     --from-literal=action-link-secret=$(openssl rand -hex 32) \
  #     --from-literal=embed-signing-secret=$(openssl rand -hex 32) \
  #     --from-literal=anthropic-api-key=<optional>
  secrets:
    name: cairn-secrets
    serviceTokenKey: service-token
    databaseUrlKey: database-url
    anthropicApiKeyKey: anthropic-api-key
    # Active Metadata layer: HMAC secrets for one-click action links (Teams/email) and embed tokens.
    actionLinkSecretKey: action-link-secret
    embedSigningSecretKey: embed-signing-secret

  # Control-plane service account (urn:li:corpuser:cairn-service). A post-install/post-upgrade Job
  # creates it with a least-privilege policy and writes its token into Secret "<release>-core-token"
  # (needs core.enabled, for the admin password); the token keeper rotates it. Pods mount the Secret.
  coreToken:
    rotateDays: 7
    graceMinutes: 15
    checkMinutes: 30
    bootstrap:
      backoffLimit: 6
      activeDeadlineSeconds: 1800
      retries: 120          # x5 s: how long the Job waits for the web app and Cairn Core
    keeper:
      resources:
        requests: { cpu: 10m, memory: 48Mi }
        limits: { memory: 128Mi }

  auth:
    # additive | authoritative  (authoritative requires core.nativePoliciesEnabled=false)
    mode: additive
    importNativePolicies: true
    decisionCacheTtlSeconds: 30
    rootUsers:
      - urn:li:corpuser:admin

  # SCIM 2.0 provisioning at <public URL>/cairn/api/scim/v2. Set tokenSecret to an existing Secret
  # holding the identity provider's bearer token, e.g. {name: cairn-scim, key: token}. Unset = SCIM off.
  scim:
    tokenSecret: null

  kafka:
    # Empty = core.kafka.bootstrap / this release's core schema registry.
    bootstrap: ""
    schemaRegistryUrl: ""

  ai:
    # anthropic | ollama | none
    llmProvider: none
    model: claude-opus-5-5
    effort: high
    ollamaUrl: http://ollama:11434
    # hashing | ollama
    embeddingProvider: hashing
    auditPrompts: false
    # Spend controls: when reached, AI features fall back to their non-AI answers until the next UTC day.
    dailyBudgetUsd: ""          # deployment-wide estimated spend per day, e.g. "50"
    userDailyTokens: ""         # per-user tokens per day, e.g. "200000"
    # Price overrides in USD per million tokens, e.g. {"claude-opus-5-5": [4, 20]} (negotiated rates, gateways).
    prices: {}

  # ABAC policy bundle (YAML documents) mounted at CAIRN_POLICY_DIR. Empty → the policies baked into the
  # image (/etc/cairn/config/policies) are used. Alternatively reference an existing ConfigMap.
  policies:
    existingConfigMap: ""
    files: {}
    #  10-pii.yaml: |
    #    policies: [...]

  # Auto-monitors: rules that keep data-quality monitors on every dataset they select
  # (docs: Data quality). Mounted at /etc/cairn/config/quality; the scheduler sweeps every 10 min.
  quality:
    autoMonitors:
      existingConfigMap: ""
      files:
        auto-monitors.yaml: |
          rules:
            - id: certified
              description: Freshness and volume on every certified dataset
              select: {attr: resource.certification, op: eq, value: CERTIFIED}
              monitors:
                - {type: freshness, severity: HIGH}
                - {type: volume, severity: HIGH}

  extraEnv: []

  # Sample datasets: "retail" loads the sample set into the lakehouse (namespace samples) once, when the tenant
  # first starts (the scheduler's leader does it); removed later, it stays removed. Needs CAIRN_PIPES_CATALOG.
  samples:
    onStart: ""

  # Data residency: the region this deployment runs in, and lakehouse namespaces pinned to regions. Cairn, Cairn
  # Catalog and Cairn Store read the same rules (a ConfigMap, so a pin changes only by a reviewed deployment change;
  # the store's replication targets, sinks, remotes and tiers each name their residency_region):
  #   rules: {regions: {eu: {location: s3://lake-eu/warehouse}}, pins: [{namespaces: [crm_eu], region: eu}]}
  # Each region's bucket must exist in the store. See "Data residency" in the operator manual.
  residency:
    region: ""
    rules: {}

  # ============================================================ Active Metadata layer
  # Public base URL users reach Cairn on (Slack/Teams links, embed snippets, OAuth-style redirects).
  publicUrl: https://cairn.example.com

  embeds:
    # Origins allowed to frame Cairn embeds (CSP frame-ancestors) and call the embed API.
    allowedOrigins: []
    #  - https://acme.looker.com
    #  - https://*.online.tableau.com
    #  - https://app.powerbi.com

  integrations:
    slack:
      enabled: false
      # Secret with the Slack app credentials (see deploy/slack/app-manifest.yaml).
      existingSecret: cairn-slack
      botTokenKey: bot-token
      signingSecretKey: signing-secret
      # The assistant answers DMs and @mentions (subscribe to app_mention and message.im). In channels
      # it answers as this user, or privately to the asker when empty.
      channelActor: ""
      # Slack Web API base, e.g. https://slack-gov.com/api for GovSlack.
      apiUrl: https://slack.com/api
    teams:
      enabled: false
      # Secret with the default Teams Workflows webhook URL (per-domain routes live in Cairn).
      existingSecret: cairn-teams
      webhookUrlKey: webhook-url
      # Hosts Teams webhooks may point at (host suffixes, or exact origins such as a corporate proxy).
      # Personal webhook URLs are user input: anything else is refused.
      webhookHosts: ".webhook.office.com,.logic.azure.com,.powerplatform.com,.powerautomate.com"
      # The assistant in Teams channels (an outgoing webhook): its security token in the Secret above,
      # the identity answers run as (required), and where answers slower than five seconds go.
      assistant:
        enabled: false
        outgoingSecretKey: outgoing-secret
        channelActor: ""
        replyWebhookKey: ""
    webhooks:
      # Generic webhooks never reach loopback or link-local (cloud metadata) addresses; set false to
      # also refuse private networks.
      allowPrivateNetworks: true
    email:
      enabled: false
      existingSecret: cairn-smtp
      smtpUrlKey: smtp-url

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -------------------------------------------------------------------------- components
  api:
    enabled: true
    replicas: 2
    port: 8800
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    # Standalone ingress for the API only; core.ingress already routes /cairn/api on the UI host.
    ingress:
      enabled: false
      className: ""
      host: cairn.example.com
      path: /cairn/api
      annotations: {}
      tls: []
    nodeSelector: {}
    tolerations: []
    affinity: {}

  pdp:
    enabled: true
    # The PDP is on the Cairn Core authorization hot path: keep >= 2 replicas.
    replicas: 2
    port: 8810
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 768Mi }
    pdb:
      enabled: true
      minAvailable: 1
    nodeSelector: {}
    tolerations: []
    affinity: {}

  gateway:
    enabled: true
    replicas: 2
    port: 8820
    publicUrl: https://cairn-gateway.example.com
    # The gateway's X25519/Ed25519 identity must be identical on every replica. Provide it as a Secret
    # (files: gateway_x25519.key, gateway_ed25519.key). If empty, a PVC is used and replicas is forced to 1.
    keys:
      existingSecret: ""
      persistence:
        size: 64Mi
        storageClass: ""
      # The identity wrapped by a key manager (Vault transit or AWS KMS): a Secret with the settings (configKey,
      # e.g. {"type": "vault-transit", "addr": "https://vault:8200", "key": "cairn-gateway",
      # "token_file": "/etc/cairn/gateway-kms/vault-token"}) and the credential files they name. The key Secret
      # (or volume) then holds only gateway-identity.kms.json; `cairn gateway-keys wrap` makes it.
      kms:
        secretName: ""
        configKey: kms.json
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    # TLS on the gateway itself (a kubernetes.io/tls Secret) and, with clientCaSecret (a Secret whose clientCaKey,
    # default ca.crt, is the CA that issues agents' certificates), mutual TLS: an agent without a certificate from
    # that CA is refused in the handshake. Expose it with a LoadBalancer Service or TLS passthrough; an Ingress that
    # ends TLS would have to check client certificates itself.
    tls:
      secretName: ""
      clientCaSecret: ""
      clientCaKey: ca.crt
    # Public (or PrivateLink / VPC endpoint) exposure for remote agents.
    service:
      type: ClusterIP
      annotations: {}
    ingress:
      enabled: false
      className: ""
      host: cairn-gateway.example.com
      annotations: {}
      tls: []
    nodeSelector: {}
    tolerations: []
    affinity: {}

  mcp:
    enabled: true
    replicas: 1
    port: 8830
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 768Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  scheduler:
    enabled: true
    # Leader election uses a Postgres advisory lock; standby replicas take over within one tick.
    replicas: 2
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  actions:
    piiPropagation:
      enabled: true
      replicas: 1
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 768Mi }
    # Rule-based tag/term propagation (edit files/actions/label_propagation.yml for the rules).
    labelPropagation:
      enabled: false
      replicas: 1
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 768Mi }
    vectorIndexer:
      enabled: true
      replicas: 1
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 1Gi }

  # ---------------------------------------------------------------- Active Metadata components
  # Masking middleware between the web application and Cairn Core. It sits on the UI hot path: keep
  # >= 2 replicas with a PDB. Stateless; scales horizontally.
  coreProxy:
    enabled: true
    replicas: 2
    port: 8890
    # Upstream Cairn Core; empty = cairn.core.url.
    upstream: ""
    # Session-token signing key, used read-only to verify session JWTs (actorId claim).
    # Empty secretRef = core.secrets.name / core.secrets.sessionSigningKeyKey.
    sessionSigningKey:
      secretRef: ""
      secretKey: ""
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 768Mi }
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Context Agents: mine queries, dbt, BI semantics and run histories (findings, drift, ontology).
  contextMiner:
    enabled: true
    replicas: 1
    intervalSeconds: 300
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 1536Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Notification hub fan-out to Slack / Teams / email / in-app.
  # Streams (`cairn streams`): Kafka topics, Debezium change events included, written into lakehouse
  # tables. existingSecret holds kafka.json (kafka-python consumer settings: bootstrap_servers,
  # security_protocol, sasl_*) and catalog.json (Iceberg REST catalog properties). Replicas share the
  # partitions; define streams with POST /v1/streams. For Avro (Confluent wire format) add
  # schema-registry.json ({"url", "username", "password", "ca_file"}) to the same Secret.
  streams:
    enabled: false
    existingSecret: ""
    replicas: 1
    intervalSeconds: 15
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 1Gi }
    nodeSelector: {}
    tolerations: []

  notifier:
    enabled: true
    replicas: 1
    intervalSeconds: 10
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { memory: 512Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Cairn Store: Cairn's S3-compatible object store for the lakehouse (Iceberg tables, exports). One
  # replica on a persistent volume by default (back the volume up like a database), or a cluster (below).
  # Credentials come from a Secret you create:
  #   kubectl create secret generic cairn-store \
  #     --from-literal=access-key=cairn-store --from-literal=secret-key=$(openssl rand -hex 24)
  # Operational databases: PostgreSQL databases made through Cairn (POST /v1/databases), reached only with
  # short-lived logins Cairn hands out. The admin URL (a role with CREATEDB and CREATEROLE) comes from a Secret;
  # host and port are where clients reach the server.
  databases:
    enabled: false
    adminUrlSecret: { name: "", key: url }
    host: ""
    port: 5432
    sslmode: require
    # Managed Postgres (L140): PostgreSQL instances Cairn runs (POST /v1/databases/instances), with standbys,
    # pooling, backups to the store and point-in-time restore. runtime: "" (off), kubernetes (CloudNativePG, installed
    # first: see the operator manual, "Managed Postgres") or docker (small deployments). The instances' superuser
    # passwords are derived from a key in a Secret you create:
    #   kubectl create secret generic cairn-pg-instances --from-literal=key=$(openssl rand -hex 32)
    instances:
      runtime: ""
      keySecret: { name: cairn-pg-instances, key: key }
      kubernetes:
        namespace: cairn-postgres         # where the clusters run; the chart gives Cairn a Role there for them only
        access: cluster-ip                # node-port: Cairn reaches the primaries at nodeAddress (Cairn outside)
        nodeAddress: ""
        storageClass: ""
        images: {}                        # {"16": "ghcr.io/cloudnative-pg/postgresql:16.6"}: pinned per major version
        # The store's keys for the operator's Barman Cloud, in `namespace` (keys access-key and secret-key).
        backupSecret: cairn-pg-backups
      backups:
        enabled: false
        endpoint: ""                      # how Cairn reaches the store (default: this release's Cairn Store)
        endpointForInstances: ""          # how the instances reach it (default: endpoint)
        bucket: cairn-pg-backups
        region: us-east-1
        # Cairn's copy of the store's keys, in this release's namespace (retention and listing backups).
        secret: { name: cairn-pg-backups, accessKeyKey: access-key, secretKeyKey: secret-key }
  # Managed Airflow (L144): Airflow deployments Cairn runs for teams (POST /v1/airflow/deployments), per environment,
  # with DAG-only and image deploys, promotion, rollback, hibernation and upgrades. runtime: "" (off), kubernetes (the
  # official Apache Airflow chart, pinned 1.20.0, shipped in Cairn's image) or docker (single hosts). Deployments'
  # keys (database password, Fernet, JWT, OAuth client secret) are derived from a key in a Secret you create:
  #   kubectl create secret generic cairn-airflow-deployments --from-literal=key=$(openssl rand -hex 32)
  # Needs Trino's sign-in (CAIRN_TRINO_ACCESS_KEY): people sign in, and tasks get their identity, through it.
  airflowDeployments:
    runtime: ""
    keySecret: { name: cairn-airflow-deployments, key: key }
    cairnUrl: ""                      # Cairn's API as the deployments reach it (default: this release's API Service)
    publicUrl: ""                     # Cairn as people's browsers reach it (default: the consumer UI's public URL)
    trino: {}                         # {"host": "cairn-trino.cairn.svc", "port": 8443, "catalog": "lakehouse"}
    otelCollector: ""                 # host:port of the Collector's OTLP/HTTP receiver: Airflow's metrics and traces
    selfApprove: false                # a promotion's requester may approve it themselves
    bundles:                          # DAG bundles (DAG-only deploys) in Cairn Store
      endpoint: ""                    # default: this release's Cairn Store
      bucket: cairn-airflow-deploys
      region: us-east-1
      secret: { name: cairn-airflow-bundles, accessKeyKey: access-key, secretKeyKey: secret-key }
    kubernetes:
      namespacePrefix: cairn-af-      # each deployment in <prefix><name>; an admission policy keeps Cairn there
      urlTemplate: "https://{name}.airflow.example.com"
      ingressClass: ""
      ingressNamespace: ingress-nginx
      workloadIssuer: k8s             # the cluster's issuer in the workload identity issuers
      images: {}                      # {"3.3.2": "registry.example.com/cairn/airflow:0.1.0"}
      storageClass: ""
      dbImage: ""                     # the metadata database's PostgreSQL image (CloudNativePG's default)
  # Managed NiFi (L152): governed data connectors. NiFi is reached only through Cairn (its canvas is proxied).
  nifiDeployments:
    runtime: ""                       # kubernetes or docker; empty: off
    keySecret: { name: cairn-nifi-deployments, key: key }
    cairnUrl: ""                      # Cairn's API as NiFi reaches it (lakehouse tokens; default: this release's API)
    publicUrl: ""                     # Cairn as people's browsers reach it (default: the consumer UI's public URL)
    proxyPrefix: /cairn/api           # where browsers reach Cairn's API (the canvas is under it)
    catalogUrl: ""                    # Cairn Catalog as NiFi reaches it (lakehouse sinks)
    storeUrl: ""                      # Cairn Store as NiFi reaches it (lakehouse sinks)
    syncSeconds: 300                  # how often flows' activity becomes runs
    kubernetes:
      namespacePrefix: cairn-nifi-    # each deployment in <prefix><name>; an admission policy keeps Cairn there
      images: {}                      # {"2.12.0": "registry.example.com/apache/nifi:2.12.0"} (default: apache/nifi)
      storageClass: ""
  store:
    enabled: false
    port: 8333
    image:
      repository: ""   # empty = <global.cairn.registry>/store
      tag: ""
      pullPolicy: IfNotPresent
    secret:
      name: cairn-store
      accessKeyKey: access-key
      secretKeyKey: secret-key
      # Optional: a base64 32-byte key in the same Secret turns on encryption at rest.
      masterKeyKey: ""
      # Optional: a key in the same Secret (32+ characters) turns on temporary credentials (STS:
      # AssumeRole, GetSessionToken, AssumeRoleWithWebIdentity). Cairn Catalog needs it to hand out
      # per-table credentials.
      stsSecretKey: ""
      # Optional: a Secret with a "keyring.json" ({"keys": {...}, "sse_s3_key": ...}) instead, for key rotation.
      # Customer-managed keys in Vault Transit go under "external" in keyring.json; put the store's Vault
      # token in the same Secret as "vault-token" (token_file: /etc/cairn-store-keyring/vault-token).
      keyringSecret: ""
    # OIDC issuers whose tokens AssumeRoleWithWebIdentity accepts, e.g.
    #   [{issuer: cairn, audiences: [cairn-store], jwks_url: "http://<release>-cairn-api:8800/v1/trino/jwks.json"}]
    stsProviders: []
    # Further keys (read-only, bucket-scoped): a Secret with a "credentials.json" list, or empty.
    extraCredentialsSecret: ""
    buckets: [lakehouse]      # created at start-up if missing
    region: us-east-1
    domain: ""                # set to enable virtual-hosted-style requests (<bucket>.<domain>)
    # Serve HTTPS: a kubernetes.io/tls Secret (cert-manager works; renewals are picked up without a restart).
    tlsSecret: ""
    # With tlsSecret: also require client certificates signed by the CA in this Secret's "ca.crt"
    # (the kubelet has no client certificate, so probes then only check that the port is open).
    clientCaSecret: ""
    # Online backups (cairn-store admin backup <name>) on a second volume.
    backups:
      enabled: false
      size: 100Gi
      storageClassName: ""
    # Backups to sinks (S3, Azure Blob, GCS): a Secret with a "sinks.json" ([{"id", "kind", "endpoint", "bucket", "prefix",
    # ...}]; see the administration guide). Optionally back up to one of them on a schedule.
    backupSinks:
      secretName: ""
      schedule: ""            # a sink id: back up there every intervalSeconds, keeping the newest `keep`
      continuous: ""          # a sink id: journal every object change there, for point-in-time restores
      intervalSeconds: 86400
      keep: 7
    # Compress new object data at rest: off or zstd (1 MiB chunks, so ranged reads stay cheap).
    compression: "off"
    # Remote buckets that can be mounted into local buckets: a Secret with a "remotes.json" ([{"id",
    # "kind": "s3"|"azure"|"gcs", "endpoint", "bucket", "prefix", ...}]; see the administration guide).
    # Other keys of the Secret (an Azure account key, a GCS service account key) are files next to it
    # in /etc/cairn-store-remotes/, for secret_key_file, sas_file and credentials_file.
    remotesSecret: ""
    # The Kubernetes service account the store pods run as, e.g. one bound to a Google service account
    # (GKE workload identity) for GCS remotes, sinks and tiers with "auth": "metadata".
    serviceAccountName: ""
    # Event notification targets: a Secret with a "targets.json" ([{"type": "webhook"|"kafka"|"sqs"|"pubsub"|"nats",
    # "id": ...}]; see the administration guide). Its other keys are files next to it, for *_file settings.
    eventTargetsSecret: ""
    # Replication destinations: a Secret with a "targets.json" ([{"id", "endpoint", "access_key",
    # "secret_key", "region"}]); bucket replication rules name one as arn:cairn:store:::<id>.
    replicationTargetsSecret: ""
    # Storage tiers for lifecycle transitions: a Secret with a "tiers.json" ([{"storage_class", "kind":
    # "s3"|"azure"|"gcs", "endpoint", "bucket", "prefix", ...}]); its other keys are in /etc/cairn-store-tiers/.
    tiersSecret: ""
    # The file API (/-/files/) also accepts HTTP Basic sign-in (access key and secret key), for browsers.
    # Needs TLS (tlsSecret).
    filesBasicAuth: false
    # Keep the store's metadata in PostgreSQL instead of the embedded index: a Secret whose `key` holds a
    # postgres:// URL (use ?sslmode=require). Blobs stay on the data volume.
    metadata:
      secretName: ""
      key: url
    # A cluster: `replicas` nodes, each with its own volume, sharing the PostgreSQL metadata above (required).
    # Every object is kept as `copies` copies on distinct nodes, or erasure-coded ("4+2": 4 data + 2 parity
    # shards on 6 nodes) when at least erasureCodingAbove bytes. Online backups are off in a cluster.
    # The node-to-node secret is `clusterSecretKey` in the store Secret (16+ characters):
    #   kubectl create secret generic cairn-store ... --from-literal=cluster-secret=$(openssl rand -hex 24)
    cluster:
      enabled: false
      replicas: 3
      copies: 2
      erasureCoding: ""
      erasureCodingAbove: 1048576
      # Re-encode replicated blobs as erasure-coded shards once their object is this old (0: never),
      # for blobs of at least erasureCodingConvertAbove bytes. Needs erasureCoding.
      erasureCodingAfterSeconds: 0
      erasureCodingConvertAbove: 1048576
      clusterSecretKey: cluster-secret
      deadAfterSeconds: 60
      repairIntervalSeconds: 300
      # Failure domains. Each node's rack is the Kubernetes node it runs on; its zone is `zone` (one per
      # release; run a release per zone for multi-zone clusters). spread: node, rack (hosts) or zone.
      zone: ""
      spread: node   # rack once the nodes run on at least `copies` Kubernetes nodes
      # Nodes copy blobs to each other over TLS (tlsSecret; its certificate must name every node,
      # *.<release>-cairn-store-nodes.<namespace>.svc). Plain HTTP between nodes needs this set.
      allowInsecureHttp: false
      # Mutual TLS between nodes: each presents its certificate (tlsSecret, which then needs the
      # clientAuth usage too) and trusts only the CA in the Secret's ca.crt, as cert-manager writes it;
      # the node-to-node API refuses callers without such a certificate.
      mutualTls: false
    # SFTP for file-transfer clients: the user name is an access key, signing in with its secret key or an
    # SSH public key (ssh_keys in the credentials file).
    sftp:
      enabled: false
      port: 2022
      serviceType: ClusterIP
      passwordAuth: true
      # A Secret with "ssh_host_ed25519_key" (OpenSSH format). Empty: a key is created on the data volume.
      hostKeySecret: ""
      # Network policy peers allowed to connect (besides this release's pods), e.g. an ipBlock.
      ingressFrom: []
    # The Kafka protocol on the store's message queues: Kafka producers, consumers and consumer groups
    # sign in with SASL/PLAIN (an access key and its secret). Needs TLS (tlsSecret) unless allowPlaintext.
    kafka:
      enabled: false
      port: 9092
      # host:port clients connect to; empty: this release's kafka Service (in-cluster clients).
      advertised: ""
      allowPlaintext: false
      serviceType: ClusterIP
      # Network policy peers allowed to connect (besides this release's pods).
      ingressFrom: []
    # CSI driver (csi.cairn.store): PersistentVolumeClaims become buckets (with their size as a quota),
    # or prefixes of one shared bucket, mounted into pods with FUSE. Runs privileged on every node.
    csi:
      enabled: false
      kubeletDir: /var/lib/kubelet
      storeEndpoint: ""        # empty: this release's store service
      secretName: ""           # empty: cairn.store.secret (a key that may create buckets)
      images:
        registrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
        provisioner: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
      storageClass:
        create: true
        name: cairn-store
        default: false
        reclaimPolicy: Delete
        bucket: ""             # set: volumes are prefixes of this bucket instead of buckets of their own
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 512Mi }
      nodeSelector: {}
      tolerations: []
    # Refuse anonymous access and public bucket policies store-wide. Set false only to serve public files.
    blockPublicAccess: true
    # Ask this release's policy decision point about every request the store's own rules allow
    # (a deny-only layer; the store refuses requests while the PDP is unreachable).
    pdp:
      enabled: false
    persistence:
      size: 100Gi
      storageClassName: ""
      accessModes: [ReadWriteOnce]
      # The data volume's disk type (also that of buckets without one).
      diskType: hdd
    # More volumes for blob files, each with a disk type; a bucket can be pinned to a type
    # (cairn-store admin bucket-disk <bucket> --type ssd). Keep entries once added: a missing one stops the store.
    #   - { name: ssd1, type: ssd, size: 200Gi, storageClassName: fast }
    extraDisks: []
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 1Gi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Cairn Catalog: Iceberg REST catalog (Trino, Spark, pyiceberg connect to it). Writes table metadata
  # to Cairn Store with the store's key (cairn.store.secret). One replica on a persistent volume.
  # Tokens come from a Secret you create:
  #   kubectl create secret generic cairn-catalog --from-literal=token=$(openssl rand -hex 24)
  catalog:
    enabled: false
    port: 8181
    image:
      repository: ""   # empty = <global.cairn.registry>/catalog
      tag: ""
      pullPolicy: IfNotPresent
    secret:
      name: cairn-catalog
      tokenKey: token
    # Further tokens (namespace-scoped, read-only): a Secret with a "tokens.json" list, or empty.
    extraTokensSecret: ""
    warehouse: s3://lakehouse/warehouse
    # Object store; empty = this release's Cairn Store.
    s3Endpoint: ""
    # The store endpoint handed to engines with each table (empty = s3Endpoint).
    clientS3Endpoint: ""
    vendCredentials: true
    # Scoped credentials: a store role name (created when missing) or ARN. Engines (Trino included) then
    # get temporary keys for one table at a time and hold no store key; needs STS in the store
    # (cairn.store.secret.stsSecretKey).
    vendRole: ""
    # With vendRole: how long vended keys last (900-43200 s), and how often clients must come back for new
    # ones (360 s to vendSeconds; empty = vendSeconds), each renewal decided again by Cairn: a permission
    # removed reaches running jobs within this time.
    vendSeconds: 3600
    vendRevalidateSeconds: ""
    # State in PostgreSQL instead of a volume: a Secret whose urlKey holds a postgresql:// URL (one
    # database per lakehouse; TLS unless ?sslmode=disable). Then replicas > 1 serve the same lakehouse,
    # and a commit is still a compare-and-set across all of them.
    database:
      existingSecret: ""
      urlKey: url
    replicas: 1
    # People and pipeline users on the catalog (Spark, pyiceberg, DuckDB): they sign in with a Cairn token
    # (POST /v1/lakehouse/token) and the catalog asks Cairn about every table for them, refusing what
    # Cairn's policies do not allow and tables a mask or row filter applies to (query those through
    # Trino). Needs vendRole (engines get per-table temporary credentials, never a store key) and
    # cairn.trino (Cairn's policies on the lakehouse). The catalog asks with Cairn's service token.
    identity:
      enabled: false
      # Cairn Catalog's address as engines name it in OpenLineage (lineage lands on lakehouse tables).
      publicUrl: ""
      # Lakehouse sessions (engines renew their tokens at Cairn with a session credential): how long each
      # token lasts (300-43200 s; also how long an ended session's last token can still be used), and the
      # longest a session may last before its user signs in again (3600 s to 30 days).
      tokenTtlSeconds: 3600
      maxSessionSeconds: 604800
    # Tables on the organisation's own storage (external locations registered in Cairn, /v1/storage). Needs
    # identity. secrets: Kubernetes Secrets mounted for k8s:<secret>/<key> references; storeUrls: other places
    # on Cairn Store tables may live besides the warehouse; caSecret: a Secret with ca.crt for the storage.
    externalLocations:
      enabled: false
      secrets: []
      storeUrls: []
      caSecret: ""
      # Sharing tables with recipients outside the organisation (Iceberg REST, /v1/shares): the catalog and
      # Cairn's token endpoint as recipients reach them (both public), how long a recipient's token lasts
      # (60-3600 s) and the longest a share may last.
      shares:
        catalogUrl: ""
        tokenUrl: ""
        tokenTtlSeconds: 900
        maxDays: 365
    # The volume for the embedded state (without database).
    persistence:
      size: 10Gi
      storageClassName: ""
      accessModes: [ReadWriteOnce]
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 1Gi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Cairn Ontology: the ontology compiler (a Rust port of NVIDIA auto-ontology's compiler; see ontology/NOTICE).
  # Cairn pushes its catalog and Trino query history to it (the context-miner worker, every intervalSeconds, and
  # on demand), it compiles business terms, relationships, metrics and bridge tables, and the results come back
  # as proposals in the context inbox. Its model calls go through Cairn's AI gateway as its own agent identity.
  ontology:
    enabled: false
    port: 8590
    image:
      repository: ""   # empty = <global.cairn.registry>/ontology
      tag: ""
      pullPolicy: IfNotPresent
    # The bearer token Cairn calls the compiler with (16+ characters): a Secret you create.
    secret:
      name: cairn-ontology
      tokenKey: token
    # The compiler's ontology, runs and query log: a Secret whose urlKey holds a postgresql:// URL (TLS unless
    # ?sslmode=disable). Required.
    database:
      existingSecret: ""
      urlKey: url
    model:
      # OpenAI-compatible base URL; empty = this release's AI gateway (…/v1/ai/gateway/openai/v1). The gateway
      # must serve both models (cairn.extraEnv CAIRN_AI_GATEWAY_MODELS) and the agent's owner needs
      # USE_AI_GATEWAY on them.
      url: ""
      chat: ""
      embeddings: ""      # empty: no embeddings (semantic search and vector FK candidates off)
      # The compiler agent's key (scope "model"; POST /v1/ontology/agent shows it once): a Secret you create.
      keySecret:
        name: ""
        key: key
      timeoutSeconds: 120
      maxInflight: 6
    workers: 3
    probeDistinctValues: true
    maxQueries: 20000
    # Cairn's side: how often the context-miner worker syncs and compiles (0: on demand only); the person whose
    # governed reads sample rows for profiling (masking applied; empty: no samples beyond catalog profiles); and
    # relation allow/deny regexes (deny wins; matched against the unqualified table name).
    intervalSeconds: 3600
    sampleAs: ""
    tableAllowRegex: ""
    tableDenyRegex: ""
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 2Gi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Trino on the lakehouse: SQL on Cairn Catalog's Iceberg tables (data in Cairn Store), as the
  # `lakehouse` catalog. Needs catalog.enabled. One coordinator that also runs queries.
  trino:
    enabled: false
    port: 8080
    # Other databases queried through Trino, in place (federation). Cairn decides their tables like the
    # lakehouse's (platform/database: how Cairn's catalog names them, e.g. postgres datasets crm.<schema>.<table>).
    # Credentials come from a Secret (user, password keys); never put them in properties.
    # AI functions in SQL (Trino's ai connector, catalog "llm": llm.ai.ai_gen, ai_classify, ai_analyze_sentiment,
    # ai_extract, ai_mask, ai_translate, ai_fix_grammar). Calling one needs Cairn's USE_AI_FUNCTIONS; masks
    # and row filters apply first. provider: openai (or any OpenAI-compatible endpoint, e.g. Ollama or vLLM)
    # or anthropic. The API key comes from a Secret.
    # Warehouses: a Trino per team (same catalogs and policies), behind the warehouse proxy (cairn
    # warehouses), which stops one after idleMinutes without queries and starts it on the next (clients
    # wait for the start). Running a query on one needs Cairn's USE_WAREHOUSE on urn:li:warehouse:<name>.
    # Clients connect to the proxy's Service, port = the warehouse's port (TLS from cairn.trino.tls).
    warehouses:
      idleMinutes: 10
      startTimeoutSeconds: 300
      # What a warehouse node (coordinator or worker) costs an hour, for the cost report ("" : not priced;
      # node-hours are still recorded).
      usdPerNodeHour: ""
      proxy:
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 512Mi }
      list: []
      #  - name: sales
      #    port: 8443
      #    idleMinutes: 15            # default: warehouses.idleMinutes (0: never stopped)
      #    queryMaxMemory: 4GB
      #    resources: { requests: { cpu: "2", memory: 8Gi }, limits: { memory: 8Gi } }
      #    # Workers, scaled by the proxy with the queries running and queued (none while stopped):
      #    workers: { min: 0, max: 4, queriesPerWorker: 4, scaleDownMinutes: 5 }
      # Adaptive warehouses: one port in front of several warehouses above, smallest first. Each query goes to
      # the largest when its earlier runs (same shape, any literals; from query history) reached a largeWhen
      # figure, else to the smallest, overflowing to the largest while the smallest has overflowAt queries.
      adaptive: []
      #  - name: auto
      #    port: 8450
      #    tiers: [sales, sales-xl]
      #    largeWhen: { cpu_ms: 600000, input_bytes: 100000000000, peak_memory_bytes: 8000000000 }
      #    overflowAt: 8
    # Delta Lake tables (catalog "delta") in Cairn Store, their metastore files beside them
    # (s3://<bucket>/<prefix>/), governed by Cairn like the lakehouse (datasets on the delta-lake platform).
    # A store key that can reach only that prefix, from a Secret (access-key, secret-key). Commits are
    # conditional writes, so several writers may write one table; register tables other engines wrote
    # with CALL delta.system.register_table.
    delta:
      enabled: false
      bucket: lakehouse
      prefix: delta
      credentialsSecret: { name: "", accessKeyKey: access-key, secretKeyKey: secret-key }
    # Stored functions (catalog "routines"): CREATE FUNCTION routines.<schema>.<name> ... keeps SQL and Python
    # functions in a file metastore in the store (Trino's Hive connector). Calling one needs USE_FUNCTION on
    # urn:li:function:routines.<schema>.<name>; creating one, MANAGE_DATASET.
    routines:
      enabled: false
      bucket: lakehouse
      prefix: routines
      credentialsSecret: { name: "", accessKeyKey: access-key, secretKeyKey: secret-key }
    ai:
      enabled: false
      provider: anthropic
      model: claude-haiku-5-5
      endpoint: ""          # the provider's URL (default: Anthropic's or OpenAI's)
      apiKeySecret: { name: "", key: api-key }
      # Through Cairn (default): Trino never has the provider's key; Cairn allows the models, counts calls
      # against the daily AI budget (cairn.ai budgets), caps calls a minute and queries a person a day,
      # and records usage. false: Trino calls the provider directly with the key.
      viaCairn: true
      allowedModels: []     # besides `model`
      callsPerMinute: 600
      userDailyQueries: 200
    # Cairn's functions in Trino SQL: ai_search(index, query, k) searches a Cairn vector index as the person
    # running the query (the same checks as the API's search, metered as AI usage). The plugin
    # (plugins/java/cairn-trino-functions) is built by docker/trino-functions.Dockerfile against this Trino
    # version; an init container copies it into Trino's plugin directory, and Trino calls Cairn with its access key.
    functions:
      enabled: false
      image:
        repository: cairn/trino-functions
        tag: "0.1.0"
        pullPolicy: IfNotPresent
    federation: []
    # External Iceberg REST catalogs (another organisation's or a cloud catalog), registered at
    # /v1/external-catalogs and added to Trino by Cairn (dynamic catalogs), governed like the lakehouse and
    # read-only unless registered writable. Trino signs in to them through Cairn's token broker with its own
    # access key; the external credential stays in Cairn (a secret scope or a CAIRN_EXTCAT_* variable).
    # connection: the trino:// connection (cairn.connections) Cairn runs CREATE CATALOG on.
    externalCatalogs:
      enabled: false
      connection: lakehouse
      # Live Snowflake catalogs (preset snowflake_federated, Trino's Snowflake connector, L151). A JDBC connector
      # cannot ask Cairn's broker, so Cairn writes each catalog's user and password (read from a secret scope)
      # into a Secret Trino's pods mount at /etc/trino/federation; the API may get and patch only that Secret.
      # It also gives Trino the JVM option the Snowflake connector needs.
      snowflake:
        enabled: false
        secretName: ""   # default <release>-trino-federation
    #  - name: crm
    #    connector: postgresql
    #    properties: { connection-url: "jdbc:postgresql://crm-db:5432/crm" }
    #    credentialsSecret: { name: crm-trino, userKey: user, passwordKey: password }
    #    platform: postgres
    #    database: crm
    image:
      repository: trinodb/trino
      tag: "484"
      pullPolicy: IfNotPresent
    queryMaxMemory: 2GB
    # Worker pods besides the coordinator (0: the coordinator runs queries itself).
    workers: 0
    # Workers scale between minWorkers and maxWorkers on CPU (a HorizontalPodAutoscaler; set workers to
    # at least minWorkers). A worker that is removed stops taking work and finishes what it runs first
    # (gracefulShutdownSeconds), so scaling in fails no query.
    autoscaling:
      enabled: false
      minWorkers: 1
      maxWorkers: 10
      targetCPUUtilizationPercentage: 70
    gracefulShutdownSeconds: 120
    # Fault-tolerant execution: a worker lost mid-query has its tasks run again elsewhere instead of
    # failing the query. Intermediate data is staged in a Cairn Store bucket (create it, and give Trino
    # a key that reaches only that bucket: exchangeKeySecret). retryPolicy TASK (retries tasks, for long
    # batch queries) or QUERY (reruns the whole query).
    faultTolerance:
      enabled: false
      retryPolicy: TASK
      exchangeBucket: trino-exchange
      exchangeKeySecret:
        name: cairn-trino-exchange
        accessKeyKey: access-key
        secretKeyKey: secret-key
    # Spill: joins, aggregations and sorts larger than memory use local disk (an emptyDir).
    spill:
      enabled: false
      maxUsedSpacePerNode: 20GB
      sizeLimit: 25Gi
    # File cache: lakehouse data and metadata files kept on local disk (an emptyDir), so repeated reads
    # skip the store.
    cache:
      enabled: false
      maxSize: 10GB
      sizeLimit: 12Gi
    # Resource groups: queues and limits per kind of work. Cairn's own queries (the SQL editor,
    # Ask-your-data and the catalog crawler, source "cairn"), pipelines (source airflow, dbt or etl…)
    # and everyone else, each person in their own group. Trino's resource-groups JSON; {} turns it off.
    resourceGroups:
      rootGroups:
        - name: global
          softMemoryLimit: 90%
          hardConcurrencyLimit: 100
          maxQueued: 1000
          subGroups:
            - {name: cairn, softMemoryLimit: 30%, hardConcurrencyLimit: 10, maxQueued: 200}
            - {name: pipelines, softMemoryLimit: 60%, hardConcurrencyLimit: 20, maxQueued: 500}
            - name: adhoc
              softMemoryLimit: 50%
              hardConcurrencyLimit: 50
              maxQueued: 500
              subGroups:
                - {name: "${USER}", softMemoryLimit: 20%, hardConcurrencyLimit: 5, maxQueued: 50}
      selectors:
        - {source: "cairn", group: global.cairn}
        - {source: "(?i)(airflow|dbt|etl|dagster|prefect).*", group: global.pipelines}
        - {group: "global.adhoc.${USER}"}
    # Trino asks Cairn's policy engine before every action (Trino's OPA access-control plugin): a Secret
    # with the key both share (at least 24 characters). Required: Trino is not deployed without it.
    accessKeySecret:
      name: cairn-trino
      key: access-key
    # Sign-in: clients present a token Cairn issues (POST /v1/trino/token; the SQL editor does it itself)
    # and Trino checks it against Cairn's public key. Tokens travel over HTTPS: set tls.secretName to a
    # kubernetes.io/tls Secret (tls.crt, tls.key) for Trino's HTTPS port. Without one the chart refuses to
    # render unless allowInsecureHttp is true (tokens then cross the network in the clear: tests only).
    tls:
      secretName: ""
      httpsPort: 8443
    allowInsecureHttp: false
    tokenIssuer: cairn
    tokenTtlSeconds: 3600
    # People sign in to Trino's web UI and BI tools (external authentication) through Cairn (OAuth2).
    # publicUrl: the address people reach Trino's HTTPS port at (its callback, publicUrl/oauth2/callback,
    # is the only place Cairn sends them back to). Needs tls.secretName. clientSecret: a key (24+
    # characters) in the Secret named by accessKeySecret.name.
    sso:
      enabled: false
      publicUrl: ""
      clientSecretKey: oauth-secret
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { memory: 4Gi }
    nodeSelector: {}

  # Static host for the consumer workspace MFE (remoteEntry.js) and the embed SDK (web components).
  consumerUi:
    enabled: true
    replicas: 2
    port: 8080
    image:
      repository: ""   # empty = <global.cairn.registry>/consumer-ui
      tag: ""            # defaults to .Chart.AppVersion
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 128Mi }
    pdb:
      enabled: true
      minAvailable: 1
    # Standalone ingress for /cairn-ui only (core.ingress already routes it). Must share the UI's origin
    # so the MFE can use the session cookie.
    ingress:
      enabled: false
      className: ""
      host: cairn.example.com
      path: /cairn-ui
      annotations: {}
      tls: []
    nodeSelector: {}
    tolerations: []
    affinity: {}

  networkPolicy:
    enabled: true
    # Pods allowed to call the PDP besides this release's Cairn Core and control plane (e.g. an
    # external Cairn Core when core.enabled=false). Empty = none.
    extraPdpClientSelector: {}
    # Egress for the notifier (Slack / Teams / SMTP over 443/587). Empty = allow any destination on
    # those ports; restrict with ipBlock / namespaceSelector entries for an egress proxy.
    notifierEgressTo: []
    # Extra ingress sources allowed to reach Cairn Store (query and processing engines). Empty = none.
    storeIngressFrom: []
    # Extra ingress sources allowed to reach Cairn Catalog (query and processing engines). Empty = none.
    catalogIngressFrom: []
    # Extra ingress sources allowed to reach Trino (BI tools, notebooks). Empty = this release's pods only.
    trinoIngressFrom: []
    # Extra ingress sources allowed to reach the API (e.g. the ingress controller namespace).
    apiIngressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx

  # Nightly export of catalog metadata (assets, columns, owners, labels, lineage, monitor results,
  # access grants) as Parquet partitions or Iceberg tables in the customer's storage.
  metadataExport:
    enabled: false
    schedule: "17 2 * * *"
    format: parquet          # or iceberg
    destination: ""          # parquet: s3://bucket/cairn, gs://…, abfs://container@account.dfs.core.windows.net/…
    keepDays: 30
    iceberg:
      catalog: default       # configured through PYICEBERG_CATALOG__DEFAULT__* in credentialsSecret
      namespace: cairn
    credentialsSecret: ""    # Secret with storage or catalog credentials, loaded as environment variables
    extraEnv: []
    timeoutSeconds: 3600
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }

  # dbt projects on the lakehouse, each a CronJob running `cairn dbt` in the project's own image (FROM
  # cairn/dbt, with the project copied in). Each signs in as its own Cairn user (a personal access token
  # in tokenSecret), so Cairn's policies decide what it may read and build, and its runs are recorded
  # in Cairn (docs, lineage, tests). Needs cairn.trino (with TLS).
  dbt:
    jobs: []
    #  - name: shop
    #    image: registry.example.com/analytics/shop-dbt:1.4.0
    #    schedule: "23 3 * * *"
    #    args: [build]                      # dbt's arguments
    #    schema: analytics                  # the default schema models are built in
    #    tokenSecret: { name: svc-dbt-token, key: token }
    #    # or, with no stored token: sign in as the pod's service account (bound to svc-dbt in Cairn,
    #    # see cairn.workloadIdentity); the kubelet rotates its token.
    #    workloadIdentity: { serviceAccount: svc-dbt, audience: cairn, expirationSeconds: 3600 }
    #    caSecret: { name: cairn-trino-tls, key: ca.crt }   # Trino's CA; empty: the system's
    #    timeoutSeconds: 7200
    #    threads: 4
    #    environment: prod                  # runs are recorded in it; its last successful run is its state
    #    deferTo: ""                        # e.g. prod: --state/--defer to that environment (Slim CI)
    #    extraEnv: []
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
    # A private mirror of the dbt package hub (dbt deps), e.g. https://dbt-hub.example.com/
    packageHubUrl: ""

  # Spark on Kubernetes (cairn-spark submit --deploy-mode cluster, or Spark Operator SparkApplications
  # built by cairn_spark.kubernetes / CairnSparkApplicationOperator). Drivers sign in by workload identity
  # (needs cairn.workloadIdentity.issuers): bind driverServiceAccount to a pipeline user in Cairn.
  # MLflow tracking and model registry, reached only through Cairn (<cairn>/v1/ml with a Cairn token):
  # runs are the caller's, registered models are owned and governed (VIEW_ENTITY_PAGE, MANAGE_ML_MODEL,
  # USE_ML_MODEL on urn:li:mlModelGroup:(urn:li:dataPlatform:mlflow,<name>,PROD)), and each version
  # appears in the catalog with lineage from its training tables.
  # JupyterHub with sign-in through Cairn (run the official JupyterHub chart with helm/jupyterhub/values-cairn.yaml):
  # Cairn registers it as an OAuth client and gives each person's server a Cairn token of their own.
  # Data apps (/apps/<name>/): Streamlit and other web apps behind Cairn sign-in.
  apps:
    # URL prefixes apps may be deployed from, besides the repositories configured for git (e.g. https://git.acme.com/).
    gitUrls: []
    # The Kubernetes runtime (runtime: kubernetes): a Deployment per app in `namespace`, started on the first
    # visit and stopped when idle. The chart gives Cairn's API a Role there for the apps' objects only.
    kubernetes:
      enabled: false
      namespace: cairn-apps
      # cluster-ip: Cairn reaches apps at their Service (Cairn in this cluster); node-port: at nodeAddress.
      access: cluster-ip
      nodeAddress: ""
      # Network policy peers that may reach the apps (default: Cairn's API pods in this release's namespace).
      ingressFrom: []
      gitImage: alpine/git:v2.49.1
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }

  # Agent apps (/v1/agent-apps, `cairn agents deploy`): code-first agents run as the person asking. runtime: ""
  # (off) or kubernetes: a Deployment per app in kubernetes.namespace running `image` (docker/agent-runtime.Dockerfile;
  # build FROM it to add the packages your agents need). The chart gives Cairn's API a Role there for the apps'
  # objects only. Deploying needs BUILD_AGENTS; asking an app needs USE_AGENT on urn:li:cairnAgent:<name>.
  agentApps:
    runtime: ""
    # Where the agents call Cairn back for models and data (default: this release's API Service).
    cairnUrl: ""
    kubernetes:
      namespace: cairn-agents
      image: cairn/agent-runtime:0.1.0
      # cluster-ip: Cairn reaches the agents at their Service (Cairn in this cluster); node-port: at nodeAddress.
      access: cluster-ip
      nodeAddress: ""
      # Network policy peers that may reach the agents (default: Cairn's API pods in this release's namespace).
      ingressFrom: []
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }

  # Scheduled notebook and Python jobs (/v1/jobs): each run as a Kubernetes Job in `namespace`, as its owner
  # (a Trino token minted for them, in a Secret deleted after the run). The chart gives Cairn's account a Role
  # there for the jobs' objects only. Defining or running a job needs RUN_JOBS.
  jobs:
    runtime: ""                 # "" (jobs off) or kubernetes
    namespace: cairn-jobs
    image: cairn/jobs:0.1.0
    # Where a job reaches Trino (https://...), and a ConfigMap key with Trino's CA when its certificate is private.
    trinoUrl: ""
    trinoCa: { configMap: "", key: ca.crt }
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 2Gi } }
    keepDays: 30

  # Egress for user code (jobs, notebooks, flows' steps, sandboxes, agent apps): with enforce, nothing but Cairn, the
  # lakehouse and the admins' egress rules (/v1/network/egress-rules) is reachable. Pods get a NetworkPolicy per
  # workspace (DNS, this namespace, CIDR rules) and leave for hosts through the egress proxy, which logs every refusal.
  egress:
    enforce: false
    # A Secret with the key Cairn signs the runs' proxy credentials with (16+ bytes), shared with the proxy.
    keySecret: { name: "", key: key }
    proxy:
      image: cairn/egress-proxy:0.1.0
      replicas: 2
      allowPrivate: false       # allowed host names may resolve to private addresses (hosts on a private network)
      always: []                # more than this namespace that every run may reach (host[:port] or CIDR)
      resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }

  notebooks:
    jupyterhub:
      enabled: false
      # The hub's OAuth callback(s): https://<hub>/hub/oauth_callback
      redirectUris: []
      # A Secret with the client secret (key `client-secret`, 24+ characters), shared with the hub.
      secret: { name: "", key: client-secret }
      tokenTtlSeconds: 28800
      defaultCatalog: lakehouse

  mlflow:
    enabled: false
    image: { repository: ghcr.io/mlflow/mlflow, tag: v3.5.0 }
    workers: 2
    # A Secret with the PostgreSQL URL (key `url`), e.g. postgresql://mlflow:...@db:5432/mlflow
    database: { secretName: "", key: url }
    # Artifacts in Cairn Store, with a store key (Secret: access-key, secret-key) for that prefix only.
    artifacts: { bucket: ml, prefix: artifacts, credentialsSecret: "" }
    # Model servers (mlflow models serve) Cairn forwards predictions to: {"<model>": "http://..."}.
    serving: {}
    # Managed model serving (/v1/ml/deployments) on Kubernetes: a Deployment per model deployment in `namespace`,
    # scaled by Cairn with its load, reached by Cairn only. The chart gives Cairn's API a Role there for those
    # objects only, and lets the model servers fetch their models from this MLflow (which serves the artifacts).
    servingKubernetes:
      enabled: false
      namespace: cairn-models
      # MLflow's image by default; an image of your own when models need libraries it does not have.
      image: ghcr.io/mlflow/mlflow:v3.5.0
      # cluster-ip: Cairn reaches models at their Service; node-port: at nodeAddress (Cairn outside the cluster).
      access: cluster-ip
      nodeAddress: ""
      # Network policy peers that may reach the models (default: Cairn's API pods in this release's namespace).
      ingressFrom: []
      resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 2Gi } }
    # Model servers the chart runs (any registered version, e.g. one a Spark training job registered): a
    # Deployment of MLflow's model server per item, fetching models:/<model>/<version> (or @<alias>) from this
    # MLflow, no store key in the pod. Cairn's API forwards predictions for <model> to it (USE_ML_MODEL checked)
    # and is the only thing a NetworkPolicy lets reach it. For models scaled with their load, use
    # servingKubernetes (deployments made from Cairn) instead.
    modelServers:
      trackingUri: ""      # where the servers fetch models; default: this release's MLflow
      image: ""            # default: cairn.mlflow.image; an image of your own for models needing other libraries
      resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 2Gi } }
      items: []
      #  - { name: churn, model: churn, version: "3", replicas: 2, workers: 2 }
      #  - { name: spend, model: spend-spark, alias: champion }
    # Spark training on a schedule: spark-submit in the Spark image as a CronJob (a Job without a schedule) in
    # cairn.spark's namespace (needs cairn.spark.enabled). The driver signs in with its service account's projected
    # token (bind the account to a pipeline user: /v1/workload-identity/bindings); there is no Secret. Runs and
    # models go through Cairn's MLflow (cairn_spark.mlflow.use_mlflow), owned by that user, with table lineage.
    trainingJobs:
      cairnUrl: ""         # Cairn's API as the job reaches it; default: this release's API Service
      items: []
      #  - name: churn-weekly
      #    schedule: "17 3 * * 1"    # cron; empty: a Job that runs once
      #    script: |                  # the program (a ConfigMap), or main: a .py path in the image
      #      from cairn_spark.mlflow import use_mlflow
      #      ...
      #    master: local[2]           # Spark in the pod; sparkArgs: ["--conf", "..."]; args: [...]
      #    serviceAccount: ""         # default: cairn.spark.driverServiceAccount
      #    env: {}                    # no secrets (refused)
      #    resources: { requests: { cpu: "2", memory: 4Gi }, limits: { memory: 6Gi } }
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 2Gi }

  spark:
    enabled: false
    namespace: ""                   # where applications run; empty: the release's
    driverServiceAccount: svc-spark # gets a Role to manage its executors; nothing on Secrets
    image: ""                       # empty: <global.cairn.registry>/spark:<tag>
    # Service accounts that may run SparkApplications here (create/watch/delete), e.g. Airflow's workers.
    submitters: []
    #  - { name: airflow-worker, namespace: airflow }
    # A namespace per team, each with its drivers' service account, a quota on what all its Spark
    # applications use together, and default requests for pods that state none.
    teams: []
    #  - name: finance
    #    namespace: spark-finance          # default: spark-<name>
    #    createNamespace: true
    #    driverServiceAccount: svc-spark-finance
    #    quota: { cpu: "32", memory: 128Gi, pods: "60" }
    #    defaultCpu: "1"
    #    defaultMemory: 2Gi
    #    maxCpu: "8"
    #    maxMemory: 32Gi
    #    submitters: [{ name: airflow-worker, namespace: airflow }]
    eventLog:
      existingClaim: ""             # a ReadWriteMany claim drivers mount at /opt/spark-events
      storageClassName: ""
      size: 20Gi
      # Or in Cairn Store: jobs write with the event-log role's temporary credentials
      # (CAIRN_SPARK_EVENT_LOG_DIR=<dir>, CAIRN_SPARK_EVENT_LOG_ROLE), the history server reads with a
      # read-only key (a Secret with access_key and secret_key).
      store:
        enabled: false
        dir: ""                     # s3a://spark-events/logs
        readerSecret: ""
    historyServer:
      enabled: false                # no sign-in of its own: ClusterIP only, served through Cairn
      proxyBase: /cairn/api/v1/spark/history   # Cairn's public path to it (its pages link back through it)
      maxAge: 30d                   # event logs older than this are removed
      resources:
        requests: { cpu: 100m, memory: 1Gi }
        limits: { memory: 2Gi }

  # Workload identity: pipelines (dbt, Airflow, Spark) sign in with the token their platform gives them
  # (a Kubernetes service account's projected token, a CI job's OIDC token) instead of a stored personal
  # access token. Each issuer Cairn trusts: its iss, the audience its tokens must be for (one of their own,
  # e.g. cairn), and its keys (jwks_url over HTTPS, ca_file if needed, or jwks_file). Bind workloads to
  # pipeline users at /v1/workload-identity/bindings. For this cluster, the issuer is the API server's
  # --service-account-issuer (EKS, GKE and AKS publish their OIDC issuer URL and keys).
  workloadIdentity:
    issuers: []
    #  - name: this-cluster
    #    issuer: https://oidc.eks.eu-west-1.amazonaws.com/id/EXAMPLE
    #    audience: cairn
    #    jwks_url: https://oidc.eks.eu-west-1.amazonaws.com/id/EXAMPLE/keys
    #    max_token_lifetime: 86400        # refuse longer-lived tokens (legacy secret tokens never expire)
    #    token_ttl: 3600                  # the Cairn token
    #  - name: ci
    #    issuer: https://token.actions.githubusercontent.com
    #    audience: cairn
    #    jwks_url: https://token.actions.githubusercontent.com/.well-known/jwks

  licence:
    # true: Cairn is read-only until a valid licence is installed (hosted tenants). false: without a
    # licence it runs in evaluation mode. Licences are installed in Administration, or from a Secret.
    required: false
    # A licence bound to another tenant is refused.
    tenantId: ""
    # Secret holding the licence key (key secretKey); installed at start when it changes.
    existingSecret: ""
    secretKey: licence

  # Usage metering (hosted tenants): the notifier reports the tenant's daily usage to the control plane,
  # signed with the key in Secret secretName (key "key"). deploy/hosting/tenant.sh --metering-key sets it.
  metering:
    enabled: false
    url: ""
    secretName: cairn-metering

  ha:
    # Spread replicas of every component over nodes and zones (when it runs more than one).
    # PodDisruptionBudgets are per component (<component>.pdb); values-ha.yaml turns them all on.
    spreadReplicas: true
  # Observability (docs: Administration -> Observability): OpenTelemetry traces, metrics and logs from every component
  # (Cairn's processes, Trino, Cairn Core through the OpenTelemetry Java agent), cleaned of credentials and values,
  # and Cairn's own view of them (/v1/observability: health map, request journeys, logs, SLOs, alerts, incidents).
  observability:
    # The bundled open-source stack: an OpenTelemetry Collector, Prometheus, Loki and Tempo (single replicas; their
    # data on emptyDir unless persistence is on). Off: send to your own backend with otlp.endpoint instead.
    enabled: false
    environment: production
    otlp:
      # Your own OTLP/HTTP endpoint (a Collector, Grafana Cloud, Honeycomb, Datadog, New Relic). Empty: the bundled
      # Collector when enabled, else telemetry is off. Its credentials: a Secret whose key holds
      # OTEL_EXPORTER_OTLP_HEADERS (name=value,name2=value2), e.g. x-honeycomb-team=<key>.
      endpoint: ""
      headersSecret: ""
      headersKey: headers
    sampling:
      # Parent-based: a request that arrives sampled (from Trino, a browser, another service) is always followed.
      sampler: parentbased_traceidratio
      ratio: "0.1"
    # Where Cairn reads telemetry back. Empty with enabled: the bundled Prometheus, Loki and Tempo. Vendors without
    # these APIs: traceUrl / logsUrl templates ({trace_id}, {service}, {start_ms}, {end_ms}) that Cairn links to.
    # credentialsSecret: keys prometheus-token, prometheus-basic-auth (user:password), loki-..., tempo-...
    read:
      prometheusUrl: ""
      lokiUrl: ""
      tempoUrl: ""
      traceUrl: ""
      logsUrl: ""
      vendor: ""
      credentialsSecret: ""
    # Trino's own spans (its planning, its calls to Cairn's access control) to the Collector's OTLP gRPC port. They
    # carry Trino's key in the access-control URLs: send them only through a Collector that removes it (the bundled
    # one does: deploy/observability/stack/otel-collector.yaml, processor transform/urls).
    trino:
      enabled: true
      endpoint: ""          # empty: the bundled Collector (grpc, 4317)
    # Cairn Core and its web application through the OpenTelemetry Java agent (JAVA_TOOL_OPTIONS), copied in from
    # this image by an init container. SQL statements are sanitized by the agent; query strings go at the Collector.
    javaAgent:
      enabled: true
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.32.0
    # OTLP destinations configured in Cairn (Observability -> Export; kind observability_exporters), exported by the
    # bundled Collector after its redaction: exportersConfig is the fragment GET /v1/observability/exporters/
    # collector-config gives (helm upgrade --set-file cairn.observability.exportersConfig=exporters.yaml), and
    # exportersSecret a Secret holding the variables it names (CAIRN_EXPORTER_<ID>_<N>: the header values). A
    # pipeline in it without Cairn's redaction processors is refused.
    exportersConfig: ""
    exportersSecret: ""
    # With networkPolicy on, namespaces whose pods may send OTLP to the Collector (Airflow's, managed Airflow
    # deployments'); this release's own pods always may.
    collectorFromNamespaces: []
    collector:
      image: otel/opentelemetry-collector-contrib:0.163.2
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 1Gi }
    prometheus:
      image: prom/prometheus:v3.15.1
      retention: 15d
      persistence: { enabled: false, size: 20Gi, storageClass: "" }
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { memory: 2Gi }
    loki:
      image: grafana/loki:3.6.18
      persistence: { enabled: false, size: 20Gi, storageClass: "" }
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 1Gi }
    tempo:
      image: grafana/tempo:2.9.5
      persistence: { enabled: false, size: 20Gi, storageClass: "" }
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 2Gi }

  serviceMonitor:
    # ServiceMonitor for the HTTP services and a PodMonitor for the workers (metrics on port 9108).
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    # Cairn's alert rules (deploy/observability/cairn-alerts.yaml) as a PrometheusRule.
    enabled: false
    labels: {}
  grafanaDashboard:
    # The Cairn overview dashboard as a ConfigMap, picked up by the Grafana sidecar.
    enabled: false
    labels: {grafana_dashboard: "1"}

  serviceAccount:
    create: true
    name: ""
    annotations: {}
