{{- if .Values.cairn.mlflow.enabled }}
{{- with .Values.cairn.mlflow.servingKubernetes }}
{{- if .enabled }}
{{- /* Managed model serving on Kubernetes: Cairn's API account may manage the model servers' objects in their
       namespace, and nothing else there (cairn.ml.serving.KubeRuntime). */}}
{{- $ctx := dict "root" $ "component" "models" "cfg" $.Values.cairn.api }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cairn.componentName" $ctx }}
  namespace: {{ .namespace }}
  labels:
    {{- include "cairn.componentLabels" $ctx | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cairn.componentName" $ctx }}
  namespace: {{ .namespace }}
  labels:
    {{- include "cairn.componentLabels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cairn.componentName" $ctx }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cairn.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
