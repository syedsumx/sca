{{- if .Values.cairn.gateway.enabled }}
{{- $gw := .Values.cairn.gateway }}
{{- $sharedKeys := ne $gw.keys.existingSecret "" }}
{{- /* Without a shared key Secret the identity lives on a RWO PVC → single replica, no HPA. */}}
{{- $cfg := $gw }}
{{- if not $sharedKeys }}
{{- $cfg = merge (dict "autoscaling" (dict "enabled" false) "pdb" (dict "enabled" false)) (omit $gw "autoscaling" "pdb") }}
{{- end }}
{{- $volumes := list }}
{{- if $sharedKeys }}
{{- $volumes = list (dict "name" "gateway-keys" "secret" (dict "secretName" $gw.keys.existingSecret "defaultMode" 0400)) }}
{{- else }}
{{- $volumes = list (dict "name" "gateway-keys" "persistentVolumeClaim" (dict "claimName" (printf "%s-gateway-keys" (include "cairn.fullname" $)))) }}
{{- end }}
{{- $mounts := list (dict "name" "gateway-keys" "mountPath" "/var/lib/cairn/keys" "readOnly" $sharedKeys) }}
{{- /* TLS on the gateway itself and, with a client CA, mutual TLS: agents without a certificate from it are refused. */}}
{{- $tls := default dict $gw.tls }}
{{- $env := list }}
{{- if and $tls.clientCaSecret (not $tls.secretName) }}
{{- fail "cairn.gateway.tls.clientCaSecret needs cairn.gateway.tls.secretName: mutual TLS is TLS first" }}
{{- end }}
{{- if $tls.secretName }}
{{- $volumes = append $volumes (dict "name" "gateway-tls" "secret" (dict "secretName" $tls.secretName "defaultMode" 0400)) }}
{{- $mounts = append $mounts (dict "name" "gateway-tls" "mountPath" "/etc/cairn/gateway-tls" "readOnly" true) }}
{{- $env = append $env (dict "name" "CAIRN_GATEWAY_TLS_CERT" "value" "/etc/cairn/gateway-tls/tls.crt") }}
{{- $env = append $env (dict "name" "CAIRN_GATEWAY_TLS_KEY" "value" "/etc/cairn/gateway-tls/tls.key") }}
{{- end }}
{{- if $tls.clientCaSecret }}
{{- $volumes = append $volumes (dict "name" "gateway-client-ca" "secret" (dict "secretName" $tls.clientCaSecret "defaultMode" 0444)) }}
{{- $mounts = append $mounts (dict "name" "gateway-client-ca" "mountPath" "/etc/cairn/gateway-client-ca" "readOnly" true) }}
{{- $env = append $env (dict "name" "CAIRN_GATEWAY_CLIENT_CA" "value" (printf "/etc/cairn/gateway-client-ca/%s" (default "ca.crt" $tls.clientCaKey))) }}
{{- end }}
{{- /* The identity wrapped by a key manager (Vault transit, AWS KMS): its settings and credential files. */}}
{{- $kms := default dict $gw.keys.kms }}
{{- if $kms.secretName }}
{{- $volumes = append $volumes (dict "name" "gateway-kms" "secret" (dict "secretName" $kms.secretName "defaultMode" 0400)) }}
{{- $mounts = append $mounts (dict "name" "gateway-kms" "mountPath" "/etc/cairn/gateway-kms" "readOnly" true) }}
{{- $env = append $env (dict "name" "CAIRN_GATEWAY_KEY_KMS" "value" (printf "@/etc/cairn/gateway-kms/%s" (default "kms.json" $kms.configKey))) }}
{{- end }}
{{- $ctx := dict "root" $ "component" "gateway" "cfg" $cfg "replicas" (ternary $gw.replicas 1 $sharedKeys) "recreate" (not $sharedKeys) "port" (int $gw.port) "args" (list "gateway" "--host" "0.0.0.0" "--port" (toString $gw.port)) "extraVolumes" $volumes "extraVolumeMounts" $mounts "extraEnv" $env "tcpProbes" (not (empty $tls.secretName)) }}
{{ include "cairn.deployment" $ctx }}
---
{{ include "cairn.service" (merge (dict "port" $gw.port "type" $gw.service.type "annotations" $gw.service.annotations) $ctx) }}
{{- with (include "cairn.hpa" $ctx) }}
---
{{ . }}
{{- end }}
{{- with (include "cairn.pdb" $ctx) }}
---
{{ . }}
{{- end }}
{{- if not $sharedKeys }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-gateway-keys" (include "cairn.fullname" $) }}
  labels:
    {{- include "cairn.componentLabels" $ctx | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $gw.keys.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $gw.keys.persistence.size }}
{{- end }}
{{- if $gw.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cairn.componentName" $ctx }}
  labels:
    {{- include "cairn.componentLabels" $ctx | nindent 4 }}
  {{- with $gw.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $gw.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $gw.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $gw.ingress.host | quote }}
      http:
        paths:
          # Only the agent protocol is exposed; admin endpoints stay on cairn-api.
          - path: /agents
            pathType: Prefix
            backend:
              service:
                name: {{ include "cairn.componentName" $ctx }}
                port:
                  name: http
{{- end }}
{{- end }}
