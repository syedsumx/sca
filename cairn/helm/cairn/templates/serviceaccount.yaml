{{- if .Values.cairn.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cairn.serviceAccountName" . }}
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
  {{- with .Values.cairn.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
