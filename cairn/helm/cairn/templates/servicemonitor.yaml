{{- if .Values.cairn.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cairn.fullname" . }}
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
    {{- with .Values.cairn.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: cairn
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      # The store serves its metrics at /-/metrics (below).
      - {key: app.kubernetes.io/component, operator: NotIn, values: [store]}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.cairn.serviceMonitor.interval }}
{{- if .Values.cairn.store.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cairn.fullname" . }}-store
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
    {{- with .Values.cairn.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: cairn
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: store
  endpoints:
    - port: http
      path: /-/metrics
      interval: {{ .Values.cairn.serviceMonitor.interval }}
      {{- if .Values.cairn.store.tlsSecret }}
      scheme: https
      {{- end }}
{{- end }}
{{- end }}
