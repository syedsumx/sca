{{- range $job := .Values.cairn.dbt.jobs }}
{{- $ctx := dict "root" $ "component" (printf "dbt-%s" $job.name) "cfg" $job }}
{{- if not $.Values.cairn.trino.enabled }}{{ fail "cairn.dbt.jobs run on Trino: set cairn.trino.enabled" }}{{ end }}
{{- if not $.Values.cairn.trino.tls.secretName }}{{ fail "cairn.dbt.jobs sign in to Trino over TLS: set cairn.trino.tls.secretName" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,30}[a-z0-9])?$" (toString $job.name)) }}{{ fail (printf "cairn.dbt.jobs: name %q is 1-32 lowercase letters, digits and -" (toString $job.name)) }}{{ end }}
{{- $wi := $job.workloadIdentity }}
{{- if and $wi $job.tokenSecret }}{{ fail (printf "cairn.dbt.jobs[%s]: tokenSecret or workloadIdentity, not both" $job.name) }}{{ end }}
{{- if and $wi (not $.Values.cairn.workloadIdentity.issuers) }}{{ fail (printf "cairn.dbt.jobs[%s].workloadIdentity needs cairn.workloadIdentity.issuers" $job.name) }}{{ end }}
{{- $tok := $job.tokenSecret }}
{{- if not $wi }}{{ $tok = required (printf "cairn.dbt.jobs[%s].tokenSecret (the pipeline user's Cairn token) or workloadIdentity" $job.name) $job.tokenSecret }}{{ end }}
{{- $api := dict "root" $ "component" "api" "cfg" $.Values.cairn.api }}
{{- $trino := dict "root" $ "component" "trino" "cfg" $.Values.cairn.trino }}
---
# dbt project {{ $job.name }}: `cairn dbt` signs in as the pipeline user and records each run in Cairn.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cairn.componentName" $ctx }}
  labels:
    {{- include "cairn.componentLabels" $ctx | nindent 4 }}
spec:
  schedule: {{ required (printf "cairn.dbt.jobs[%s].schedule" $job.name) $job.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ $job.timeoutSeconds | default 7200 }}
      template:
        metadata:
          labels:
            {{- include "cairn.componentLabels" $ctx | nindent 12 }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          {{- with $wi }}
          serviceAccountName: {{ required (printf "cairn.dbt.jobs[%s].workloadIdentity.serviceAccount" $job.name) .serviceAccount | quote }}
          {{- end }}
          {{- with $.Values.global.cairn.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.cairn.podSecurityContext | nindent 12 }}
          containers:
            - name: dbt
              image: {{ required (printf "cairn.dbt.jobs[%s].image: the project's image (FROM cairn/dbt)" $job.name) $job.image | quote }}
              imagePullPolicy: IfNotPresent
              args:
                {{- range ($job.args | default (list "build")) }}
                - {{ . | quote }}
                {{- end }}
              env:
                - name: CAIRN_URL
                  value: {{ printf "http://%s:%v" (include "cairn.componentName" $api) $.Values.cairn.api.port | quote }}
                {{- if $wi }}
                # The service account's token (for audience cairn, rotated by the kubelet), exchanged at Cairn.
                - name: CAIRN_WORKLOAD_TOKEN_FILE
                  value: /var/run/secrets/cairn/token
                {{- else }}
                - name: CAIRN_TOKEN
                  valueFrom:
                    secretKeyRef: { name: {{ $tok.name }}, key: {{ $tok.key | default "token" }} }
                {{- end }}
                - name: CAIRN_TRINO_HOST
                  value: {{ include "cairn.componentName" $trino | quote }}
                - name: CAIRN_TRINO_PORT
                  value: {{ $.Values.cairn.trino.tls.httpsPort | quote }}
                - name: CAIRN_TRINO_CATALOG
                  value: lakehouse
                - name: CAIRN_DBT_SCHEMA
                  value: {{ $job.schema | default "analytics" | quote }}
                - name: CAIRN_DBT_THREADS
                  value: {{ $job.threads | default 4 | quote }}
                # The environment runs are recorded in (its last successful run is its state).
                - name: CAIRN_DBT_ENVIRONMENT
                  value: {{ $job.environment | default "prod" | quote }}
                {{- with $job.deferTo }}
                - name: CAIRN_DBT_DEFER_TO
                  value: {{ . | quote }}
                {{- end }}
                {{- with $.Values.cairn.dbt.packageHubUrl }}
                - name: CAIRN_DBT_PACKAGE_HUB_URL
                  value: {{ . | quote }}
                {{- end }}
                {{- if $job.caSecret }}
                - name: CAIRN_CA_FILE
                  value: /etc/cairn-dbt-ca/ca.crt
                {{- end }}
                {{- with $job.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml ($job.resources | default $.Values.cairn.dbt.resources) | nindent 16 }}
              securityContext:
                {{- toYaml $.Values.cairn.containerSecurityContext | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp/cairn
                {{- if $wi }}
                - name: cairn-identity
                  mountPath: /var/run/secrets/cairn
                  readOnly: true
                {{- end }}
                {{- if $job.caSecret }}
                - name: ca
                  mountPath: /etc/cairn-dbt-ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            {{- with $wi }}
            - name: cairn-identity
              projected:
                sources:
                  - serviceAccountToken:
                      audience: {{ .audience | default "cairn" | quote }}
                      expirationSeconds: {{ .expirationSeconds | default 3600 }}
                      path: token
            {{- end }}
            {{- if $job.caSecret }}
            - name: ca
              secret:
                secretName: {{ $job.caSecret.name }}
                items:
                  - key: {{ $job.caSecret.key | default "ca.crt" }}
                    path: ca.crt
            {{- end }}
{{- end }}
