{{- if .Values.cairn.mcp.enabled }}
{{- $ctx := dict "root" $ "component" "mcp" "cfg" .Values.cairn.mcp "replicas" .Values.cairn.mcp.replicas "port" (int .Values.cairn.mcp.port) "args" (list "mcp" "--transport" "streamable-http" "--host" "0.0.0.0" "--port" (toString .Values.cairn.mcp.port)) }}
{{ include "cairn.deployment" $ctx }}
---
{{ include "cairn.service" (merge (dict "port" .Values.cairn.mcp.port) $ctx) }}
{{- end }}
