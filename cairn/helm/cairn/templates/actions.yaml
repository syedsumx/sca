{{- $cm := printf "%s-actions" (include "cairn.fullname" $) }}
{{- $pipelines := dict "pii-propagation" (dict "cfg" .Values.cairn.actions.piiPropagation "file" "pii_propagation.yml") "vector-indexer" (dict "cfg" .Values.cairn.actions.vectorIndexer "file" "vector_indexer.yml") "label-propagation" (dict "cfg" .Values.cairn.actions.labelPropagation "file" "label_propagation.yml") }}
{{- $any := or .Values.cairn.actions.piiPropagation.enabled .Values.cairn.actions.vectorIndexer.enabled .Values.cairn.actions.labelPropagation.enabled }}
{{- if $any }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cm }}
  labels:
    {{- include "cairn.labels" $ | nindent 4 }}
data:
  {{- ($.Files.Glob "files/actions/*.yml").AsConfig | nindent 2 }}
{{- end }}
{{- range $name, $p := $pipelines }}
{{- if $p.cfg.enabled }}
---
{{- $ctx := dict "root" $ "component" (printf "actions-%s" $name) "cfg" $p.cfg "replicas" $p.cfg.replicas "command" (list "/opt/cairn/bin/dumb-init" "--" "/opt/cairn/bootstrap/with-token.sh") "args" (list "actions" "-c" (printf "/etc/cairn/actions/%s" $p.file)) "extraEnv" (list (dict "name" "CAIRN_RESTART_ON_TOKEN_CHANGE" "value" "1")) "extraVolumes" (list (dict "name" "actions" "configMap" (dict "name" $cm))) "extraVolumeMounts" (list (dict "name" "actions" "mountPath" "/etc/cairn/actions" "readOnly" true)) }}
{{ include "cairn.deployment" $ctx }}
{{- end }}
{{- end }}
