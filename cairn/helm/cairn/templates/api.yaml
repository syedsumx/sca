{{- if .Values.cairn.api.enabled }}
{{- /* SCIM: the provisioning account's token (only this component mounts it) and the identity
       provider's SCIM bearer token (cairn.scim.tokenSecret). */ -}}
{{- $scimEnv := list (dict "name" "CAIRN_SCIM_CORE_TOKEN_FILE" "value" "/run/cairn-provisioner/provisioner_token") }}
{{- with .Values.cairn.scim.tokenSecret }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_SCIM_TOKEN_FILE" "value" "/run/cairn-scim/token") }}
{{- end }}
{{- /* Cairn Store administration (Settings → Storage): the store's admin key, from the store's Secret. */ -}}
{{- if .Values.cairn.store.enabled }}
{{- $s := .Values.cairn.store.secret }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_STORE_URL" "value" (printf "http%s://%s-store:%v" (ternary "s" "" (not (empty .Values.cairn.store.tlsSecret))) (include "cairn.fullname" .) .Values.cairn.store.port)) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_STORE_ADMIN_ACCESS_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" $s.name "key" $s.accessKeyKey))) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_STORE_ADMIN_SECRET_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" $s.name "key" $s.secretKeyKey))) }}
{{- end }}
{{- $mounts := list (dict "name" "provisioner-token" "mountPath" "/run/cairn-provisioner" "readOnly" true) }}
{{- $vols := list (dict "name" "provisioner-token" "secret" (dict "secretName" (include "cairn.provisionerTokenSecret" .) "optional" true "items" (list (dict "key" "provisioner_token" "path" "provisioner_token")))) }}
{{- with .Values.cairn.scim.tokenSecret }}
{{- $mounts = append $mounts (dict "name" "scim-token" "mountPath" "/run/cairn-scim" "readOnly" true) }}
{{- $vols = append $vols (dict "name" "scim-token" "secret" (dict "secretName" .name "items" (list (dict "key" .key "path" "token")))) }}
{{- end }}
{{- $ctx := dict "root" $ "component" "api" "cfg" .Values.cairn.api "replicas" .Values.cairn.api.replicas "port" (int .Values.cairn.api.port) "args" (list "api" "--host" "0.0.0.0" "--port" (toString .Values.cairn.api.port)) "extraEnv" $scimEnv "extraVolumeMounts" $mounts "extraVolumes" $vols }}
{{ include "cairn.deployment" $ctx }}
---
{{ include "cairn.service" (merge (dict "port" .Values.cairn.api.port) $ctx) }}
{{- with (include "cairn.hpa" $ctx) }}
---
{{ . }}
{{- end }}
{{- with (include "cairn.pdb" $ctx) }}
---
{{ . }}
{{- end }}
{{- if .Values.cairn.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cairn.componentName" $ctx }}
  labels:
    {{- include "cairn.componentLabels" $ctx | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- with .Values.cairn.api.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.cairn.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.cairn.api.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.cairn.api.ingress.host | quote }}
      http:
        paths:
          - path: {{ printf "%s(/|$)(.*)" (trimSuffix "/" .Values.cairn.api.ingress.path) }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "cairn.componentName" $ctx }}
                port:
                  name: http
{{- end }}
{{- end }}
