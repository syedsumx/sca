{{- if .Values.cairn.api.enabled }}
{{- /* SCIM: the provisioning account's token (only this component mounts it) and the identity
       provider's SCIM bearer token (cairn.scim.tokenSecret). */ -}}
{{- $scimEnv := list (dict "name" "CAIRN_SCIM_CORE_TOKEN_FILE" "value" "/run/cairn-provisioner/provisioner_token") }}
{{- with .Values.cairn.scim.tokenSecret }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_SCIM_TOKEN_FILE" "value" "/run/cairn-scim/token") }}
{{- end }}
{{- /* Trino access control: the key Trino presents when it asks Cairn (cairn.trino.accessKeySecret). */ -}}
{{- if .Values.cairn.trino.enabled }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_TRINO_ACCESS_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.cairn.trino.accessKeySecret.name "key" .Values.cairn.trino.accessKeySecret.key))) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_TRINO_TOKEN_ISSUER" "value" .Values.cairn.trino.tokenIssuer) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_TRINO_TOKEN_TTL" "value" (printf "%v" .Values.cairn.trino.tokenTtlSeconds)) }}
{{- /* Other databases' catalogs in Trino, named to Cairn as their platform's datasets. */ -}}
{{- if or .Values.cairn.trino.federation .Values.cairn.trino.delta.enabled }}
{{- $map := dict }}
{{- range .Values.cairn.trino.federation }}{{ $_ := set $map .name (dict "platform" (required "cairn.trino.federation[].platform" .platform) "database" (.database | default "")) }}{{ end }}
{{- if .Values.cairn.trino.delta.enabled }}{{ $_ := set $map "delta" (dict "platform" "delta-lake" "database" "") }}{{ end }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_TRINO_CATALOGS" "value" (toJson $map)) }}
{{- end }}
{{- if .Values.cairn.trino.externalCatalogs.enabled }}
{{- $trinoApi := printf "http://%s:%v" (include "cairn.componentName" (dict "root" $ "component" "api" "cfg" .Values.cairn.api)) .Values.cairn.api.port }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_EXTERNAL_CATALOGS_BROKER_URL" "value" $trinoApi) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_EXTERNAL_CATALOGS_TRINO_CONNECTION" "value" .Values.cairn.trino.externalCatalogs.connection) }}
{{- end }}
{{- if .Values.cairn.trino.sso.enabled }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_TRINO_OAUTH_SECRET" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.cairn.trino.accessKeySecret.name "key" .Values.cairn.trino.sso.clientSecretKey))) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_TRINO_OAUTH_REDIRECT_URIS" "value" (printf "%s/oauth2/callback" (trimSuffix "/" .Values.cairn.trino.sso.publicUrl))) }}
{{- end }}
{{- end }}
{{- /* Lakehouse tables in Spark's lineage: Cairn Catalog's addresses as engines name it. */ -}}
{{- if and .Values.cairn.catalog.enabled .Values.cairn.catalog.identity.enabled }}
{{- $cat := dict "root" $ "component" "catalog" "cfg" .Values.cairn.catalog }}
{{- $uris := list (printf "http://%s:%v" (include "cairn.componentName" $cat) .Values.cairn.catalog.port) }}
{{- with .Values.cairn.catalog.identity.publicUrl }}{{ $uris = append $uris . }}{{ end }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_LAKEHOUSE_CATALOG_URIS" "value" (join "," $uris)) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_LAKEHOUSE_TOKEN_TTL" "value" (toString .Values.cairn.catalog.identity.tokenTtlSeconds)) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_LAKEHOUSE_MAX_SESSION" "value" (toString .Values.cairn.catalog.identity.maxSessionSeconds)) }}
{{- with .Values.cairn.catalog.identity.shares }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_SHARES_CATALOG_URL" "value" (.catalogUrl | default $.Values.cairn.catalog.identity.publicUrl)) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_SHARES_TOKEN_URL" "value" .tokenUrl) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_SHARES_TOKEN_TTL" "value" (toString .tokenTtlSeconds)) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_SHARES_MAX_DAYS" "value" (toString .maxDays)) }}
{{- end }}
{{- end }}
{{- with .Values.cairn.workloadIdentity.issuers }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_WORKLOAD_ISSUERS" "value" (toJson .)) }}
{{- end }}
{{- /* Spark's history server, served behind Cairn's sign-in at /v1/spark/history/. */ -}}
{{- if and .Values.cairn.spark.enabled .Values.cairn.spark.historyServer.enabled }}
{{- $hs := dict "root" $ "component" "spark-history" "cfg" .Values.cairn.spark.historyServer }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_SPARK_HISTORY_URL" "value" (printf "http://%s.%s:18080" (include "cairn.componentName" $hs) (.Values.cairn.spark.namespace | default .Release.Namespace))) }}
{{- end }}
{{- /* Cairn Store administration (Settings → Storage): the store's admin key, from the store's Secret. */ -}}
{{- if .Values.cairn.store.enabled }}
{{- $s := .Values.cairn.store.secret }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_STORE_URL" "value" (printf "http%s://%s-store:%v" (ternary "s" "" (not (empty .Values.cairn.store.tlsSecret))) (include "cairn.fullname" .) .Values.cairn.store.port)) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_STORE_ADMIN_ACCESS_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" $s.name "key" $s.accessKeyKey))) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_STORE_ADMIN_SECRET_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" $s.name "key" $s.secretKeyKey))) }}
{{- end }}
{{- $mounts := list (dict "name" "provisioner-token" "mountPath" "/run/cairn-provisioner" "readOnly" true) }}
{{- $vols := list (dict "name" "provisioner-token" "secret" (dict "secretName" (include "cairn.provisionerTokenSecret" .) "optional" true "items" (list (dict "key" "provisioner_token" "path" "provisioner_token")))) }}
{{- with .Values.cairn.scim.tokenSecret }}
{{- $mounts = append $mounts (dict "name" "scim-token" "mountPath" "/run/cairn-scim" "readOnly" true) }}
{{- $vols = append $vols (dict "name" "scim-token" "secret" (dict "secretName" .name "items" (list (dict "key" .key "path" "token")))) }}
{{- end }}
{{- if .Values.cairn.streams.enabled }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_STREAMS_ENABLED" "value" "true") }}
{{- end }}
{{- /* AI functions in SQL through Cairn (cairn.ai.sql_gateway): the provider, its key, models and limits. */ -}}
{{- $ai := .Values.cairn.trino.ai }}
{{- if and .Values.cairn.trino.enabled $ai.enabled $ai.viaCairn }}
{{- $upstream := $ai.endpoint | default (ternary "https://api.anthropic.com" "https://api.openai.com" (eq $ai.provider "anthropic")) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_AI_SQL_UPSTREAM" "value" $upstream) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_AI_SQL_PROVIDER" "value" $ai.provider) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_AI_SQL_API_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" (required "cairn.trino.ai.apiKeySecret.name" $ai.apiKeySecret.name) "key" ($ai.apiKeySecret.key | default "api-key")))) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_AI_SQL_MODELS" "value" (join "," (prepend ($ai.allowedModels | default list) $ai.model))) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_AI_SQL_RPM" "value" (toString $ai.callsPerMinute)) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_AI_SQL_USER_DAILY_QUERIES" "value" (toString $ai.userDailyQueries)) }}
{{- end }}
{{- /* JupyterHub: an OAuth client of Cairn's, kernels with the person's own Cairn token. */ -}}
{{- with .Values.cairn.notebooks.jupyterhub }}
{{- if .enabled }}
{{- if not .redirectUris }}{{ fail "cairn.notebooks.jupyterhub.redirectUris: the hub's https://<hub>/hub/oauth_callback" }}{{ end }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_JUPYTERHUB_OAUTH_SECRET" "valueFrom" (dict "secretKeyRef" (dict "name" (required "cairn.notebooks.jupyterhub.secret.name" .secret.name) "key" (.secret.key | default "client-secret")))) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_JUPYTERHUB_OAUTH_REDIRECT_URIS" "value" (join "," .redirectUris)) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_NOTEBOOK_TOKEN_TTL" "value" (toString .tokenTtlSeconds)) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_NOTEBOOK_DEFAULT_CATALOG" "value" .defaultCatalog) }}
{{- end }}
{{- end }}
{{- /* Data apps: where they may come from, and the Kubernetes runtime (templates/apps-kubernetes.yaml). */ -}}
{{- with .Values.cairn.apps }}
{{- if .gitUrls }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_APP_GIT_URLS" "value" (join "," .gitUrls)) }}
{{- end }}
{{- with .kubernetes }}
{{- if .enabled }}
{{- if and (eq .access "node-port") (not .nodeAddress) }}{{ fail "cairn.apps.kubernetes.nodeAddress: where Cairn reaches node ports" }}{{ end }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_APPS_K8S_NAMESPACE" "value" .namespace) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_APPS_K8S_ACCESS" "value" .access) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_APPS_K8S_NODE_ADDRESS" "value" .nodeAddress) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_APPS_K8S_CAIRN_NAMESPACE" "value" $.Release.Namespace) }}
{{- if .ingressFrom }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_APPS_K8S_INGRESS_FROM" "value" (toJson .ingressFrom)) }}
{{- end }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_APPS_K8S_GIT_IMAGE" "value" .gitImage) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_APPS_K8S_RESOURCES" "value" (toJson .resources)) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* MLflow behind Cairn (/v1/ml). */ -}}
{{- if .Values.cairn.mlflow.enabled }}
{{- $mlCtx := dict "root" $ "component" "mlflow" "cfg" .Values.cairn.mlflow }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_MLFLOW_URL" "value" (printf "http://%s:5000" (include "cairn.componentName" $mlCtx))) }}
{{- $mlServing := deepCopy (.Values.cairn.mlflow.serving | default dict) }}
{{- range (default dict .Values.cairn.mlflow.modelServers).items | default list }}
{{- $_ := set $mlServing (toString .model) (printf "http://%s:8080" (include "cairn.componentName" (dict "root" $ "component" (printf "model-%s" .name)))) }}
{{- end }}
{{- with $mlServing }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_ML_SERVING" "value" (toJson .)) }}
{{- end }}
{{- with .Values.cairn.mlflow.servingKubernetes }}
{{- if .enabled }}
{{- if and (eq .access "node-port") (not .nodeAddress) }}{{ fail "cairn.mlflow.servingKubernetes.nodeAddress: where Cairn reaches node ports" }}{{ end }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_ML_SERVING_RUNTIME" "value" "kubernetes") }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_ML_SERVING_K8S_NAMESPACE" "value" .namespace) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_ML_SERVING_K8S_IMAGE" "value" .image) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_ML_SERVING_K8S_ACCESS" "value" .access) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_ML_SERVING_K8S_NODE_ADDRESS" "value" .nodeAddress) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_ML_SERVING_K8S_CAIRN_NAMESPACE" "value" $.Release.Namespace) }}
{{- if .ingressFrom }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_ML_SERVING_K8S_INGRESS_FROM" "value" (toJson .ingressFrom)) }}
{{- end }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_ML_SERVING_K8S_RESOURCES" "value" (toJson .resources)) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Warehouse status (GET /v1/warehouses): the warehouse proxy and each warehouse's port. */ -}}
{{- if and .Values.cairn.trino.enabled .Values.cairn.trino.warehouses.list }}
{{- $whPorts := dict }}
{{- range .Values.cairn.trino.warehouses.list }}{{ $_ := set $whPorts .name (int .port) }}{{ end }}
{{- $whCtx := dict "root" $ "component" "warehouses" "cfg" .Values.cairn.trino.warehouses.proxy }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_WAREHOUSES_URL" "value" (printf "%s://%s" (ternary "https" "http" (not (empty .Values.cairn.trino.tls.secretName))) (include "cairn.componentName" $whCtx))) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_WAREHOUSE_PORTS" "value" (toJson $whPorts)) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_WAREHOUSES_CONTROL_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.cairn.trino.accessKeySecret.name "key" .Values.cairn.trino.accessKeySecret.key))) }}
{{- with .Values.cairn.trino.warehouses.usdPerNodeHour }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_COST_WAREHOUSE_USD_PER_NODE_HOUR" "value" (toString .)) }}
{{- end }}
{{- end }}
{{- /* Operational databases (POST /v1/databases): a PostgreSQL server Cairn administers. */ -}}
{{- with .Values.cairn.databases }}{{ if .enabled }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_DATABASES_ADMIN_URL" "valueFrom" (dict "secretKeyRef" (dict "name" (required "cairn.databases.adminUrlSecret.name" .adminUrlSecret.name) "key" (.adminUrlSecret.key | default "url")))) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_DATABASES_HOST" "value" (required "cairn.databases.host" .host)) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_DATABASES_PORT" "value" (toString (.port | default 5432))) }}
{{- $scimEnv = append $scimEnv (dict "name" "CAIRN_DATABASES_SSLMODE" "value" (.sslmode | default "require")) }}
{{- end }}{{ end }}
{{- /* Managed Postgres (L140): instances on CloudNativePG or Docker. */ -}}
{{- $scimEnv = concat $scimEnv (include "cairn.pgInstancesEnv" . | fromJsonArray) }}
{{- $ctx := dict "root" $ "component" "api" "cfg" .Values.cairn.api "replicas" .Values.cairn.api.replicas "port" (int .Values.cairn.api.port) "args" (list "api" "--host" "0.0.0.0" "--port" (toString .Values.cairn.api.port)) "extraEnv" $scimEnv "extraVolumeMounts" $mounts "extraVolumes" $vols }}
{{ include "cairn.deployment" $ctx }}
---
{{ include "cairn.service" (merge (dict "port" .Values.cairn.api.port) $ctx) }}
{{- with (include "cairn.hpa" $ctx) }}
---
{{ . }}
{{- end }}
{{- with (include "cairn.pdb" $ctx) }}
---
{{ . }}
{{- end }}
{{- if .Values.cairn.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cairn.componentName" $ctx }}
  labels:
    {{- include "cairn.componentLabels" $ctx | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- with .Values.cairn.api.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.cairn.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.cairn.api.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.cairn.api.ingress.host | quote }}
      http:
        paths:
          - path: {{ printf "%s(/|$)(.*)" (trimSuffix "/" .Values.cairn.api.ingress.path) }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "cairn.componentName" $ctx }}
                port:
                  name: http
{{- end }}
{{- end }}
