{{- with .Values.cairn.nifiDeployments }}
{{- if eq .runtime "kubernetes" }}
{{- /* Managed NiFi on Kubernetes (cairn.nifi.k8s_runtime): Cairn makes a namespace per deployment
       (<namespacePrefix><name>) and applies its own render there (a StatefulSet, Services, a NetworkPolicy, a Secret
       of files). Its account may manage those kinds; an admission policy refuses any change it asks for outside
       namespaces with the prefix. Secrets are written, never read or listed. */}}
{{- $ctx := dict "root" $ "component" "nifi-deployments" "cfg" $.Values.cairn.api }}
{{- $name := include "cairn.componentName" $ctx }}
{{- $sa := printf "system:serviceaccount:%s:%s" $.Release.Namespace (include "cairn.serviceAccountName" $) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "cairn.componentLabels" $ctx | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "cairn.componentLabels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cairn.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "cairn.componentLabels" $ctx | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["", "apps", "networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE", "CONNECT"]
        resources: ["*/*"]
  matchConditions:
    - name: cairn
      expression: request.userInfo.username == {{ $sa | quote }}
  validations:
    - expression: >-
        (request.resource.resource == 'namespaces' ? request.name : request.namespace).startsWith({{ .kubernetes.namespacePrefix | quote }})
      message: {{ printf "Cairn manages NiFi deployments only in namespaces named %s<name>" .kubernetes.namespacePrefix | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "cairn.componentLabels" $ctx | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: ["Deny"]
{{- end }}
{{- end }}
