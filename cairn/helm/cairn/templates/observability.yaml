{{- /* The bundled observability stack (cairn.observability.enabled; docs: Administration -> Observability): an
OpenTelemetry Collector, Prometheus, Loki and Tempo, one replica each. Their configurations are copies of
deploy/observability/stack (tests keep them identical). */}}
{{- $o := .Values.cairn.observability }}
{{- if $o.enabled }}
{{- $base := include "cairn.fullname" . }}
{{- $sel := dict "app.kubernetes.io/name" (include "cairn.name" .) "app.kubernetes.io/instance" .Release.Name }}
{{- $pod := dict "runAsNonRoot" true "runAsUser" 10001 "runAsGroup" 10001 "fsGroup" 10001 "seccompProfile" (dict "type" "RuntimeDefault") }}
{{- $ctr := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) }}
{{- /* OTLP destinations configured in Cairn (GET /v1/observability/exporters/collector-config): the fragment is loaded
next to the bundled configuration, its header values come from exportersSecret. Fail closed: a pipeline that exports
without Cairn's redaction processors is refused here as Cairn refuses it. */}}
{{- $colArgs := list "--config=/etc/observability/otel-collector.yaml" }}
{{- with $o.exportersConfig }}
{{- $x := fromYaml . }}
{{- if hasKey $x "Error" }}{{ fail (printf "cairn.observability.exportersConfig is not YAML: %s" $x.Error) }}{{ end }}
{{- $pipes := dict }}{{ if $x.service }}{{ $pipes = $x.service.pipelines | default dict }}{{ end }}
{{- range $pid, $p := $pipes }}
{{- if $p.exporters }}
{{- $procs := $p.processors | default list }}
{{- $need := list "attributes/credentials" "redaction/values" }}
{{- if not (hasPrefix "metrics" $pid) }}{{ $need = append $need "transform/urls" }}{{ end }}
{{- range $need }}{{ if not (has . $procs) }}{{ fail (printf "cairn.observability.exportersConfig: pipeline %s exports without the redaction processor %s: refused" $pid .) }}{{ end }}{{ end }}
{{- end }}
{{- end }}
{{- $colArgs = append $colArgs "--config=/etc/observability/otel-exporters.yaml" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $base }}-observability
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
data:
  otel-collector.yaml: |
{{ .Files.Get "files/observability/otel-collector.yaml" | indent 4 }}
  tempo.yaml: |
{{ .Files.Get "files/observability/tempo.yaml" | indent 4 }}
  loki.yaml: |
{{ .Files.Get "files/observability/loki.yaml" | indent 4 }}
  {{- with $o.exportersConfig }}
  otel-exporters.yaml: |
{{ . | indent 4 }}
  {{- end }}
  prometheus.yml: |
    global: {scrape_interval: 15s, evaluation_interval: 15s}
    scrape_configs:
      # The Collector: every component's OTLP metrics, and the span metrics and service graph of their traces.
      - job_name: otel-collector
        static_configs: [{targets: ["{{ $base }}-otel-collector:8889"]}]
      # Cairn's own Prometheus endpoints (pods annotated prometheus.io/scrape), in this namespace only.
      - job_name: cairn-pods
        kubernetes_sd_configs: [{role: pod, namespaces: {names: ["{{ .Release.Namespace }}"]}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
          - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], action: keep, regex: "{{ .Release.Name }}"}
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, target_label: __metrics_path__, regex: "(.+)"}
          - {source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port], action: replace, regex: '([^:]+)(?::\d+)?;(\d+)', replacement: "$1:$2", target_label: __address__}
          - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component], target_label: job, replacement: "cairn-$1"}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
{{- range $name, $c := dict "otel-collector" (dict "image" $o.collector.image "resources" $o.collector.resources "args" $colArgs "ports" (list (dict "name" "otlp-grpc" "port" 4317) (dict "name" "otlp-http" "port" 4318) (dict "name" "metrics" "port" 8889) (dict "name" "health" "port" 13133)) "probe" (dict "path" "/" "port" "health") "data" "") "prometheus" (dict "image" $o.prometheus.image "resources" $o.prometheus.resources "args" (list "--config.file=/etc/observability/prometheus.yml" "--storage.tsdb.path=/data" (printf "--storage.tsdb.retention.time=%s" $o.prometheus.retention)) "ports" (list (dict "name" "http" "port" 9090)) "probe" (dict "path" "/-/ready" "port" "http") "data" "/data" "persistence" $o.prometheus.persistence) "loki" (dict "image" $o.loki.image "resources" $o.loki.resources "args" (list "-config.file=/etc/observability/loki.yaml") "ports" (list (dict "name" "http" "port" 3100)) "probe" (dict "path" "/ready" "port" "http") "data" "/loki" "persistence" $o.loki.persistence) "tempo" (dict "image" $o.tempo.image "resources" $o.tempo.resources "args" (list "-config.file=/etc/observability/tempo.yaml") "ports" (list (dict "name" "http" "port" 3200) (dict "name" "otlp-grpc" "port" 4317)) "probe" (dict "path" "/ready" "port" "http") "data" "/var/tempo" "persistence" $o.tempo.persistence) }}
{{- $labels := dict "app.kubernetes.io/component" $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $base }}-{{ $name }}
  labels:
    {{- include "cairn.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: 1
  strategy: { type: Recreate }        # one writer of its data
  selector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "cairn.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        checksum/config: {{ printf "%s%s%s%s" ($.Files.Get "files/observability/otel-collector.yaml") ($.Files.Get "files/observability/tempo.yaml") ($.Files.Get "files/observability/loki.yaml") ($o.exportersConfig | default "") | sha256sum | trunc 16 }}
    spec:
      {{- if eq $name "prometheus" }}
      serviceAccountName: {{ $base }}-prometheus
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        {{- toYaml $pod | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ $c.image }}
          args:
            {{- toYaml $c.args | nindent 12 }}
          {{- if eq $name "otel-collector" }}
          env:
            - name: CAIRN_OTEL_TEMPO
              value: "{{ $base }}-tempo:4317"
            - name: CAIRN_OTEL_LOKI
              value: "http://{{ $base }}-loki:3100"
          {{- if and $o.exportersConfig $o.exportersSecret }}
          envFrom:
            # The OTLP destinations' header values (CAIRN_EXPORTER_<ID>_<N>), never in the ConfigMap.
            - secretRef: { name: {{ $o.exportersSecret }} }
          {{- end }}
          {{- end }}
          ports:
            {{- range $c.ports }}
            - { name: {{ .name }}, containerPort: {{ .port }}, protocol: TCP }
            {{- end }}
          readinessProbe:
            httpGet: { path: {{ $c.probe.path }}, port: {{ $c.probe.port }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ $c.probe.path }}, port: {{ $c.probe.port }} }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml $ctr | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/observability, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if $c.data }}
            - { name: data, mountPath: {{ $c.data }} }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ $base }}-observability }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        {{- if $c.data }}
        - name: data
          {{- if $c.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ $base }}-{{ $name }} }
          {{- else }}
          emptyDir: { sizeLimit: {{ $c.persistence.size }} }
          {{- end }}
        {{- end }}
{{- if and $c.data $c.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $base }}-{{ $name }}
  labels:
    {{- include "cairn.labels" $ | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $c.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests: { storage: {{ $c.persistence.size }} }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $base }}-{{ $name }}
  labels:
    {{- include "cairn.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector:
    {{- toYaml $sel | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    {{- range $c.ports }}
    - { name: {{ .name }}, port: {{ .port }}, targetPort: {{ .name }}, protocol: TCP }
    {{- end }}
{{- if $.Values.cairn.networkPolicy.enabled }}
---
# {{ $name }}: only this release's pods (Cairn's components, Cairn Core, Trino; Prometheus scraping the Collector).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $base }}-{{ $name }}
  labels:
    {{- include "cairn.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $sel | nindent 14 }}
    {{- if and (eq $name "otel-collector") $o.collectorFromNamespaces }}
    # Airflow (and other senders) in these namespaces: OTLP only.
    - from:
        {{- range $o.collectorFromNamespaces }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ . }} }
        {{- end }}
      ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
    {{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $base }}-prometheus
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
automountServiceAccountToken: true      # pod discovery in this namespace (the Role below)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $base }}-prometheus
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $base }}-prometheus
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $base }}-prometheus
subjects:
  - kind: ServiceAccount
    name: {{ $base }}-prometheus
    namespace: {{ .Release.Namespace }}
{{- end }}
