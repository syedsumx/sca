image:
  repository: cairn/remote-agent
  tag: ""             # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicas: 1

gateway:
  # Public URL or PrivateLink / VPC-endpoint DNS name of the central Cairn gateway.
  url: https://cairn-gateway.example.com
  # Optional extra CA bundle (PEM) for TLS-inspecting egress proxies / private CAs.
  caBundle: ""

# Agent pool label (informational: the pool is bound server-side to the enrolment token). Execution
# requests with executorId=<pool> are routed to agents of that pool.
pool: default

# One-time enrolment token (POST /agents/pools/<pool>/enrollment-tokens). Used once; afterwards the agent
# authenticates with its own Ed25519 key kept in the state volume.
enrollment:
  existingSecret: ""          # Secret with key `token`; preferred
  token: ""                   # only for testing; rendered into a chart-managed Secret

agent:
  heartbeatIntervalSeconds: 15
  pollIntervalSeconds: 5
  maxParallelTasks: 2
  batch:
    maxItems: 500
    maxBytes: 1048576

# Where ${NAME} secret references in recipes are resolved. Nothing here ever leaves the VPC.
# Backends are tried in order (schema: cairn.agent.secrets.SecretResolver).
secretStores:
  - type: env
  - type: directory
    path: /run/secrets/cairn
  # - type: vault                     # KV v2: <mount>/data/<path>, key = secret NAME
  #   addr: https://vault.internal:8200
  #   mount: kv
  #   path: cairn/ingestion
  #   token_file: /vault/secrets/token  # e.g. written by the Vault agent injector
  # - type: aws_secrets_manager       # secret id = <prefix><NAME>; credentials via IRSA
  #   prefix: cairn/ingestion/
  #   region: eu-west-1

# Source credentials exposed to the agent as env vars (for `type: env`) …
sourceCredentialsEnvFrom: []
#   - secretRef:
#       name: finance-warehouse-creds
# … and/or as files under /run/secrets/cairn (for `type: directory`).
sourceCredentialsSecret: ""
#
# With External Secrets Operator, sync from your vault into the Secret referenced above, e.g.:
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata: { name: finance-warehouse-creds }
#   spec:
#     refreshInterval: 1h
#     secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
#     target: { name: finance-warehouse-creds }
#     dataFrom:
#       - extract: { key: cairn/ingestion/finance }

state:
  # Holds the agent's keypairs + spool. Use a PVC so a rescheduled pod keeps its identity
  # (an emptyDir forces re-enrolment on every restart, which needs a fresh token).
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  spoolSizeLimit: 512Mi

extraEnv: []

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 4Gi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: true
  # Egress allow-list. The agent needs: DNS, the gateway, and the data sources it ingests.
  gatewayCIDRs: []          # e.g. ["10.20.0.15/32"] for a PrivateLink endpoint; empty → any:443
  gatewayPort: 443
  sourceEgress: []
  #  - to: [{ ipBlock: { cidr: 10.30.0.0/16 } }]
  #    ports: [{ port: 5432, protocol: TCP }, { port: 443, protocol: TCP }]

serviceAccount:
  create: true
  name: ""
  annotations: {}            # e.g. eks.amazonaws.com/role-arn for AWS SM / IRSA

nodeSelector: {}
tolerations: []
affinity: {}
