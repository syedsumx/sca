<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --ink: #1d2330; --muted: #4f5868; --line: #d5dae2; --accent: #1f40a6; --error: #a4262c; }
    body { margin: 0; color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { padding: 12px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    h2 { font-size: 12px; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    label.check { display: inline-flex; gap: 4px; font-weight: 400; margin-right: 10px; }
    input[type=text], input[type=search], textarea { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid var(--line); border-radius: 4px; font: inherit; }
    button, a.button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
    .primary { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    ul { list-style: none; margin: 6px 0; padding: 0; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; }
    li button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .muted { color: var(--muted); }
    #status.error { color: var(--error); }
  </style>
</head>
<body>
<main>
  <h1>Cairn</h1>
  <section id="out" hidden>
    <p>Sign in to Cairn to use <code>=CAIRN_QUERY</code>, <code>=CAIRN_METRIC</code> and <code>=CAIRN_ASK</code>. Answers come back as you: masked and filtered as Cairn shows them to you.</p>
    <a id="sign-in" class="button primary" target="_blank" rel="noopener" href="#">Sign in to Cairn</a>
    <p class="muted">After signing in, come back and <button id="recheck" type="button">continue</button>.</p>
  </section>
  <section id="in" hidden>
    <p>Signed in as <strong id="who"></strong>. <button id="sign-out" type="button">Sign out</button></p>
    <h2>Governed metrics</h2>
    <label for="q">Find a metric</label>
    <input id="q" type="search" autocomplete="off" placeholder="revenue, orders…">
    <ul id="metrics" aria-live="polite"></ul>
    <form id="metric" hidden>
      <strong id="name"></strong>
      <p id="description" class="muted"></p>
      <fieldset><legend>Break down by</legend><div id="dims"></div></fieldset>
      <label for="filters">Filters <span class="muted">(e.g. region = EU)</span></label>
      <input id="filters" type="text" autocomplete="off">
      <div class="row">
        <button type="submit" class="primary" value="formula">Insert formula</button>
        <button type="submit" value="values">Insert values</button>
      </div>
    </form>
    <h2>SQL</h2>
    <label for="sql">A read-only query</label>
    <textarea id="sql" rows="4"></textarea>
    <div class="row"><button id="insert-sql" type="button" class="primary">Insert formula</button></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  var chosen = null, timer = null;
  function $(id) { return document.getElementById(id); }
  function status(text, error) { $('status').textContent = text || ''; $('status').className = error ? 'error' : ''; }
  function run(fn, args, ok) {
    var r = google.script.run.withSuccessHandler(ok || function () {}).withFailureHandler(function (e) { status(e.message, true); });
    return r[fn].apply(r, args || []);
  }
  function state() {
    run('sidebarState', [], function (s) {
      $('in').hidden = !s.signedIn; $('out').hidden = s.signedIn;
      if (s.signedIn) { $('who').textContent = s.person; metrics(''); }
      else { $('sign-in').href = s.signInUrl; if (s.error) status(s.error, true); }
    });
  }
  function metrics(q) {
    run('listMetrics', [q], function (list) {
      var ul = $('metrics'); ul.textContent = '';
      list.forEach(function (m) {
        var li = document.createElement('li'), b = document.createElement('button');
        b.type = 'button'; b.textContent = m.label + (m.certified ? ' ✓' : '');
        b.onclick = function () { pick(m); };
        li.appendChild(b); ul.appendChild(li);
      });
      if (!list.length) { var li = document.createElement('li'); li.className = 'muted'; li.textContent = 'No metric matches.'; ul.appendChild(li); }
    });
  }
  function pick(m) {
    chosen = m; $('metric').hidden = false;
    $('name').textContent = m.label + ' (' + m.name + ')'; $('description').textContent = m.description || '';
    var d = $('dims'); d.textContent = '';
    (m.dimensions || []).forEach(function (x, i) {
      var l = document.createElement('label'), c = document.createElement('input');
      c.type = 'checkbox'; c.value = x; c.id = 'd' + i; l.htmlFor = c.id; l.className = 'check';
      l.appendChild(c); l.appendChild(document.createTextNode(x)); d.appendChild(l);
    });
  }
  $('recheck').onclick = state;
  $('sign-out').onclick = function () { run('signOut', [], state); };
  $('q').oninput = function (e) { clearTimeout(timer); var q = e.target.value.trim(); timer = setTimeout(function () { metrics(q); }, 250); };
  $('metric').onsubmit = function (e) {
    e.preventDefault();
    var dims = Array.prototype.map.call(document.querySelectorAll('#dims input:checked'), function (c) { return c.value; }).join(', ');
    var filters = $('filters').value.trim();
    if (e.submitter && e.submitter.value === 'values') run('insertMetricValues', [chosen.name, dims, filters], function () { status('Inserted.'); });
    else run('insertFormula', ['metric', [chosen.name, dims, filters]], function () { status('Inserted.'); });
  };
  $('insert-sql').onclick = function () {
    var sql = $('sql').value.trim();
    if (sql) run('insertFormula', ['query', [sql]], function () { status('Inserted.'); });
  };
  state();
</script>
</body>
</html>
