<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cairn Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/*ANTD_CSS*/
</style>
<style>
  /* Single light theme: the workspace is styled to sit inside Cairn Core's light UI. */
  :root {
    color-scheme: light;
    --page: #F6F7F9;
    --ink: #0f172a;
    --banner-bg: #12152a;
    --banner-ink: #c9cdf0;
    --banner-rule: #232843;
  }
  html, body { background: var(--page); color: var(--ink); }
  body {
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    overflow-x: hidden;
  }
  .demo-banner {
    display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--banner-bg); color: var(--banner-ink);
    border-bottom: 1px solid var(--banner-rule); font-size: 13px; line-height: 1.4;
  }
  .demo-banner strong { font-weight: 600; letter-spacing: 0.02em; }
  #cairn-root { min-height: 100%; }
</style>
<div class="demo-banner" role="note">
  <strong>Cairn demo</strong>
  <span>Sample data for a fictional retailer. You are signed in as Alice Moreno (Finance analyst, admin). Changes you make last until you reload.</span>
</div>
<div id="cairn-root"></div>
<script>/*APP_JS*/</script>
