# Cairn Core micro-frontend config for the Cairn consumer workspace.
# cairn-web reads it once at startup (MFE_CONFIG_FILE_PATH) and serves it with a 5-minute
# browser cache: restart cairn-web after editing.
#
# remoteEntry is same-origin (served by cairn-consumer-ui behind the edge proxy / ingress at /cairn-ui/),
# so the workspace can call /api/v2/graphql and /cairn/api/* with the user's Cairn Core session cookie.
# Example copy of deploy/mfe/mfe.config.yaml (the file docker-compose mounts). The host route is
# /mfe/cairn; the workspace routes inside the URL hash: /mfe/cairn#/search?q=orders.
topLevelMenuTitle: Workspace
# false: each section is its own item in the left navigation, grouped under "Workspace".
subNavigationMode: false
loadTimeoutMs: 30000
# One bundle, one entry per section: the workspace opens on the section of the path it is mounted on
# (ui/src/consumer/hostNav.ts keeps the same list).
microFrontends:
  - id: CairnDiscover
    label: Discover
    path: /cairn
    remoteEntry: /cairn-ui/remoteEntry.js
    module: cairnConsumer/mount
    flags:
      enabled: true
      showInNav: true
    navIcon: Compass
  - id: CairnMarketplace
    label: Data marketplace
    path: /cairn-marketplace
    remoteEntry: /cairn-ui/remoteEntry.js
    module: cairnConsumer/mount
    flags:
      enabled: true
      showInNav: true
    navIcon: Storefront
  - id: CairnRequests
    label: Requests
    path: /cairn-requests
    remoteEntry: /cairn-ui/remoteEntry.js
    module: cairnConsumer/mount
    flags:
      enabled: true
      showInNav: true
    navIcon: Tray
  - id: CairnGovernance
    label: Governance studio
    path: /cairn-governance
    remoteEntry: /cairn-ui/remoteEntry.js
    module: cairnConsumer/mount
    flags:
      enabled: true
      showInNav: true
    navIcon: ShieldCheck
  - id: CairnContext
    label: Context inbox
    path: /cairn-context
    remoteEntry: /cairn-ui/remoteEntry.js
    module: cairnConsumer/mount
    flags:
      enabled: true
      showInNav: true
    navIcon: Lightbulb
  - id: CairnAssistant
    label: Assistant
    path: /cairn-assistant
    remoteEntry: /cairn-ui/remoteEntry.js
    module: cairnConsumer/mount
    flags:
      enabled: true
      showInNav: true
    navIcon: Sparkle
  - id: CairnSettings
    label: Workspace settings
    path: /cairn-settings
    remoteEntry: /cairn-ui/remoteEntry.js
    module: cairnConsumer/mount
    flags:
      enabled: true
      showInNav: true
    navIcon: Gear
