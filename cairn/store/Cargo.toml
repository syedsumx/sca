[package]
name = "cairn-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Cairn Store: Cairn's S3-compatible object store (single node)"
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
crc32fast = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
glob-match = "0.2"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1", "server-graceful"] }
md-5 = "0.10"
percent-encoding = "2"
rand = "0.8"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
debug = "line-tables-only"
