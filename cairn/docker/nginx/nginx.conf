# Cairn edge proxy: one origin for the Cairn Core UI and the Cairn control-plane API so the enterprise UI
# modules can call /cairn/api/* with the user's Cairn Core session cookies (no CORS needed).
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  client_max_body_size 32m;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"upstream":"$upstream_addr","trace":"$http_traceparent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS; re-resolve so container restarts do not leave stale upstream IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Embeds (BI tools / portals). Same upstream as /cairn/api/, but framable: a location-level
    # add_header disables inheritance of the server-level X-Frame-Options SAMEORIGIN, and cairn-api's own
    # Content-Security-Policy frame-ancestors (CAIRN_EMBED_ALLOWED_ORIGINS) is passed through untouched.
    location /cairn/api/embed/ {
      set $cairn_api http://cairn-api:8800;
      rewrite ^/cairn/api/(.*)$ /$1 break;
      proxy_pass $cairn_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /cairn/api;
      proxy_set_header Authorization $http_authorization;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      proxy_read_timeout 60s;
    }

    # Consumer workspace MFE (remoteEntry.js + chunks) and the embed SDK, served by cairn-consumer-ui.
    # remoteEntry.js must revalidate on every load; hashed chunks are cached by the upstream.
    location /cairn-ui/ {
      set $cairn_ui http://cairn-consumer-ui:8080;
      proxy_pass $cairn_ui;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header X-Content-Type-Options nosniff always;
      # The embed SDK is loaded by third-party pages (<script src=".../cairn-ui/embed/sdk.js">).
      add_header Cross-Origin-Resource-Policy cross-origin always;
    }

    location = /cairn-ui/remoteEntry.js {
      set $cairn_ui http://cairn-consumer-ui:8080;
      proxy_pass $cairn_ui;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
    }

    # Cairn control-plane API. Prefix is stripped: /cairn/api/quality/monitors → cairn-api:8800/quality/monitors
    location /cairn/api/ {
      set $cairn_api http://cairn-api:8800;
      rewrite ^/cairn/api/(.*)$ /$1 break;
      proxy_pass $cairn_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /cairn/api;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_pass_header Set-Cookie;
      # Streaming answers from /ai/ask (SSE).
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    # Remote-MCP endpoint for IDE agents (streamable HTTP).
    location /cairn/mcp/ {
      set $cairn_mcp http://cairn-mcp:8830;
      rewrite ^/cairn/mcp/(.*)$ /$1 break;
      proxy_pass $cairn_mcp;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # The engine's built-in developer consoles are not part of the product surface. The documented
    # APIs (/api/v2/graphql, /openapi/v*/...) stay reachable.
    location ~ ^/(openapi/swagger-ui|openapi/v3/api-docs|swagger-ui|api/graphiql)(/|$) {
      return 404;
    }

    # Everything else → Cairn Core frontend: the UI (including the /cairn/* workspace routes, which the
    # Cairn Core shell renders by mounting the MFE), /api/v2/graphql (→ cairn-core-proxy → Cairn Core), SSO callbacks.
    location / {
      set $frontend http://cairn-web:9002;
      proxy_pass $frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass_header Set-Cookie;
      proxy_read_timeout 120s;
    }
  }
}
