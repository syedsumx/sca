# Cairn edge proxy: one origin for the Cairn Core UI and the Cairn control-plane API so the enterprise UI
# modules can call /cairn/api/* with the user's Cairn Core session cookies (no CORS needed).
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  absolute_redirect off;   # redirects stay relative: the public host and port differ from ours
  client_max_body_size 32m;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"upstream":"$upstream_addr","trace":"$http_traceparent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS; re-resolve so container restarts do not leave stale upstream IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # HSTS only over HTTPS (an empty value sends no header).
  map $scheme $cairn_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
  }

  # Per-client rate limits (429 when exceeded): password sign-in and the Cairn API.
  limit_req_zone $binary_remote_addr zone=cairn_login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=cairn_api:10m rate=50r/s;
  limit_req_status 429;
  limit_req_log_level warn;

  # Health checks: an internal listener that never redirects.
  server {
    listen 8081;
    access_log off;
    location = /healthz {
      return 200 "ok\n";
    }
  }

  # The public servers are written at start by /docker-entrypoint.d/40-cairn-edge.sh: plain HTTP on
  # 8080, plus HTTPS on 8443 when a certificate is mounted at /etc/cairn/tls (tls.crt, tls.key).
  include /tmp/cairn-edge/*.conf;
}
