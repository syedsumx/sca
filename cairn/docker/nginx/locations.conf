# Routes of the edge, shared by its HTTP and HTTPS servers (see nginx.conf and 40-cairn-edge.sh).
# Embeds (BI tools / portals). Same upstream as /cairn/api/, but framable: a location-level
# add_header disables inheritance of the server-level X-Frame-Options SAMEORIGIN, and cairn-api's own
# Content-Security-Policy frame-ancestors (CAIRN_EMBED_ALLOWED_ORIGINS) is passed through untouched.
location /cairn/api/embed/ {
  set $cairn_api http://cairn-api:8800;
  rewrite ^/cairn/api/(.*)$ /$1 break;
  proxy_pass $cairn_api;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /cairn/api;
  proxy_set_header Authorization $http_authorization;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security $cairn_hsts always;
  proxy_read_timeout 60s;
}

# Consumer workspace MFE (remoteEntry.js + chunks) and the embed SDK, served by cairn-consumer-ui.
# remoteEntry.js must revalidate on every load; hashed chunks are cached by the upstream.
location /cairn-ui/ {
  set $cairn_ui http://cairn-consumer-ui:8080;
  proxy_pass $cairn_ui;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  add_header X-Content-Type-Options nosniff always;
  # The embed SDK is loaded by third-party pages (<script src=".../cairn-ui/embed/sdk.js">).
  add_header Cross-Origin-Resource-Policy cross-origin always;
  add_header Strict-Transport-Security $cairn_hsts always;
}

location = /cairn-ui/remoteEntry.js {
  set $cairn_ui http://cairn-consumer-ui:8080;
  proxy_pass $cairn_ui;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Strict-Transport-Security $cairn_hsts always;
}

# Cairn control-plane API. Prefix is stripped: /cairn/api/quality/monitors → cairn-api:8800/quality/monitors
location /cairn/api/ {
  limit_req zone=cairn_api burst=400 nodelay;
  set $cairn_api http://cairn-api:8800;
  rewrite ^/cairn/api/(.*)$ /$1 break;
  proxy_pass $cairn_api;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /cairn/api;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Authorization $http_authorization;
  proxy_pass_header Set-Cookie;
  # Streaming answers from /ai/ask (SSE).
  proxy_buffering off;
  proxy_read_timeout 300s;
}

# OAuth discovery for MCP clients (RFC 9728 / RFC 8414): served by cairn-api at the same path.
location ^~ /.well-known/oauth- {
  set $cairn_api http://cairn-api:8800;
  proxy_pass $cairn_api;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# Remote-MCP endpoint for IDE agents (streamable HTTP).
location /cairn/mcp/ {
  set $cairn_mcp http://cairn-mcp:8830;
  rewrite ^/cairn/mcp/(.*)$ /$1 break;
  proxy_pass $cairn_mcp;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_buffering off;
  proxy_read_timeout 3600s;
}

# Product documentation, served by cairn-consumer-ui. In-app help links point here.
location /docs {
  set $cairn_ui http://cairn-consumer-ui:8080;
  proxy_pass $cairn_ui;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}

# The engine's built-in developer consoles are not part of the product surface. The documented
# APIs (/api/v2/graphql, /openapi/v*/...) stay reachable.
location ~ ^/(openapi/swagger-ui|openapi/v3/api-docs|swagger-ui|api/graphiql)(/|$) {
  return 404;
}

# Password sign-in: throttled per client address against password guessing.
location = /logIn {
  limit_req zone=cairn_login burst=20 nodelay;
  set $frontend http://cairn-web:9002;
  proxy_pass $frontend;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass_header Set-Cookie;
}

# Everything else → Cairn Core frontend: the UI (including the /cairn/* workspace routes, which the
# Cairn Core shell renders by mounting the MFE), /api/v2/graphql (→ cairn-core-proxy → Cairn Core), SSO callbacks.
location / {
  set $frontend http://cairn-web:9002;
  proxy_pass $frontend;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_pass_header Set-Cookie;
  proxy_read_timeout 120s;
}
