# Runs as uid 101 on a read-only root filesystem: pid and all temp paths live in /tmp (tmpfs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Only successful responses are cacheable forever; a 404 for a chunk must not stick in caches.
  map $status $chunk_cache_control {
    200     "public, max-age=31536000, immutable";
    default "no-store";
  }

  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Shared by every location below (each sets its own Cache-Control, so CORS is repeated there:
    # nginx drops inherited add_header directives once a location declares any).
    set $cors_origin "*";

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Entry points: must revalidate so a deploy is picked up on the next page load.
    location ~ ^/cairn-ui/(remoteEntry\.js|embed/sdk\.js|embed/frame\.js|embed/frame\.html)$ {
      add_header Cache-Control "no-cache" always;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Cross-Origin-Resource-Policy cross-origin always;
      add_header X-Content-Type-Options nosniff always;
      if ($request_method = OPTIONS) { return 204; }
      try_files $uri =404;
    }

    # Content-hashed chunks and source maps: cache forever.
    location /cairn-ui/ {
      add_header Cache-Control $chunk_cache_control always;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Cross-Origin-Resource-Policy cross-origin always;
      add_header X-Content-Type-Options nosniff always;
      if ($request_method = OPTIONS) { return 204; }
      try_files $uri =404;
    }

    location / {
      return 404;
    }
  }
}
