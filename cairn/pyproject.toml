[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-platform"
version = "0.1.0"
description = "Cairn: self-hosted active metadata, governance and data quality platform built on Cairn Core: native data quality, ABAC governance, in-VPC remote agents and AI/MCP discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "croniter>=2.0",
  "cryptography>=42",
  "sqlglot>=25",
  "alembic>=1.13",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "prometheus-client>=0.20"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
ai = ["anthropic>=2.0", "mcp>=2.0"]
actions = ["acryl-datahub-actions>=1.0"]
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27",
        "opentelemetry-instrumentation-fastapi>=0.48b0", "opentelemetry-instrumentation-httpx>=0.48b0",
        "opentelemetry-instrumentation-sqlalchemy>=0.48b0"]
agent = ["acryl-datahub>=1.0"]
warehouse = ["snowflake-sqlalchemy>=1.5", "sqlalchemy-bigquery>=1.9", "databricks-sql-connector>=3.0"]
test = ["pytest>=8", "fastapi>=0.110", "pyjwt>=2.8"]
export = ["pyarrow>=15", "pyiceberg>=0.8"]
all = ["cairn-platform[server,postgres,ai,actions,agent,export]"]

[project.scripts]
cairn = "cairn.cli:main"

[project.entry-points."datahub.ingestion.sink.plugins"]
cairn-encrypted = "cairn.agent.sink:EncryptedGatewaySink"

[project.entry-points."datahub_actions.action.plugins"]
cairn_pii_propagation = "cairn.governance.propagation_action:PiiPropagationAction"
cairn_label_propagation = "cairn.governance.propagation_rules:LabelPropagationAction"
cairn_vector_indexer = "cairn.ai.indexer_action:VectorIndexerAction"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cairn = ["py.typed", "migrations/script.py.mako", "migrations/alembic.ini", "common/licence_dev_keys.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["ui", "plugins", "helm", "core/web/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# B008: FastAPI's Depends()/Query() defaults. B904/B905: style, not defects here.
ignore = ["B008", "B904", "B905"]
