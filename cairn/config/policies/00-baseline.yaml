# Cairn ABAC/RBAC policy bundle (loaded from CAIRN_POLICY_DIR at startup; later edits via
# PUT /governance/policies are versioned in the Cairn database and take precedence).
#
# Combining algorithm: deny-overrides. In additive mode, requests no policy applies to
# fall through to native Cairn Core policies; in authoritative mode they are denied.

rbac:
  roles:
    - urn: urn:li:dataHubRole:DataSteward
      description: Curates documentation, terms and certifications
      inherits: [urn:li:dataHubRole:Reader]
      privileges:
        - EDIT_ENTITY_DOCS
        - EDIT_ENTITY_GLOSSARY_TERMS
        - EDIT_DATASET_COL_*
        - EDIT_ENTITY_TAGS
        - CAIRN_APPROVE_CERTIFICATION
        - CAIRN_APPROVE_DOCUMENTATION
    - urn: urn:li:dataHubRole:DataQualityEngineer
      inherits: [urn:li:dataHubRole:Reader]
      privileges: [EDIT_ENTITY_ASSERTIONS, EDIT_ENTITY_INCIDENTS, VIEW_DATASET_*]
  bindings:
    - role: urn:li:dataHubRole:DataSteward
      subjects: [urn:li:corpGroup:data-stewards]
    - role: urn:li:dataHubRole:DataQualityEngineer
      subjects: [urn:li:corpGroup:data-platform]

policies:
  - id: deny-pii-profile-to-contractors
    description: Contractors never see profiles/samples of datasets classified as PII.
    effect: deny
    priority: 100
    actions: [VIEW_DATASET_PROFILE, VIEW_DATASET_USAGE, VIEW_ENTITY_QUERIES]
    target: {resource_types: [dataset]}
    condition:
      all:
        - {attr: subject.attributes.employment_type, op: eq, value: contractor}
        - {attr: resource.classification, op: contains, value: PII}

  - id: restricted-domain-requires-clearance
    description: Assets in the Restricted domain require clearance >= 3 for any access.
    effect: deny
    priority: 90
    actions: ["*"]
    condition:
      all:
        - {attr: resource.domains, op: contains, value: "urn:li:domain:restricted"}
        - {not: {attr: subject.attributes.clearance, op: gte, value: 3}}

  - id: owners-edit-their-assets
    description: Owners (directly or via a group) may edit docs, tags and terms on assets they own.
    effect: allow
    priority: 10
    actions: [EDIT_ENTITY_DOCS, EDIT_ENTITY_TAGS, EDIT_ENTITY_GLOSSARY_TERMS, EDIT_DATASET_COL_*, EDIT_ENTITY_ASSERTIONS]
    condition:
      any:
        - {attr: resource.owners, op: contains, value: {ref: subject.urn}}
        - {attr: resource.owners, op: contains_any, value: {ref: subject.groups}}

  - id: same-department-can-view-profiles
    description: Profiles are visible to members of the owning department (structured property io.cairn.department).
    effect: allow
    priority: 5
    actions: [VIEW_DATASET_PROFILE]
    condition:
      attr: resource.structured_properties.io.cairn.department
      op: contains
      value: {ref: subject.attributes.department}

  - id: mask-pii-for-non-stewards
    description: Viewing PII datasets is allowed, but PII columns must be masked for non-stewards.
    effect: allow
    priority: 1
    actions: [VIEW_ENTITY_PAGE, VIEW_DATASET_PROFILE]
    target: {resource_types: [dataset]}
    condition:
      all:
        - {attr: resource.classification, op: contains, value: PII}
        - {not: {attr: subject.groups, op: contains, value: "urn:li:corpGroup:data-stewards"}}
    obligations:
      - {type: mask_columns, params: {classification: PII}}

  - id: break-glass-office-hours-only
    description: The break-glass group may only edit outside office hours from the corporate network.
    effect: deny
    priority: 80
    actions: ["EDIT_*", "MANAGE_*"]
    condition:
      all:
        - {attr: subject.groups, op: contains, value: "urn:li:corpGroup:break-glass"}
        - {not: {attr: environment.ip, op: cidr, value: ["10.0.0.0/8", "192.168.0.0/16"]}}
