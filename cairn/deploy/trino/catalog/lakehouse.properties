# The `lakehouse` catalog: Iceberg tables in Cairn Catalog, data in Cairn Store.
# Trino holds no store key: with each table the catalog hands it temporary keys for that table only.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:CAIRN_CATALOG_URI}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=${ENV:CAIRN_CATALOG_TOKEN}
iceberg.rest-catalog.vended-credentials-enabled=true
fs.s3.enabled=true
s3.endpoint=${ENV:CAIRN_STORE_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
