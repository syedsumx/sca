# Trino coordinator for the Compose stack (one node that also runs queries).
coordinator=true
node-scheduler.include-coordinator=true
# Plain HTTP is for Trino's own nodes (and Cairn's access-control and lineage calls go the other way);
# clients sign in over HTTPS.
http-server.http.port=8080
discovery.uri=http://localhost:8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/keystore.p12
http-server.https.keystore.key=${ENV:CAIRN_TRINO_KEYSTORE_PASSWORD}
# Sign-in: tokens Cairn issues (POST /v1/trino/token), checked against Cairn's public key.
http-server.authentication.type=JWT
http-server.authentication.jwt.key-file=${ENV:CAIRN_API_URL}/v1/trino/jwks.json
http-server.authentication.jwt.required-issuer=${ENV:CAIRN_TRINO_TOKEN_ISSUER}
http-server.authentication.jwt.required-audience=trino
internal-communication.shared-secret=${ENV:CAIRN_TRINO_SHARED_SECRET}
# Lineage (OpenLineage) and usage (who read what) both go to Cairn.
event-listener.config-files=/etc/trino/event-listener.properties,/etc/trino/usage-listener.properties
