# Trino asks Cairn before every action (Trino's OPA access-control plugin, answered by Cairn's policy
# engine): table visibility, reads, writes, DDL, column masks and row filters. The key in the path is
# CAIRN_TRINO_ACCESS_KEY, shared with the Cairn API.
access-control.name=opa
opa.policy.uri=${ENV:CAIRN_API_URL}/v1/trino/${ENV:CAIRN_TRINO_ACCESS_KEY}/allow
opa.policy.batched-uri=${ENV:CAIRN_API_URL}/v1/trino/${ENV:CAIRN_TRINO_ACCESS_KEY}/batch
opa.policy.row-filters-uri=${ENV:CAIRN_API_URL}/v1/trino/${ENV:CAIRN_TRINO_ACCESS_KEY}/row-filters
opa.policy.column-masking-uri=${ENV:CAIRN_API_URL}/v1/trino/${ENV:CAIRN_TRINO_ACCESS_KEY}/column-mask
