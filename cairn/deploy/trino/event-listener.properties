# Lineage: Trino's OpenLineage event listener sends every query that writes to Cairn, which records it
# as a run of a job named after the tables it writes (inputs, outputs, column lineage and SQL).
event-listener.name=openlineage
openlineage-event-listener.transport.type=HTTP
openlineage-event-listener.transport.url=${ENV:CAIRN_API_URL}
openlineage-event-listener.transport.endpoint=/v1/trino/${ENV:CAIRN_TRINO_ACCESS_KEY}/lineage
openlineage-event-listener.trino.uri=${ENV:CAIRN_TRINO_URI}
