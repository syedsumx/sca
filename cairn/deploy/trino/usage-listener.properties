# Usage: Trino's HTTP event listener sends every finished query (its user, and the tables and columns it
# read) to Cairn, which counts the reads into each dataset's usage statistics.
event-listener.name=http
http-event-listener.log-completed=true
http-event-listener.connect-ingest-uri=${ENV:CAIRN_API_URL}/v1/trino/${ENV:CAIRN_TRINO_ACCESS_KEY}/queries
