# Tenant isolation (tenant.sh with CAIRN_INGRESS_NAMESPACE fills @...@): nothing from another tenant's
# namespace reaches this one. Within it, Cairn's own pods are reached by the release, the ingress
# controller and Prometheus; the chart's narrower policies still apply to each component (network
# policies only add up: a pod admits what any policy selecting it allows).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cairn-tenant-isolation
  namespace: @NS@
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cairn, app.kubernetes.io/instance: @RELEASE@ }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: @INGRESS_NAMESPACE@ }
@MONITORING_FROM@
---
# The tenant's workloads that are not part of the release (Spark drivers and executors, notebook
# servers) talk to each other inside the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cairn-tenant-workloads
  namespace: @NS@
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: NotIn, values: [@RELEASE@] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
