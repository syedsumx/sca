# The platform namespace: nothing reaches it unless allowed below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: cairn-platform }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# PostgreSQL: tenants' namespaces (each signs in as its own role), the instances to each other
# (replication), the operator, and Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: cairn-pg, namespace: cairn-platform }
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: cairn-pg }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions: [{ key: cairn.io/tenant, operator: Exists }]
      ports: [{ port: 5432 }]
    - from:
        - podSelector:
            matchLabels: { cnpg.io/cluster: cairn-pg }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
    - from:
        - namespaceSelector:
            matchLabels: { cairn.io/role: monitoring }
      ports: [{ port: 9187 }]
