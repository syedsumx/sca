# Let's Encrypt for each tenant's host (HTTP-01 through ingress-nginx). Tenants use "letsencrypt";
# try "letsencrypt-staging" first while testing (its certificates are not trusted, its limits are high).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "@ACME_EMAIL@"
    privateKeySecretRef: { name: letsencrypt-account }
    solvers:
      - http01: { ingress: { ingressClassName: nginx } }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: "@ACME_EMAIL@"
    privateKeySecretRef: { name: letsencrypt-staging-account }
    solvers:
      - http01: { ingress: { ingressClassName: nginx } }
