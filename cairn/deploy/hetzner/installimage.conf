# Hetzner installimage: Ubuntu 24.04 on the two NVMe drives, mirrored (RAID 1), no swap.
# In the Robot console boot the server into the rescue system, then on it:
#   installimage -a -c installimage.conf -n cairn-1        (the node's name from cluster.env)
# and reboot. Check the drive names with `lsblk` first (some models have more or other drives). On a
# server that boots with UEFI, add the line PART /boot/efi esp 256M before PART /boot.
DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1
SWRAID 1
SWRAIDLEVEL 1
BOOTLOADER grub
HOSTNAME cairn-node
PART /boot ext4 1G
PART / ext4 all
IMAGE /root/.oldroot/nfs/install/../images/Ubuntu-2404-noble-amd64-base.tar.gz
